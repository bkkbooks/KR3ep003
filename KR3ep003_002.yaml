其為伏飲無疑脘痞胸痛合之脈弦其為肝鬱無疑上年夏日曾得淋症誤服六味酸甘化陰致令其濕熱穩伏久踞故證現龐雜無倫治法以宣通三焦使邪有出路安胃能食為要生石膏八錢半夏五錢旋覆花三錢滑石一兩蠶砂三錢香附三錢生苡仁五錢茯苓皮五錢鬱金三錢通草二錢杏仁泥三錢萆薢四錢初六日其人本有飲症又加內暑外涼在經之邪似瘧而未成在腑之邪泄瀉不止恐成痢疾急以提邪外出為要按六脈俱弦之泄瀉古謂之木泄即以小柴胡湯為主方況加之寒熱往來乎六脈俱弦古謂脈雙弦者寒也指中焦虛寒而言豈補水之生熟地所可用哉現在寒水客氣燥金司天而又大暑節氣與柴胡二桂枝一法柴胡六錢炙甘草一錢桂枝三錢黃芩二錢半夏六錢生薑三錢焦白芍二錢大棗二錢藿梗三錢廣皮二錢青蒿二錢寒熱止即止初八日寒暑兼受成瘧則輕成痢則重前用柴胡二桂枝一法現在面色青熱退痰多而稀舌之赤者亦淡脈之弦徑者微細不渴陽虛可知與桂枝柴胡各半湯減黃芩加乾薑桂枝二錢半夏六錢柴胡三錢黃芩一錢炒白芍錢半炒生甘草二錢乾薑三錢生薑五錢大棗三錢煮三杯分三次服初九日內暑外寒相搏成瘧大便溏泄恐致成痢口乾不渴經謂自利不渴者屬太陰也合之腹痛則更可知矣仲景謂表急急當救表裡急急當救里茲表裡無偏急象議兩救之救表仍用柴胡桂枝各半法以太少俱有邪也救里與理中法桂枝四錢黃芩炭二錢生苡仁五錢白芍二錢炒乾薑三錢炙甘草錢半川椒炭三錢柴胡四錢良薑二錢半夏六錢白蔻仁錢半生薑五錢大棗二個初十日昨用兩救表裡已見小效今日仍宗前法而退之脈中陽氣已有生動之機故也不可性急反致僨事桂枝三錢黃芩錢半炒厚朴二錢白芍二錢炒乾薑二錢炙甘草錢半川椒炭二錢柴胡三錢煨草果一錢半夏六錢生薑五錢大棗二個十一日內而痰飲蹯踞中焦外而寒暑擾亂胃陽連日已奪去成痢疾之路一以和中蠲飲為要蓋無形之邪每借有形質者以為依附也青蒿三錢小枳實三錢黃芩炭錢半杏仁泥三錢茯苓皮五錢柴胡三錢半夏一兩廣皮二錢白蔻仁錢半生苡仁五錢桂枝三錢炒白芍二錢生薑三片十二日雜受寒暑再三分析方成瘧疾寒多熱少脈沉弦乃邪氣深入與兩分陰陽之中偏於溫法青蒿三錢半夏八錢檳榔一錢柴胡三錢厚朴三錢良薑二錢黃芩炭錢半枳實二錢藿梗三錢生薑五片栝蔞皮二錢大棗二個十四日寒熱少減胸痞甚去甘加辛去棗加生薑十六日脈弦細指尖冷陽微不及四末之故兼之腹痛便溏痰飲咳嗽更可知矣以和胃陽溫中湯逐痰飲立法半夏六錢良薑二錢杏仁三錢川椒炭三錢乾薑二錢炒廣皮三錢桂枝三錢蔻仁二錢生苡仁五錢生薑三片張十七日伏暑酒毒遇寒涼而發九日不愈脈緩而飲滯下身熱譫語濕熱發黃先清濕熱開心包茵陳五錢茯苓皮五錢黃連二錢梔子炭二錢通草一錢黃柏炭三錢滑石五錢生苡仁三錢黃芩三錢十八日熱退滯下已愈黃未解茵陳三錢黃連八分茯苓皮五錢滑石五錢梔子炭三錢杏仁三錢黃柏炭三錢通草一錢燈草一錢萆薢三錢十九日黃亦少退脈之軟者亦鼓指惟舌赤小便赤濁余濕餘熱未盡尚須清之茯苓皮五錢茵陳四錢生苡仁三錢黑梔子三錢杏仁三錢黃柏炭二錢半夏三錢黃連八分廣皮炭二錢萆薢三錢滑石五錢二十日黃退小便赤濁舌赤脈洪濕熱未淨滑石五錢梔皮二錢炒萆薢三錢黃連一錢海金砂三錢半夏三錢王二十八歲乙酉三月二十日上年初秋伏暑午後身熱汗出醫者誤以為陰虛勞損不食胸痞咳嗽舌苔白滑四肢倦怠不能起床至今三月不解已經八月之久深痼難拔勉與宣化三焦兼從少陽提邪外出法桂枝三錢蔻仁二錢黃芩二錢炒青蒿三錢茯苓皮五錢滑石六錢苡仁五錢半夏五錢杏仁四錢廣皮三錢通草一錢此藥服二帖能進飲食服四帖飲食大進即能起行立後八日復診以調理脾胃而愈李十八歲十一月初九日伏暑如瘧狀脈弦數寒熱往來熱多於寒解後有汗與青蒿鱉甲湯五帖而愈金氏三十歲乙酉四月二十二日上年伏暑寒熱時發如瘧狀以通宣三焦立法補水補火皆妄也杏仁三錢藿梗三錢蔻仁五錢茯苓皮五錢苡仁五錢半夏四錢青蒿八分炒黃芩二錢生薑二錢大棗二個服四帖初二日伏暑愈後以平補中焦為要仍須宣通勿得黏滯半夏三錢蓮子五錢去心皮廣皮二錢益智仁一錢茯苓五錢生薑三片生苡仁五錢某九月二十四日初因肝鬱繼因內飲招外風為病現在寒熱如瘧狀又有伏暑內發新涼外加之象六脈弦細而緊兩關獨大而浮厥陰克陽明醫者全然不究病從何來亦不究脈象之是陰是陽一概以地黃等柔藥補陰以陰藥助陰病人命其何堪哉勢已沉重欲成噎食反胃勉與兩和肝胃兼提少陽之邪外出法桂枝三錢蔻仁二錢川椒炭二錢青蒿一錢苡仁三錢杏仁三錢半夏六錢香附三錢生薑四錢廣皮三錢旋覆花三錢二十八日寒熱減半嘔止舌苔滿黃但仍滑耳於前方內加黃芩二錢炒再服四帖如一二帖內寒熱止去青蒿若舌苔乾燥腹痛止去川椒加茯苓五錢十月初六日伏暑已解七八痰飲肝鬱未除下焦且有濕熱杏仁四錢旋覆花三錢通草一錢蔻仁三錢香附三錢萆薢五錢苡仁五錢半夏五錢蠶砂三錢茯苓皮五錢廣皮二錢煮三杯分三次服數帖痊愈陶五十八歲乙酉九月十八日伏暑遇新涼而發舌苔裛白上灰黑六脈不浮不沉而數誤與發表胸痞不食此危證也何以云危蓋四氣雜感又加一層腎虛又加一層肝鬱又加一層誤治又加一層酒客中虛何以克當勉與河間之苦辛寒法一以宣通三焦而以肺氣為主望其氣化而濕熱俱化也杏仁四錢鬱金三錢藿香葉三錢蔻仁三錢黃芩三錢黃連一錢苡仁五錢滑石五錢半夏五錢茯苓皮五錢通草一錢廣皮三錢二十三日舌之灰化為黃滑而不燥唇赤顴赤脈之弦者化而為滑數是濕與熱俱重也杏仁泥五錢茯苓六錢木通五錢蔻仁三錢茵陳五錢苡仁五錢黃連二錢滑石一兩黃柏炭四錢半夏五錢二十六日伏暑舌之灰者化黃茲黃雖退而白滑未除當退苦藥加辛藥脈滑甚重加化痰小心復感要緊杏仁五錢鬱金三錢滑石一兩蔻仁三錢藿梗三錢苡仁五錢枳實三錢半夏一兩黃柏炭三錢廣皮三錢茯苓皮六錢煮三杯分三次服十月初二日伏暑雖退舌之白滑未化是暑中之伏濕尚存也小心飲食要緊脈之滑大者已減是暑中之熱去也無奈太小而不甚流利是陽氣未充不能化濕重與辛溫助陽氣化濕氣杏仁泥五錢廣皮五錢半夏六錢蔻仁三錢益智仁三錢川椒炭三錢苡仁五錢乾薑三錢木通三錢煮三杯分三次服以舌苔黃為度初六日伏暑之外感者因大汗而退舌白滑苔究未能化黃前方大用剛燥未除也務要小心飲食毋使脾困杏仁泥四錢煨草果八分益智仁三錢蔻仁三錢茅朮炭三錢半夏五錢苡仁五錢廣皮炭五錢厚朴二錢茯苓皮五錢神麯炭三錢王氏二十二歲二月二十六日伏暑咳嗽寒熱將近一年不解難望回生既咳且嘔而泄瀉勉與通宣三焦俾邪有出路或者得有生機何以知其為伏暑而非勞瘵勞之咳重在醜寅卯木旺之時或午前或終日濕家之咳旺在戌亥子勞之寒熱後無汗伏暑寒熱如瘧狀醜寅卯陽升乃有汗而止勞之陰虛身熱脈必芤大伏暑之脈弦細而弱故知其為伏暑而非勞瘵也再左邊久不著席此水在肝也生苡仁五錢廣皮三錢蔻仁二錢半夏五錢茯苓皮五錢鬱金一錢青蒿八分香附三錢桂枝三錢旋覆花三錢生薑三片大棗二個煮三杯分三次服此方服四帖寒熱減去青蒿又服十帖後健脾胃收功裘四十歲乙酉八月初五日酒客中虛濕重面色滯暗業已有日現在又感伏暑新涼頭脹便溏舌白滑脈弦細中虛寒濕可知不能戒酒斷乎病不除根蓋客症易除久病伏濕虛寒難退也杏仁三錢廣皮五錢藿梗三錢苡仁一兩半夏六錢黃芩炭六錢蔻仁三錢茯苓一兩青蒿二錢煮三杯分三次服頭脹除去青蒿服七帖愈周五歲本系伏暑誤以為風寒挾食發表消導難進致邪氣深入下焦血分夜熱早涼與煎厥疸瘧相似食減脈大汗多便結先與救陽明之陰梨汁一酒杯藕汁一酒杯鮮蘆根汁半酒杯荸薺汁一酒杯元參五錢連心麥冬五錢三帖溫毒劉甲子五月十三日面赤腫喉痛身熱自汗舌黃馬勃三錢銀花六錢牛蒡子六錢荊芥穗二錢元參六錢薄荷錢半人中黃二錢桔梗五錢連翹六錢射干二錢板藍根三錢桑葉六錢共為粗末分七包一時許服一包蘆根湯煎十四日用前法十五日於前方內加黃連二錢黃芩三錢某甲子五月十一日溫毒喉痛發疹腿痠痛甚重症也須用急急輕揚恐其聚而為災也馬勃五錢射干五錢薄荷五錢元參一兩連翹一兩二錢荊芥穗六錢桔梗兩半殭蠶五錢板藍根三錢銀花一兩牛蒡子八錢人中黃四錢共為粗末七錢一包一時服一包通十二時服十包服完再作服蘆根湯煎二帖愈王氏二十三歲甲子五月十一日溫毒頰腫脈伏而象模糊此謂陽證陰脈耳面目前後俱腫其人本有瘰癧頭痛身痛譫語肢厥勢甚凶危議普濟消毒飲法連翹一兩二錢牛蒡子八錢銀花兩半荊芥穗四錢桔梗八錢薄荷三錢人中黃四錢馬勃五錢元參八錢板藍根三錢共為粗末分十二包一時許服一包蘆根湯煎服腫處敷水仙膏用水仙花根去蘆搗爛敷之中留一小口干則隨換出毒後敷三黃二香散三黃二香散黃連一兩黃柏一兩生大黃一兩乳香五錢沒藥五錢上為極細末初用細茶汁調敷干則易之繼用香油調敷十二日脈促即於前方內加生石膏三兩知母八錢十三日即於前方內加犀角八錢黃連三錢黃芩六錢十四日於前方內加大黃五錢十五日於前方內去大黃再加生石膏一兩十六日於前方內加金汁半茶杯分次衝入藥內服十八日脈出身壯熱邪機向外也然其勢必凶當靜以鎮之勿事荒張稍有譫語即服牛黃清心丸一二丸其湯藥仍用前方二十日腫消熱退脈亦靜用復脈湯七帖全愈王二十三歲乙丑八月十一日溫毒發斑時在初秋盛暑未消何妄用大汗大下之傷寒六經法悖謬已極右脈洪大芤甚渴甚汗太甚急急重用化斑湯生石膏四兩細生地一兩知母二兩京米一兩炙甘草一兩犀角五錢水八碗煮三碗分三次服渣再以水五碗煮兩碗夜間明早服至已前完史二十二歲溫毒三日喉痛脹滴水不下身熱脈洪數先以代賑普濟散五錢煎湯去渣嗽口與喉噙化少時俟口內有涎即控吐之再嗽再化再吐如是者三五時喉即開可服藥矣計用代賑普濟散二兩後又用五錢一次與服每日十數次三日而喉痛止繼以玉女煎五帖熱全退後用復脈湯七帖收功代賑普濟散方主治溫毒喉痹項腫發疹發斑溫痘牙痛楊梅瘡毒上焦一切風熱皮毛痱痤等證如病極重者晝夜服十二包至輕者服四包量病增減如喉痹滴水不下咽者噙一大口仰面浸患處少時有稀痰吐出再噙再吐四五次喉即開服藥後如大便頻數甚至十數次者勿畏也毒盡前愈如服三五次大便尚堅結不通者每包可加酒炒大黃五六分或一錢桔梗十兩牛蒡子八兩黃芩六兩炒人中黃四兩荊芥穗八兩銀花一兩蟬蛻六兩馬勃四兩板藍根四兩薄荷四兩元參十兩大青葉六兩生大黃四兩炒黑連翹十兩連心殭蠶六兩射干四兩上為粗末每包五錢小兒減半瓷瓶收好勿出香氣按此方用東垣普濟消毒飲去直升少陽陽明之升麻柴胡直走下焦之黃連合化清氣之培賑散改名曰代賑普濟散大意化清氣降濁氣穢毒自開也方名代賑者凶荒之後必有溫疫凶荒者賑之以谷溫疫者賑之以藥使貧者病者皆得食賑故方名代賑也李四十歲周身斑疹夾紫黑痘數百枚與代賑普濟散日五兩服至七日後愈戴氏感受穢濁滿面滿脊楊梅密布與代賑普濟散每日六兩九日消盡徐五十一歲己酉五月二十日因濕毒而發天行楊梅瘡脈弦兼有外風代賑普濟散每日服三包每包五錢加土茯苓五錢煎三杯分二次服日共六次陳三十二歲溫熱面赤口渴煩躁六七日壯熱大汗鼻衄六脈洪數而促左先生用五苓散雙解表裡余曰此溫病陽明經證也其脈促有燎原之勢豈緩藥所能挽回非白虎不可生石膏八兩知母一兩生甘草五錢粳米二合白茅根一兩側柏葉炭八錢煮四碗分四次服盡劑而脈靜身涼脈經謂數而時一止曰促緩而時一止曰結按古方書從無治促結之明文餘一生治病凡促脈主以石膏結脈主以杏仁蓋促為陽屬火故以石膏得肺胃之陽結脈屬陰乃肺之細管中塊痰堵截隧道而然故以杏仁利肺氣而消塊痰之陰無不如意然照世人用藥石膏用七八錢杏仁用三五錢必無效也吾嘗謂未能學問思辨而驟然篤行豈非孟浪之極既已學問思辨而不能篤行豈非見義不為無勇乎濕溫王三十三歲壬戌四月二十二日證似溫熱但心下兩脅俱脹舌白渴不多飲嘔惡噯氣則非溫熱而從濕溫例矣用生薑瀉心湯之苦辛通降法生薑一兩乾薑五錢茯苓六錢生薏仁五錢半夏八錢黃芩三錢炒黃連三錢生香附五錢水八碗煮三茶杯分三次服約二時服一次二煎用水三杯煎一茶杯明早服二十三日心下陰霾已退濕已轉陽應清氣分之濕熱連翹五錢杏泥仁三錢銀花五錢藿梗三錢蘆根五寸滑石五錢熟石膏五錢黃芩炭三錢鬱金三錢黃連二錢水八碗煎三碗分三次服渣再煮一碗服二十四日斑疹已現氣血兩燔用玉女煎合犀角地黃湯法生石膏兩半牛蒡子六錢知母四錢元參八錢銀花一兩薄荷三錢連翹一兩細生地六錢犀角三錢桔梗四錢黃芩四錢炒人中黃一錢二十五日面赤舌黃大渴脈沉肢厥十日不大便轉矢氣譫語下證也小承氣湯生大黃八錢枳實五錢厚朴四錢水八碗煮三碗先服一碗約三時得大便止後服不便再服第二碗又大便後宜護津液議增液法麥冬一兩連心連翹三錢細生地一兩銀花三錢元參三錢甘草二錢炒煮三杯分三次服能寐不必服二十六日陷下之餘邪不清仍思涼飲舌黃微以調胃承氣湯小和之生大黃二錢元明粉八分生甘草一錢二十七日昨日雖大解而不爽脈猶沉而有力身熱不退而微厥渴甚面赤猶宜微和之但恐犯數下之戒議增液承氣合玉女煎法生石膏八錢知母四錢黃芩三錢生大黃三錢另煎分為三份每次沖一分服煮成三碗分三次服若大便稀而不結不黑後服勿沖大黃二十八日大便雖不甚爽今日脈浮不可下渴思涼飲氣分熱也口中味甘脾熱甚也議用氣血兩燔例之玉女煎加苦藥以清脾疸生石膏三兩黃連三錢元參六錢麥冬一兩細生地一兩知母三錢黃芩六錢煮四碗分四次服得涼汗止後服不渴止後服二十九日大用辛涼微合苦寒斑疹續出如許身熱退其大半不得再用辛涼重劑議甘寒合化陰氣加辛涼以清斑疹連翹三錢元參四錢細生地五錢銀花三錢黃芩三錢花粉三錢黃連二錢薄荷一錢麥冬五錢犀角三錢煮三碗三次服渣再煮一碗服大熱雖減余焰尚存口甘弄舌面光赤色未除猶宜甘寒苦寒合法連翹三錢細生地六錢黃芩三錢丹皮三錢元參四錢黃連二錢麥冬五錢銀花三錢水八碗煮三碗分三次服初二日於前方內加犀角二錢知母錢半初三日邪少虛多宜用復脈去桂棗以其人本系酒客再去甘草之重甘加二甲丹皮黃芩此甘潤化液復微苦化陰又苦甘鹹寒法初四日尚有餘邪未盡以甘苦合化入陰搜邪法元參二兩黃芩二錢麥冬八錢知母二錢細生地六錢生鱉甲八錢銀花三錢丹皮五錢連翹三錢青蒿一錢頭煎三茶碗二煎一茶碗分四次服陳二十二歲乙丑四月十七日面赤目赤舌苔滿布如積粉至重之溫病也最忌發表且用辛涼荊芥穗五錢薄荷四錢生甘草三錢桔梗六錢連翹八錢銀花八錢藿香葉五錢牛蒡子五錢杏仁五錢共為粗末分八包一時許服一包蘆根湯煎去渣服某初九日面赤目赤舌苔滿布至重之溫熱病脈反緩而弦外熱反不盛口反不渴肢微厥所謂陽證陰脈乃本身陽氣不能十分充滿不肯化解耳茲與化邪法荊芥穗二錢鬱金二錢藿梗二錢豆豉錢半銀花二錢連翹心錢半青蒿一錢桔梗錢半薄荷八分杏仁泥二錢今晚一帖明早一帖十一日溫病未有不渴而燥者今舌苔布滿而不渴雖黃而滑脈緩甚熱不壯蓋挾濕之故也議照濕溫例治用苦辛寒法生蒼朮三錢廣皮二錢鬱金三錢黃連一錢蔻仁一錢連翹三錢銀花二錢藿香二錢天花粉三錢黃芩一錢炒今晚一帖明早一帖各兩杯兩帖而安陳三十三歲初八日六脈弦細而徑陰寒脈也咳嗽稀痰陰濕咳也舌苔刮白而滑陰舌苔也嘔吐泄瀉陰濕證也雖發熱汗出而解乃濕中兼風病名濕溫天下有如是之陰虛證乎茯苓四錢澤瀉四錢桂枝三錢於朮三錢炒白芍二錢生苡仁五錢半夏五錢廣皮炭二錢生薑汁三匙沖初十日痰飲兼風誤治成壞證前用溫平逐濕除風諸惡證俱成惟寒少熱多熱後汗出未除現在面赤口渴暮夜譫語有風化熱之象但六脈尚弦未盡轉陽也再咳嗽則胸脅小腹俱微痛又有金剋木之象桂枝三錢茯苓四錢杏仁三錢青蒿三錢炙甘草三錢半夏二錢炒白芍二錢生薑三片豬苓五錢石膏六錢大棗二個十四日脈弦數午後潮熱前有白苔復變黃苔嘔惡口渴頗有濕瘧之象但咳嗽便溏又有濕溫之形伏邪內陷所致最難清理桂枝四錢茯苓皮五錢生石膏八錢青蒿二錢知母三錢杏仁泥三錢炙甘草二錢苡仁五錢滑石六錢某初十日六脈俱弦而細左手沉取數而有力面色淡黃目白睛黃自春分午後身熱至今不愈曾經大瀉後身軟不渴現在雖不泄瀉大便久未成條午前小便清午後小便赤濁與濕中生熱之苦辛寒法茵陳四錢杏仁三錢滑石六錢茯苓皮五錢通草錢半黃連一錢苡仁四錢蠶砂三錢黃芩二錢海金砂四錢蒼朮炭三錢十三日前方內去蒼朮加石膏增芩連文三十八歲丁卯七月初二日濕溫舌苔白滑厚濁脈象模糊弦細而且沉濡用通三焦法先寒熱繼微熱後不熱更方三十餘帖大抵不出滲濕之苦辛淡法四十五日以後方解解後以兩和脾胃收功冬溫張六十八歲甲子十一月二十五日舌黃口渴頭不痛而惡寒面赤目赤脈洪熱甚形似傷寒實乃冬溫夾痰飲與伏暑一類連翹六錢桔梗八錢杏仁六錢荊芥穗五錢銀花六錢甘草三錢半夏八錢廣皮三錢鬱金三錢通草三錢藿梗七錢共為粗末分七包一時許服一包蘆根湯煎二十六日前方內減荊芥穗通草二十七日餘熱未清連翹三錢杏仁三錢知母二錢炒桔梗三錢薄荷一錢小生地三錢黃芩錢半甘草一錢銀花二錢水五杯煮兩杯二次服二帖二十九日溫病渴甚熱甚面赤甚脈洪甚杏仁五錢生甘草三錢半夏四錢銀花五錢石膏八錢連翹六錢鬱金二錢荊芥穗三錢薄荷三錢桔梗五錢三十日溫病最忌食復況年老氣血已衰再復則難治矣口渴甚痰多脅痛前方加香附一錢煮三杯分三次服二帖初一日大勢已退餘熱尚存仍須清淡數日無使食復細生地五錢麥冬五錢連翹三錢銀花三錢丹皮二錢甘草二錢元參二錢黃芩錢半頭煎二杯二煎一杯分三次服初二日脈洪滑於前方內加半夏三錢某三月二十二日脈不浮而細數大渴欲飲大汗里不足之熱病也用玉女煎法生石膏一兩甘草三錢桑葉三錢知母四錢麥冬五錢細生地五錢粳米一撮二十三日溫熱大渴大汗脈數昨用玉女煎法諸證俱減平素有消渴病服昨藥後大便稀溏加牡蠣一面護陰一面收下生石膏五錢炒知母二錢炙甘草三錢大生地五錢麥冬五錢京米一撮牡蠣一兩某初一日冬溫脈沉細之極舌赤面赤譫語大便閉邪機純然在血分之裡與潤下法元參六錢元明粉一錢細生地六錢麥冬六錢連心生大黃五錢丹皮三錢生甘草二錢煮三杯先服一杯得便止後服湯藥之先先服牛黃清心丸二丸初三日冬溫譫語神昏皆誤表之故邪在心包宜急急速開膻中不然則內閉外脫矣大便閉面正赤昨與潤下法未通經謂下不通非細故也得藥則嘔忌甘也先與牛黃清心丸二三丸以開膻中繼以大承氣湯攻陽明之實生大黃八錢元明粉三錢枳實四錢厚朴二錢元參八錢丹皮五錢煮三杯得便則止不便再服

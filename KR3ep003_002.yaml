body:
  text: 卷二暑溫甘二十四歲壬戌六月二十九日暑溫邪傳心包譫語神昏右脈洪大數實而模糊勢甚危險細生地六錢知母五錢銀花八錢元參六錢連翹六錢生甘草三錢麥冬六錢竹葉三錢生石膏一兩煮三碗分三次服牛黃丸二丸紫雪丹三錢溫邪入心包絡神昏痙厥極重之症連翹三錢竹葉三錢銀花三錢生石膏六錢細生地五錢甘草錢半知母三錢麥冬五錢連心今晚一帖明早一帖再服紫雪丹四錢周五十二歲壬戌年七月十四日世人悉以羌防柴葛治四時雜感竟謂天地有冬而無夏不亦冤哉以致暑邪不解深入血分成厥衄血不止夜間煩躁勢已膠錮難解焉得速功鮮蘆根一兩丹皮五錢荷葉邊一張羚羊角三錢元參五錢杏仁三錢桑葉三錢滑石三錢犀角三錢細生地五錢今晚一帖明早一帖十五日厥與熱似乎稍緩據云夜間煩躁亦減是其佳處但脈沉弦細數非痙厥所宜急宜育陰而戀陽復咸以止厥法生地六錢元參六錢麥冬八錢連心生白芍四錢桑葉三錢羚羊角三錢丹皮三錢犀角三錢生鱉甲六錢日服二帖十六日脈之弦剛者大覺和緩沉者已起是為起色但熱病本屬傷陰況醫者誤以傷寒溫燥藥五六帖之多無怪乎舌燥如草也議啓腎液法元參一兩丹皮五錢桑葉二錢犀角三錢天冬三錢麥冬五錢沙參三錢銀花三錢生鱉甲八錢日服三帖十七日即於前方內加連翹錢半鮮荷葉邊三錢細生地六錢再按暑熱之邪深入下焦血分身半以下地氣主之熱來甚於上焦豈非熱邪深入之明徵乎必借芳香以為搜邪之用不然恐日久膠固之邪一時難解也則真陰正氣日虧一日矣紫雪丹之必不可少也紫雪丹錢半分三次服十八日厥已回面赤舌乾黑苔脈洪數有力十餘日不大便皆下證也人雖虛然亦可以調胃承氣小和之生大黃五錢元明粉三錢沖生甘草三錢先用一半煎一茶杯緩緩服俟夜間不便再服下半劑服前方半劑即解黑大便多許便後用此方生白芍六錢大生地一兩麥冬一兩生鱉甲一兩十九日大下宿糞如許舌苔化而干未滋潤脈仍洪數微有潮熱除存陰無二法生白芍六錢沙參六錢炙甘草三錢麥冬六錢丹皮四錢牡蠣五錢天冬三錢大生地一兩鱉甲五錢日服二帖二十一日小便短而赤甚微咳面微赤尺脈仍見數洪象議甘潤益下以治虛熱少復苦味以治不盡之實邪且甘苦合化陰氣而利小便也按甘苦合化降氣利小便法舉世不知在溫熱門中誠為利小便之上等法蓋熱傷陰液小便無由而生故以甘潤益水之源小腸火腑非苦不通為邪熱所助故以苦藥瀉小腸而退邪熱甘得苦則不呆膩苦得甘則不剛燥合而成功也炙甘草四錢生鱉甲八錢生白芍六兩元參五錢阿膠三錢麥冬六錢麻仁三錢丹皮三錢沙參三錢黃連一錢二十二日已得效仍服前方二帖二十三日復脈復苦法清下焦血分之陰熱炙甘草五錢生鱉甲五錢麥冬五錢生白芍六錢阿膠三錢丹皮五錢麻仁五錢天冬二錢元參三錢日服二帖王三十八歲癸亥六月初三日暑溫舌苔滿布色微黃脈洪弦而剛甚左反大於右不渴初起即現此等脈症恐下焦精血之熱遠甚於上焦氣分之熱也且舊有血溢故手心之熱又甚於手背究竟初起且清上焦然不可不免知其所以然連翹二錢豆豉錢半細生地錢半丹皮二錢銀花二錢生甘草一錢藿梗一錢元參錢半薄荷三分牛蒡子錢半白茅根二錢麥冬二錢苦桔梗一錢初六日熱退大半胸痞腹中自覺不和按暑必挾濕熱退濕存之故先清氣分連翹二錢豆豉二錢杏仁泥二錢銀花錢半生苡仁三錢白扁豆二錢藿梗三錢白通草八分鬱金二錢滑石錢半日二帖初七日病退六腑不和藿梗三錢鬱金一錢半夏二錢厚朴二錢豆豉二錢生苡仁三錢廣皮炭一錢滑石三錢初八日向有失血又屆暑病之後五心發熱法當補陰以配陽但脈雙弦而細不惟陰不充足即真陽亦未見其旺也議二甲復脈湯仍用舊有之桂參薑棗炒白芍四錢阿膠二錢麥冬三錢麻仁二錢炙甘草五錢生鱉甲五錢沙參三錢大生地四錢生牡蠣五錢桂枝二錢大棗二個生薑二片又丸方八仙長壽丸加麻仁白芍蜜丸每日三服每服三錢馬三十八歲癸丑年六月初六日暑熱本易傷陰誤用消導攻伐重傷陰氣致令頭中耳中鳴無止時此係肝風內動若不急救肝腎之陰瘛瘲熱厥至矣炒白芍六錢炙甘草三錢生鱉甲五錢大生地六錢麥冬五錢生牡蠣五錢丹皮三錢桑葉三錢茶菊炭二錢麻仁二錢便不實去此服四帖十二日外邪雖退無奈平素勞傷太過虛不肯復六脈無神非參不可沙參三錢大生地六錢阿膠三錢元參六錢麻仁三錢生鱉甲六錢麥冬六錢生白芍六錢炙甘草四錢得大便後去元參加牡蠣三錢人參三錢桂枝大棗二枚生薑一片七月初六日病後飲食不調又兼暑濕著里腹中絞痛痛極便溏脈微數欲作滯下議芩芍法奪其滯下之源黃芩炭一錢二分小茴香炭八分廣木香一錢厚朴二錢焦白芍錢半黃連炭八分炒廣皮錢半枳實一錢神麯炭二錢山楂炭錢半一二帖後腹痛除仍服復脈湯服十餘帖榮十五歲乙丑六月十一日暑溫挾痰飲怒郁故脈芤身熱而脅痛誤用足六經表藥煩躁不寧六日不解至危之證生香附三錢旋覆花三錢連翹二錢藿梗三錢生石膏四錢杏仁三錢薄荷一錢鬱金二錢每帖煮兩杯分二次服三時一帖服二日大見效再商十三日於前方內加青橘葉二錢鮮荷葉邊一張蘆根五錢暑傷足太陰發為䐜脹渴不欲飲飲則嘔身微熱舌白滑肢逆二便閉塞病在中焦居多以香開六腑濁氣為主半夏五錢藿梗三錢廣皮二錢枳實三錢厚朴四錢生香附三錢鬱金二錢生苡仁三錢白蔻仁二錢杏泥三錢旋覆花三錢煮兩杯分二次服今日一帖明日一帖孫四十五歲乙丑六月初六日頭痛左關獨高責之少陽內風掀動最有損一目之弊若以為外感風寒則遠甚矣議清少陽膽絡法再此症除左關獨高餘脈皆緩所謂通體皆寒一隅偏熱故先清一隅之熱金匱謂先治新病舊病當後治也羚羊角二錢苦桔梗二錢生甘草一錢薄荷六分丹皮錢半桑葉錢半菊花錢半刺蒺藜一錢勾藤勾一錢鮮荷葉半張今日一帖明日一帖初八日前日左關獨浮而弦系少陽頭痛因暑而發用清膽絡法茲關左已平其半但緩甚舌苔白厚而滑胸中痞悶暑中之熱已解而濕尚存也議先宣上焦氣分之熱生苡仁五錢鬱金三錢旋覆花三錢藿梗三錢杏仁泥五錢白蔻仁二錢連殼半夏五錢廣皮三錢茯苓皮三錢滑石六錢通草一錢頭煎二杯今日服二煎一杯明早服初九日諸症俱減舌白未除中濕尚多議進法於前方內加加生蒼朮三錢草果一錢王二十八歲初三日暑傷兩太陰手太陰之證多一以化肺氣為主杏仁泥五錢鮮荷葉一錢銀花三錢蔻仁二錢連皮連翹三錢滑石八錢生苡仁五錢厚朴三錢白通草一錢藿香葉一錢白扁豆花一枝煎二杯分兩次服今晚明早各一帖初四日兩太陰之暑症昨用冷香合辛涼暑中之熱已退其半但里濕與熱未克即除故大便紅水胸中痞悶杏仁泥三錢生苡仁五錢藿梗三錢澤瀉五錢白蔻仁錢半滑石六錢厚朴三錢豬苓五錢鬱金二錢白通草二錢茯苓皮三錢煎三杯今晚明早各一帖初五日舌苔白厚腹甚不和腸鳴泄瀉聚濕尚多急宜分泄生苡仁六錢白蔻仁三錢澤瀉五錢半夏五錢藿梗三錢茯苓皮六錢椒目五錢廣皮三錢滑石六錢蒼朮三錢厚朴三錢水八碗煎取三碗分三次服渣再煮一碗服廣二十四歲七月二十二日六脈洪大之極左手更甚目斜視怒氣可畏兩臂兩手捲曲而瘛瘲舌斜而不語三四日面赤身熱舌苔中黃邊白暑入心包膽絡以清心膽之邪為要先與紫雪丹桑葉三錢羚羊角三錢細生地五錢連翹五錢連心竹茹三錢銀花五錢丹皮三錢嫩荷葉一張天冬三錢麥冬五錢犀角三錢煮四杯分四次服碧雪丹三錢涼開水調服以神清熱退為度不清再服三錢雖三四次均可服二十三日肝熱之極加天冬涼肝於前方加天冬三錢紫雪丹仍照前調服二十四日暑入心膽兩經與清心絡之伏熱已見小效仍用前法而進之犀角五錢連翹四錢細生地五錢羚羊角三錢銀花三錢茶菊花三錢麥冬五錢桑葉三錢丹皮五錢煮四杯分四次服二十五日加鮮白扁豆花一枝鮮荷葉邊一枚黃連錢半黃芩三錢二十六日暑入心膽兩經屢清二經之邪業已見效今日飲水過多水入微嘔蓋暑必夾濕議於前方內去柔藥加淡滲犀角二錢茯苓皮五錢黑山梔三錢茵陳三錢荷葉邊一錢桑葉三錢銀花三錢羚羊角三錢黃連一錢連翹三錢黃柏炭二錢生苡仁五錢二十七日暑熱退後嘔水身微黃熱退濕存茵陳三錢杏仁泥三錢白通草一錢銀花三錢白蔻皮二錢連翹三錢生苡仁五錢黃柏炭二錢茯苓五錢連皮黑山梔三錢服二帖二十九日熱未盡退舌起新白苔胸痞暑兼濕熱不能純治一邊銀花三錢黃連錢半滑石六錢連翹三錢藿梗三錢杏仁泥五錢白通草一錢生苡仁五錢雲苓皮五錢白蔻仁錢半煮三杯分三次服二帖八月初二日暑熱已退七八惟十餘日不大便微有譫語脈沉可與輕通陽明與增液承氣法元參八錢生大黃四錢麥冬六錢連心細生地六錢煮成三杯先服一杯約二時許如不大便再服第二杯明早得大便止後服否則服第三杯初三日溫病下後宜養陰暑溫下後宜兼和胃蓋暑必挾濕而舌苔白滑故也脈緩與外臺茯苓飲意茯苓五錢厚朴二錢半夏三錢白蔻皮錢半麥冬五錢生苡仁五錢藿梗三錢鬱金一錢暑溫熱退濕存故嘔腹不和而舌白苔杏仁泥五錢厚朴二錢白蔻仁錢半益智仁一錢半夏五錢生苡仁五錢黃芩三錢藿梗三錢生薑三片服二帖鞠通自醫丁巳六月十三日時年四十歲先暑後風大汗如雨惡寒不可解先服桂枝湯一帖為君之桂枝用二兩盡劑毫無效驗次日用桂枝八兩服半劑而愈史男七歲癸亥六月十二日右脈洪大無倫暑傷手太陰有逆傳心包之勢喘渴太甚煩躁不寧時有譫語身熱議兩清營衛之法連翹一錢連心生石膏三錢知母一錢銀花二錢真山連一錢生甘草八分竹葉二錢厚朴一錢杏泥二錢藿梗一錢丹皮一錢日二帖十三日諸症俱減熱已退但右脈仍洪舌黃而滑嘔未盡除銀花錢半飛滑石一錢真山連一錢連翹錢半連心生苡仁二錢炒知母八分生甘草八分鮮荷葉邊三錢葦根三錢杏泥錢半二帖俞男三歲七月初二日暑濕傷脾暮夜不安小兒脈當數且少腹以下常腫痛肝腎亦復虛寒況面色青黃舌苔白手心時熱調理乳食要緊防成疳疾議腑以通為補食非溫不化例生苡仁二錢薑夏錢半厚朴錢半炒扁豆一錢杏泥錢半小枳實八分焦曲錢半雞內金一錢廣皮炭八分白蔻仁四分煨薑三片小茴一錢炒黑四帖前證已愈惟脾尚虛弱以疏補中焦為主田十四歲暑溫誤下寒涼太多洞泄之後關閘不藏隨食隨便完穀絲毫不化脈弦與桃花湯改粥法人參赤石脂末禹餘糧細末炙甘草乾薑粳米先以參草薑三味煎去渣湯煮粥成然後和入赤石脂餘糧末愈後補脾陽而大健伏暑周十四歲壬戌八月十六日伏暑內發新涼外加脈右大左弦身熱如烙無汗膠痰舌苔滿黃不宜再見泄瀉不渴腹脹少腹痛是謂陰陽並病兩太陽互爭難治之症擬先清上焦濕熱蓋氣化濕亦化也杏仁泥三錢銀花二錢白通草一錢滑石三錢蘆根二錢淡竹葉一錢生苡仁錢半厚朴二錢大貝母一錢連翹二錢梨皮二錢今晚一帖明早一帖十七日案仍前連翹二錢蘆根二錢杏仁泥錢半銀花二錢薄荷八分厚朴錢半梨皮錢半桑葉一錢苦桔梗錢半知母三錢炒鮮荷葉邊一張
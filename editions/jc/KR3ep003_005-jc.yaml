痛半邊頭臉腫痛目白睛血赤且閉不得開如溫毒狀舌苔紅黃六脈沉數有力議與代賑普濟散急急兩清少陽陽明之熱毒代賑普濟散十包每包五錢用鮮蘆根煎湯水二杯煮成一杯去渣先服半杯其下半杯噙化得稀涎即吐之一時許再煎一包服如上法十六日舌黃更甚脈猶數腫未全消目白睛赤縷自下而上其名曰倒垂簾治在陽明不比自上而下者治在太陽也代賑普濟散每日服五包嚥下大半漱吐小半每包生石膏三錢煎成一小碗服二日外以不去心麥冬一兩分二次煎代茶十八日今日偏頭痛甚且清少陽之絡其消腫之普濟散加石膏午前服一包余時服此方三次三杯羚羊角一錢丹皮一錢銀花一錢犀角八分茶菊一錢刺蒺藜六分凌霄花一錢鉤藤六分苦桔梗八分桑葉一錢連翹一錢生甘草四分兩杯半水煎一杯頓服之日三帖二十日大便結加元參二錢溏則去之二十三日經謂脈有獨大獨小獨浮獨沉斯病之所在也茲左關獨大獨浮膽陽太旺清膽絡之藥已服過數十帖之多而膽脈尚如是之旺絡藥清輕上浮服至何日是了議膽無出路借小腸以為出路小腸火腑非苦不通暫與極苦下奪法然此等藥可暫而不可久恐化燥也洋蘆薈二錢龍膽草三錢胡黃連二錢真雅連二錢麥冬五錢不去心丹皮五錢秋石一錢二十六日前方服二帖左關獨大獨浮之脈已平續服羚羊角散一天代賑普濟散一天目之赤縷大退其耳後之馬刀堅硬未消仍服代賑普濟散日四五次七月初一日脈沉數馬刀之堅結未消少陽陽明經脈受毒之處猶然牽拉板滯議外面改用水仙膏敷患處每日早服羚羊角散一帖已午後服代賑普濟散四包初九日服前藥喉嚨較前清亮舌苔之黃濁去其大半脈漸小仍數里症日輕是大佳處外症以水仙膏拔出黃瘡少許毒氣仍未化透仍須急急再敷務斯拔盡方妙至於見功遲緩乃前此誤用峻補之累速速解此重圍非旦晚可了只好寧耐性情寬限令其自化太緊恐致過剛則折之虞前羚角散每日午前服一帖午後服代賑散四包分四次再以二三包煎湯漱口以護牙齒十七日數日大便不爽左脈關部復浮瘡口痛甚再用極苦以瀉小腸加芳香活絡定痛洋蘆薈二錢乳香三錢生大黃三錢酒炒黑真川連二錢沒藥二錢歸尾三錢龍膽草三錢秋石三錢胡黃連三錢銀花五錢煮三小杯分三次服得快大便一次即止十八日馬刀雖潰少陽陽明之熱毒未除兩手關脈獨浮氣大旺於清少陽陽明絡熱之中兼疏肝鬱軟堅化核苦桔梗三錢桑葉三錢海藻二錢銀花三錢丹皮五錢凌霄花三錢連翹三錢生香附三錢夏枯草三錢茶菊三錢二十五日馬刀以誤補太重而成為日已久一時未能化淨以畏疼停止水仙膏之故舌上舌苔浮面微黃其毒尚重現在胃口稍減木來剋土之故於前方加宣肝鬱苦桔梗二錢桑葉三錢香附二錢銀花三錢丹皮炭三錢連翹三錢鬱金二錢茶菊三錢仍以代賑普濟散漱口勿咽二十八日肝鬱誤補結成馬刀目幾壞現在馬刀已平其半目亦漸愈脈之數者已平惟左關獨浮其性甚急肝鬱總未能降胃不甚開胸中飯後覺痞舌白滑微黃皆木旺剋土之故敗毒清熱之涼劑暫時停止且與兩和肝胃新絳紗三錢姜半夏三錢歸鬚二錢旋覆花三錢包廣皮炭二錢降香末錢半蘇子霜錢半丹皮三錢鬱金二錢八月初九日少陽相火誤補成馬刀原應用涼絡奈連日白苔太重胃不和暫與和胃現在舌苔雖化納食不旺而嘔未可用涼恐傷胃也於前方減其治新絳紗三錢丹皮三錢生薑汁三匙旋覆花三錢包鬱金二錢黃芩炭二錢半夏五錢仍用普濟散漱口初六日於前方內去黃芩加香附三錢廣皮炭二錢初八日膽移熱於腦下為鼻淵則鼻塞不通甚則衄血議清腦戶之熱以開鼻塞兼宣少陽絡氣外有馬刀故也蒼耳子四錢炒連翹二錢桑葉三錢辛夷四錢炒去毛銀花二錢茶菊三錢十二日加旋覆花三錢鬱金二錢疏肝鬱加姜半夏二錢止嘔十六日馬刀已出大膿左脅肝鬱作痛痛則大便日下六七次其色間黃間黑時欲嘔有大瘕泄之象與兩和肝胃旋覆花三錢包姜半夏四錢薑汁三匙絳紗三錢真降香末三錢香附三錢歸鬚二錢黃芩二錢炒鬱金二錢焦白芍三錢廣皮炭三錢十九日外症未除內又受伏暑成痢舌白苔黃滑小便不暢大便五七次有黑有白便又不多非積滯而何不惟此也時而嘔水與痰胃又不和內外夾攻何以克當勉與四苓合芩芍法豬苓三錢廣皮三錢炒木香二錢澤瀉三錢白芍三錢炒降香末二錢雲苓皮五錢黃芩二錢炒紅曲二錢姜半夏五錢真雅連錢半薑汁炒二十四日病由膽而入肝客邪已退所見皆肝膽病外而經絡內而臟腑無所不病初診時即云深痼難拔皆誤用大熱純陽之累所謂雖有善者亦無如之何矣再勉與瀉小腸以瀉膽火法真雅連錢半連翹三錢烏梅三錢去核龍膽草三錢黃芩三錢炒半夏三錢桑葉三錢竹茹三錢茶菊三錢二十六日脈少大而數加苦桔梗三錢雲苓皮三錢銀花三錢二十九日脈仍數肝膽俱病不能純治一邊連翹三錢麥冬五錢連心雅連五錢銀花三錢黃芩六分烏梅三錢桑葉三錢半夏三錢雲苓三錢茶菊三錢九月十二日前方服十一帖胃口大開舌苔化盡肝氣亦漸和惟馬刀核未消盡鼻猶塞唇猶強變衄為鼽脈弦數大便黑又於原方內去護土之剛藥加入腦戶之絡藥蓋由風熱蟠聚於腦戶故鼻塞而衄或鼽誤補而邪不得出也苦桔梗三錢蒼耳子三錢炒烏梅三錢人中黃錢半辛夷三錢茶菊三錢連翹心三錢黃芩二錢麥冬五錢銀花三錢真雅連一錢桑葉三錢龍膽草一錢十九日閱來札前方服七帖肺胃之火太甚議於原方加生石膏一兩杏仁二錢開天氣以通鼻竅清陽明以定牙痛如二三帖不效酌加石膏漸至二兩再敷水仙膏以消核之未盡二十八日右脈洪大而數渴欲飲水牙床腫甚陽明熱也於前方內加石膏一兩共二兩銀花五錢共八錢桑葉二錢共五錢如服三五帖後腫不消加石膏至四兩富氏二十五歲巔頂一點痛畏燈光日光如虎脈弦細微數此厥陰頭痛也與定風珠三劑而愈何氏四十歲陽虛頭痛背惡寒脈弦緊甚與黃耆建中加附子三帖而痛減脈稍和又每日服半帖四日而愈胃痛伊氏三十歲甲子十月二十七日脈弦急脅脹攻心痛痛極欲嘔甫十五日而經水暴至甚多幾不能起不欲食少腹墜脹而痛此怒郁傷肝暴注血海肝厥犯胃也議胞宮陽明同治法蓋金匱謂胞宮累及陽明治在胞宮陽明累及胞宮治在陽明茲因肝病下注胞宮橫穿土位兩傷者兩救之仍以厥陰為主雖變金匱之法而實法金匱之法者也制香附三錢烏藥二錢半夏五錢艾炭三錢鬱金二錢黃芩炭一錢小茴炭二錢血餘炭三錢青皮八分五靈脂錢半五杯水煎兩杯分二次服二帖大效二十九日金匱謂胞宮累及陽明則治在胞宮陽明累及胞宮則治在陽明茲肝厥既克陽明又累胞宮必以厥陰為主而陽明胞宮兩護之制香附三錢淡吳萸二錢半夏五錢萆薢二錢川楝子三錢艾炭錢半小茴香三錢炒黑烏藥二錢黑梔子三錢桂枝三錢杜仲炭二錢水五杯煎取兩杯分二次服伊氏二十一歲十一月二十九日脈雙弦而細肝厥犯胃以開朗心地要緊無使久而成患也半夏六錢青皮錢半生薑三大片廣皮錢半淡吳萸二錢烏藥二錢川椒二錢炒黑鬱金二錢川楝子皮二錢降香末三錢水五杯煮取兩杯二次服三帖王氏二十六歲肝厥犯胃濁陰上攻萬不能出通陽泄濁法外但分輕重耳前三方之所以不大效者病重藥輕故也茲重用之十一月初四日川椒炭五錢良薑五錢小枳實三錢川樸三錢半夏五錢烏藥三錢淡吳萸五錢云連一錢兩頭尖三錢圓者不用降香末三錢甘瀾水八碗煮取三碗分六次二帖初六日重剛劫濁陰業已見效當小其制川椒炭三錢良薑三錢烏藥二錢半夏三錢小枳實三錢青皮二錢廣皮錢半厚朴二錢甘瀾水八碗煮取二碗分二次服二帖車脈沉弦而緊嘔而不渴肢逆且麻濁陰上攻厥陰克陽明所致急宜溫之烏藥三錢半夏五錢淡吳萸五錢川椒炭三錢川樸三錢乾薑三錢蓽茇二錢小枳實三錢青皮二錢頭煎二杯二煎一杯分三次服脾胃許四十七歲癸亥二月二十日脈弦而緊弦則木旺緊則為寒木旺則土衰中寒則陽不運土衰而陽不運故吞酸噯氣不寐不食不飢不便九竅不和皆屬胃病濁陰蟠踞中焦格拒心火不得下達則心熱如火議苦辛通法小枳實三錢淡吳萸三錢半夏一兩真云連二錢炒生苡仁五錢廣皮二錢厚朴三錢生薑六大片甘瀾水八碗煎成三碗分三次服渣再煎一碗服二十四日六脈陽微濁陰蟠踞不食不飢不便用和陽明兼驅濁陰法今腹大痛已歸下焦十餘日不大便肝病不能疏泄用驅濁陰通陰絡法又苦辛通法兼以濁攻濁法淡吳萸三錢小枳實二錢川楝子三錢小茴香三錢雄鼠糞三錢廣皮錢半烏藥一錢良薑二錢炒川樸三錢檳榔二錢以得通大便為度二十七日服以濁攻濁法大便已通但欲便先痛便後痛減責之絡中宿積未能通清臍上且有動氣又非湯藥所能速攻攻急恐有瘕散為蠱之餘議化癥回生丹緩攻為妙某脈沉緊為裡寒木旺土衰濁陰上攻腹拘急時痛脅脹腰痛宜苦辛通法兼醒脾陽白蔻仁一錢官桂一錢川樸二錢半夏三錢生苡仁三錢蓽茇一錢藿梗三錢木香八分生香附三錢廣皮錢半鬱金二錢烏藥二錢某脈弦細而緊濁陰上攻胸痛用辛香流氣法淡吳萸三錢小枳實二錢木香一錢川樸二錢川楝子三錢廣皮二錢檳榔錢半蓽茇二錢烏藥二錢良薑三錢三帖初八日補火生土兼泄濁陰淡乾薑二錢半夏三錢淡吳萸二錢烏藥二錢茯苓塊三錢生苡仁三錢廣皮錢半益智仁錢半煨四帖李十三歲五月十四日六脈俱弦不浮不沉不數舌苔白滑不食不飢不便不寐九竅不和皆屬胃病臥時自覺氣上阻咽致令臥不著席此肝氣之逆也額角上有蟲斑神氣若昏目閉不欲開視不遠醫云有蟲亦復有理與兩和肝胃如再不應再議治蟲半夏一兩旋覆花五錢包秫米一合二十日六腑不通九竅不和醫者不知六腑為陽以通為補每見其二便閉也則以大黃蔞仁寒藥下之以後非下不通屢下屢傷遂致神氣若昏目閉不開脈弦緩而九竅愈不通矣已成壞症勉與通陽廣皮三錢川樸三錢白蔻仁二錢半夏三錢大腹皮三錢雞內金二錢炒雲苓皮三錢益智仁二錢二十三日六腑閉塞不通有若否卦之象按否之得名以坤陰長陽消之候將來必致上下皆坤而後已坤為腹故腹大無外坤為純陰初爻變震為復然則欲復其陽非性烈如震者不可豈大黃等陰寒藥所可用哉天台烏藥散二錢加巴豆霜二分和勻分三分先服一分候五時不便再服第二分得快便即止二十四日服一次於五時得快便宿物下者甚多目閉已開神氣亦清稍食粥飲知頑笑矣二十五日六腑不通溫下後大便雖通而小便仍然未解心下窒塞不肌不食六腑弦遲急急通陽為要與開太陽闔陽明法川椒炭三錢澤瀉三錢公丁香一錢半夏五錢廣皮三錢豬苓三錢雲苓皮五錢良薑二錢安南桂一錢六月初一日大便已能自解胃能進食是陽關已闔惟小便不通是太陽不開與專開太陽桂枝三錢雲苓皮五錢豬苓三錢安邊桂錢半澤瀉三錢滑石三錢蒼朮炭二錢蠶砂三錢煮三杯分三次服以小便通為度若小便已通而尚渾濁者再服一帖以小便清為度初六日服前方二帖小便暫通連日大小便復閉大便閉已七日自覺胃中痞塞臉上蟲斑未退議用前配成之烏藥散再服四分如二便俱通即停藥統俟初八日清晨再商如大便通一次而小便不通或竟不通明日再服三分若大便二三次而小便仍不通者即勿服初八日服烏藥散四分內巴霜四釐已得快便今早且能自行小便六腑俱通矣只與和胃今能進食可以收功蓋十二經皆取決於膽皆秉氣於胃也半夏三錢雲苓塊四錢益智仁一錢煨廣皮炭二錢生苡仁五錢生薑五錢慶寶女十六歲不食十餘日諸醫不效面赤脈洪與五汁飲降胃清陰法兼服牛乳三日而大食矣梨汁藕汁蔗汁蘆根汁荸薺汁邱十八歲溫熱愈後午後微熱不除脈弦數面赤五汁飲三日熱退進食七日全愈

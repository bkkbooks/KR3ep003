body:
  text: 卷五肺癰王氏五十六歲癸亥三月初八日初起喉痹為快利藥所傷致成肺癰胸中痛口中燥喉痹仍未痊不食不寐痰氣腥臭已有成膿之象脈短而數寒熱且移熱於大腸而泄瀉難愈之證勉與急急開提肺氣議千金葦莖湯與甘桔合法桔梗二兩甘草一兩桃仁五錢冬瓜仁五錢苡仁一兩鮮葦根四兩水八碗煮三碗二煎再煎一碗分四次服堂伯兄飲火酒坐熱炕晝夜不寐喜出汗誤服枇杷葉麻黃等利肺藥致傷津液遂成肺癰臭不可當日吐膿二升許用千金葦莖湯合甘桔湯蘆根八兩苡仁二兩桃仁兩半冬瓜仁兩半桔梗三兩生甘草一兩煎成兩大菜碗晝夜服過碗半膿去十之七八盡劑膿去八九又服半劑毫無臭氣調理脾胃收功朱詠齊五十餘歲以己卯年二月初受風與桂枝湯一帖風解膽怯不敢去厚衣因而汗多初四五日又受風溫口渴思涼脈洪數先與辛涼輕劑不解脈又大汗更多口更渴身更熱因與辛寒重劑石膏等一帖身涼渴止脈靜仍膽怯不去厚衣初十日當大差坐夜起五更衣更厚途間不敢去皮衣以致重亡津液而成肺癰與葦莖湯二三兩一帖服至五七日不應膿成臭極加苦藶葶子五錢膿始退未能十分淨盡後十日又發膿又成吐如綠豆汁濃臭每吐一碗余又於前方加葶藶三錢服二帖方平復以補胃逐痰飲收功再其人色白體肥夙有痰飲未病之年前秋冬兩季以在上書房行走早起恐寒誤服俗傳藥酒方本不嗜酒每早強飲數小杯次年患此恙之由也喉痹劉三十二歲脈弦而長木氣太旺與君火結而成喉痹荊芥穗二錢薄荷二錢元參八錢銀花六錢牛蒡子五錢連翹五錢馬勃二錢人中黃二錢共為粗末分八包每一包蘆根湯煎一時一服酒客脈弦數與苦藥清酒中之濕即於前方內加桔梗四錢射干四錢黃芩四錢兒茶三錢煎法如前靈乙丑六月二十六日舌苔邊白中濁喉腫而痛頭暈身熱脈數癘氣所幹切戒穀食急開關竅用時時輕揚法桔梗八錢人中黃三錢薄荷三錢荊芥穗三錢元參一兩牛蒡子八錢黃芩三錢黃連三錢馬勃二錢板藍根三錢殭蠶三錢連翹八錢銀花八錢鮮荷葉半張去蒂共為粗末分八包一時許服一包蘆根湯煎二十七日舌濁甚邪之傳化甚緩於前方內加黃芩二錢成五錢黃連二錢成五錢二十八日濕熱厲氣相搏以成喉痹舌苔重濁色暗必得濕氣宣化而後熱可以解蓋無形之邪熱每借有形之穢濁以為依附故也因前法而小變之桔梗八錢人中黃二錢黃芩五錢黃連五錢馬勃五錢牛蒡子五錢殭蠶三錢連翹八錢銀花八錢通草三錢荊芥二錢杏仁五錢薄荷三錢滑石一兩犀角三錢共為粗末分十包一時許服一包每服鮮荷葉邊二錢蘆根三錢同煎去渣服二十九日喉痛雖止舌濁未除脈仍微數則其中之濕可知按靈樞經五臟溫病以舌苔專屬之肺故藥方一以宣通肺氣為主蓋氣化則濕化而火亦無依矣桔梗三錢人中黃八分連翹二錢銀花二錢黃連錢半黃芩二錢馬勃八分通草一錢杏仁泥一錢滑石三錢蘆根一枝荷葉半張今晚一帖明早一帖王二十歲壬午四月十一日濕毒身熱喉痹滴水不能下咽已二日矣與代賑普濟散二十包先煎一包銜入口內仰面浸漬喉瘡一刻許有稀涎滿口即控出吐之再噙再浸如上法噙至半日喉即開得下咽於是每一包藥煎一碗咽一半浸吐一半三日得快便喉痹全消身熱亦退育陰而愈王氏三十八歲乙酉五月初二日六脈沉弦而細純陰之象喉痛足痹宜溫川椒炭三錢防己三錢桂枝三錢肉桂二錢茯苓皮五錢薑黃二錢萆薢五錢苡仁五錢四帖初八日喉痛止去肉桂痰不活加半夏五錢滿氏三十五歲面色青黃呼吸定息脈再至而弦緊食減經不行腹中有塊二三枚長三四寸肝厥無五日不發喉痛十數年不休向來所服之方非寒涼即婦科地芍藥等以致歷年沉困不休病勢日重十二年不孕矣與苦辛熱法急回真陽或者可救肉桂錢半良薑二錢川椒二錢廣皮二錢吳萸錢半半夏三錢前方服二帖喉痛減其大半厥未發食少進腹痛減與前方加人參錢半茯苓三錢前方服四帖服三至喉痛止食大進腹痛亦減仍服前方去良薑並減剛藥分量前方服七帖六脈將進至四至服通補奇經丸一料半年後受孕瘧吳二十五歲癸亥七月十六日但寒不熱似乎牝瘧然渴甚脈數皮膚捫之亦熱乃伏暑內發新涼外加熱未透出之故仍用苦辛寒法加以升提杏仁泥三錢天花粉二錢蔻仁滑石厚朴二錢青蒿一錢苡仁藿香鬱金二錢黃芩一錢知母三杯分三次服三帖但寒不熱之瘧昨用升提已出陽分渴甚脈洪數甚熱反多昨云熱邪深伏未曾透出不得作真牝瘧者非虛語也用苦辛寒重劑杏仁粉五錢滑石三錢生石膏八錢知母一錢蔻仁三錢藿梗三錢厚朴三錢黃芩二錢鬱金三錢甘草一錢伊氏二十二歲正月初七日妊娠七月每日午後先寒後熱熱至戌時微汗而解已近十日此上年伏暑成瘧由春初升發之氣而發病在少陽與小柴胡法柴胡五錢黃芩三錢炒炙甘草二錢半夏四錢人參二錢生薑三錢大棗二枚一帖寒熱減二帖減大半第三日用前方三分之一全愈朱三十三歲八月二十五日體厚本有小腸寒濕糞後便血舌苔灰白而厚中黑嘔惡不食但寒不熱此脾濕瘧也與劫法生蒼朮五錢生草果三錢檳榔三錢生苡仁五錢杏仁三錢茯苓五錢熟附子一錢黃芩炭二錢二十八日前方服三帖而病勢漸減舌苔化黃減其制又三帖而寒來甚微一以理脾為主於朮三錢炒蔻仁二錢益智仁二錢廣皮三錢半夏三錢黃芩炭二錢苡仁五錢服七帖而胃開佟氏四十歲少陰三瘧二年不愈寒多熱少脈弦細陽微損及八脈通補奇經丸四兩服完全愈蕭三十三歲少陰三瘧久而不愈六脈弦緊形寒嗜臥發時口不知味不渴腎氣上泛面目黧黑與扶陽湯法鹿茸三錢桂枝三錢人參一錢熟附子二錢蜀漆二錢當歸三錢四帖愈後調脾胃鄭五十五歲四月十九日脈雙弦伏暑成瘧間二日一至舌苔白滑熱多寒少十月之久不止邪入已深極難速出且與通宣三焦使邪有出路勿得驟補杏仁泥四錢茯苓皮五錢藿梗三錢蔻仁二錢知母三錢炒半夏三錢苡仁五錢黃芩二錢炒青蒿一錢服四帖二十六日加青蒿一錢服四帖初四日脈緊汗多加桂枝三錢服二帖初六日脈已活動色已畢寒大減熱亦少減共計已減其半汗至足底時已早至八刻議去青蒿加黃芩一錢舌苔雖減而仍白余藥如故再服四帖十四日三瘧與宣三焦右脈稍大熱多汗多舌苔之白滑雖薄而未盡化濕中生熱不能驟補與兩清濕熱杏仁泥三錢知母二錢通草錢半蔻仁二錢黃芩二錢苡仁四錢黃連一錢茯苓皮三錢半夏三錢十九日加廣皮炭三錢藿梗三錢服四帖二十二日病減者減其制每日服前方半帖六日服三帖二十九日病又減去黃連加益智仁三錢以其脈大而尚緊也仍系六日服三帖六月初五日餘邪未盡仍六日服三帖十二日三瘧與宣化三焦十退其九白苔尚未盡退今日診脈弦中兼緩氣來至緩是陽氣未充議於前方退苦寒進辛溫杏仁三錢益智仁三錢桂枝三錢蔻仁三錢黃芩炭三錢半夏五錢茯苓五錢藿梗三錢四帖二十二日左脈弦緊右大而緩舌白未化瘧雖止而余濕未消此方仍服去蔻仁一錢黃芩一錢益智仁一錢服八帖七月初二日四瘧已止胃已開脈已回陽與平補中焦半夏三錢蔻仁錢半炙甘草二錢廣皮炭三錢生苡仁三錢茯苓五錢生薑三片於朮三錢炒大棗二個服七帖後可加人參二錢服至收功丸方瘧後六脈俱弦微數與脾腎雙補法何首烏四兩茯苓六兩枸杞子四兩五味子二兩沙苑子三兩山藥四兩於朮四兩蔻仁五錢蓮實六兩去心人參四錢蜜丸如桐子大每服三二錢開水送下逢節以人參五分煎湯送高十六歲乙酉六月十六日間三瘧脈弦暑邪深入矣杏仁三錢青蒿三錢茯苓皮三錢蔻仁一錢半夏三錢柴胡一錢藿香葉三錢黃芩三錢知母二錢苡仁三錢炙甘草一錢滑石五錢生薑三片大棗二個十八日診脈數熱重加知母二錢二十八日瘧止熱退去知母柴胡青蒿薑棗改藿梗二錢減滑石二錢初五日餘邪已輕再服數帖朱三十八歲但寒不熱舌苔白滑而厚三四日灰黑而滑五六日黑滑可畏脈沉弦而緊太陰濕瘧與牝瘧相參但牝瘧表寒重此則偏於在裡之寒濕重也初起三日用桂枝草果蒼朮黃芩茯苓苡仁廣皮豬苓澤瀉三四日加附子五六日又加草果蒼朮分量再加生薑舌苔始微化黃惡寒漸減服至十二三日舌苔惡寒始退愈後峻補脾腎兩陽然後收功姚二十五歲乙酉七月二十五日久瘧不愈寒多舌苔白滑濕氣重也宜宣通三焦微偏於溫杏仁五錢青蒿二錢廣皮二錢蔻仁三錢半夏五錢苡仁五錢草果錢半黃芩錢半炒茯苓皮五錢生薑二片八月初三日前方服六帖瘧已止照原方去草果青蒿加滑石六錢益智仁三錢錢二十歲乙酉十一月初二日三瘧兼痹舌苔白滑終日一飲熱時不渴胸痞此偏於伏暑中之濕多者也惟日已久又加誤補下行邪已深入為難治勉與宣通經絡三焦導邪外出毋使久羈桂枝三錢防己四錢杏仁五錢青蒿三錢半夏三錢黃芩三錢茯苓五錢蔻仁二錢廣皮三錢煨草果八分片薑黃二錢十五日閱來札知汗多而寒熱減舌白滑苔退食後不飽悶是伏邪已有活動之機但陰瘧發於戌亥時不見日光雖屢用升提使邪外出法毫不見早大可慮也勉與原方內加草果分量去茯苓蔻仁再加急走之蜀漆活血絡之當歸桂枝三錢柴胡三錢半夏三錢青蒿一錢防己三錢杏仁四錢黃芩炭三錢廣皮炭三錢草果二錢薑黃二錢蜀漆三錢當歸三錢生苡仁五錢十二月閱來札知寒熱遞減而未盡除停飲痹痛太甚議減治瘧之品加宣飲與痹之藥然大有病退正衰之慮飲與痹皆喜通不喜守大忌呆補奈何桂枝五錢三四帖後手背痛不減加至八錢或一兩廣皮五錢防己四錢青蒿二錢柴胡三錢寒熱如再減二藥亦須減山甲片一錢炒蜀漆二錢寒熱微則去之生苡仁五錢人參一錢生薑三錢半夏六錢茯苓皮五錢煨草果二錢片薑黃三錢煎四大茶杯分四次服七日必須來信初十日以後忽寒忽熱已非呆於寒熱者可比十五日寒大減十八日寒熱又減二十日申酉時似發非發俱屬佳處但手背之痛左甚於右伏邪甚深腹左之塊即系瘧母一類不過脅腹之別耳合觀寒多熱少當與補陽議於原方內減柴胡青蒿加桂枝其人參似非高麗參可比蓋人生世上不可留後悔也其瘧母每日空心服化癥回生丹一丸開水送下蓋化癥丹中原有鱉甲煎丸在內也即久病在絡亦須用之又天士先生云三時熱病病久不解者每借芳香以為搜逐之用此證猶在畏途不可隨便飲啖也於前方內減青蒿錢半柴胡錢半加桂枝一錢楊二十四歲丙戌二月十一日伏暑自上年八月而來邪已深入三日一作寒多熱少亦宜通宣三焦為要法青蒿三錢蔻仁一錢蜀漆一錢桂枝三錢杏仁二錢黃芩錢半炒苡仁三錢柴胡錢半服一帖而寒退熱反多此陰邪已化熱去柴胡桂枝重用通宣三焦加廣皮半夏以和脾胃傷寒五十八歲癸酉二月初一日太陽中風尚未十分清解兼之濕痹髀痛桂枝四錢厚朴二錢蠶砂三錢杏仁三錢防己三錢茯苓皮五錢薑黃二錢炙甘草錢半廣皮錢半二帖初二日行經絡而和脾胃則風痹自止桂枝八錢白芍四錢炒半夏五錢防己六錢炙甘草三錢生白朮五錢生薑五片大棗二個水八杯煮三杯分三次服頭一次啜稀粥令微汗佳二三次不必食粥初五日左脈沉緊即於前方加熟附子五錢初六日脈洪大而數經絡痛雖解而未盡除痹也小便白而濁濕也桂枝三錢澤瀉三錢黃柏炭一錢通草三錢杏仁五錢滑石五錢苡仁五錢茯苓皮五錢豬苓三錢初九日昨服開肺與大腸痹法濕滯已下小便亦清但大便與瘼中微有血跡證從寒濕化熱而來未便即用柔藥以清血分今日且與宣行腑陽右脈仍見數大可加苦藥如明日血分未清再清血分未遲杏仁泥三錢黃柏炭一錢黃芩炭二錢陳皮錢半苡仁五錢半夏三錢滑石五錢厚朴二錢細蘇梗一錢頭煎兩杯二煎一杯分三次服初八日舌苔仍有新白衣被稍薄則畏寒身熱已退陽虛濕氣未盡無疑桂枝三錢苡仁五錢白芍二錢炒陳皮錢半半夏五錢生茅朮二錢杏仁三錢厚朴二錢全當歸錢半煎服均如前法二帖初十日諸證向安惟營氣與衛不和寐不實寐後自覺身涼以調和營衛為主桂枝三錢苡仁五錢大棗二個白芍三錢陳皮錢半炙甘草二錢半夏六錢生薑三片茯苓三錢六帖十六日營衛已和即於前方內加膠飴三錢白芍二錢成五錢七帖而安唐氏三十八歲太陽中風漏汗桂枝加附子湯主之桂枝六錢熟附子三錢炙甘草三錢焦白芍四錢生薑三片大棗三個煮三杯分三次服十七日中風漏汗兼之腎水上凌心心悸腹痛昨用桂枝加附子湯諸症悉退今左脈沉緩右脈滑表雖清而濁陰未退議苓桂伐腎邪歸茴溫衝脈吳萸半夏生薑兩和肝胃白芍以收陰氣合桂枝而調營衛加黃芩以清風化之熱合諸藥為苦辛通法此外感之餘兼有下焦里證之治法也桂枝四錢全當歸三錢小茴香三錢二味同炒半夏四錢吳萸三錢青皮錢半焦白芍二錢茯苓五錢黃芩炭一錢生薑三片甘瀾水煎成三杯分三次服十九日脈緩濁陰久居兼有滯物續下用藥仍不外苦辛通法稍加推蕩之品因其勢而導之大意通補陽明之陽正所以驅濁陰之陰若其人陽明本旺胃陰自能下降六腑通調濁陰何以能聚再胃旺自能坐鎮中州濁陰何以能越胃而上攻心下反覆推求病情自見淡吳萸三錢小茴香三錢同炒黑桂枝尖四錢厚朴三錢川楝子二錢黃芩炭一錢小枳實錢半烏藥二錢青皮錢半廣木香一錢焦白芍二錢陳皮一錢茯苓三錢二十二日凡痛脹滯下必用苦辛通法兼護陽明固不待言前法業已見效細詢病已十餘年以半產後得之誤用壅補成之按久病在絡再痛脹偏左下至少腹板著其中必有瘀滯非純用湯藥所能成功蓋湯者蕩也條腸胃和通百脈固其所長至於細雕密鏤緩行橫絡是其所短非兼用化症回生丹緩通不可且陽劑過重有症散為蠱之虞不得不思患預防也桂枝尖一錢烏藥錢半厚朴一錢全當歸一錢炒黑半夏五錢地榆炭一錢小茴香二錢炒川楝子二錢黃芩炭一錢白芍二錢炒黃連八分廣皮炭八分兩頭尖二錢廣木香八分桃仁錢半炒紅花七分鬱金一錢降香末二錢甘瀾水煎前後四杯日三夜一分四次服四帖昔李東垣有方用藥至三十餘味者張仲聖鱉甲煎丸亦有三十幾味後人學問不到妄生議論不知治經治以急急則用少而分量多治絡治以緩緩則用多而分量少治新則用急治舊則用緩治急可用獨治舊必用眾獨則無推諉而一力成功眾則分功而互相調劑此又用藥多寡之權沖也兼服化症回生丹一粒二十七日宣絡法兼兩和肝胃全當歸三錢制香附二錢小茴香三錢炒黑半夏三錢川芎五分青皮八分炒丹皮三錢炒沙苑子三錢白芍六錢炒二十八日寐仍不實於前方內加半夏二錢生苡仁六錢服三帖初二日案仍前全歸三錢制香附錢半乾薑炭五分小茴香三錢降香末二錢高良薑二分青皮八分廣皮炭八分烏藥二錢半夏五錢桃仁泥錢半三帖初五日絡瘀多年腹痛脹攻胃食後䐜脹今搜去絡中瘀滯飢甚則如刀刮竹絡氣虛也與通補絡法歸身三錢龍眼肉三錢白芍六錢炒杞子三錢炒丹皮三錢小茴香一錢丹參三錢九帖全愈吳氏二十三歲二月二十一頭項強痛而惡寒脈緩有汗太陽中風主以桂枝湯桂枝三錢白芍二錢炙甘草二錢生薑三錢大棗二個水五杯煮二杯第一杯服後即食稀熱粥令微汗佳有汗二杯不必食粥無汗仍然二十四日不解於前方內加羌活五錢二十五日服前方已脈靜身涼不肯避風因而復中脈緊無汗用麻黃湯法麻黃三錢去節羌活三錢桂枝三錢白芍三錢炙甘草二錢生薑三片大棗二個煮二杯分二次服二十六日服前藥不知身重疼痛其人肥而陽氣本虛平素面色淡黃舌白濕氣又重非加助陽勝濕之品不可於前方內加麻黃五錢成八錢桂枝二錢成五錢炙甘草一錢成三錢杏仁三錢白朮五錢熟附子三錢水五碗先煮麻黃去上沫入諸藥取兩碗分二次服服一碗而汗出愈唐五十九歲三月十六日頭痛惡寒脈緊言蹇肢冷舌色淡太陽中風雖系季春天氣早間陰晦雨氣甚寒以桂枝二麻黃一法麻黃三錢去節桂枝六錢炙甘草三錢杏仁五錢生薑六片大棗二個煮三杯得微汗止後服不汗再服不汗促役其間十八日原方倍麻黃減桂枝加附子三錢二帖十八日原方再服一帖十九日諸證悉減藥當暫停以消息之二十日中風表解後言蹇減食則汗頭行痛舌白滑脈微緊宜桂枝加附子湯除風實表護陽桂枝六錢白芍四錢炒炙甘草二錢附子三錢生薑五片大棗二個水五杯煮二碗分二次服渣再煮一碗服二十一日表解後復中惡寒胸結舌苔厚而白脈遲緊裡急桂枝六錢蒼朮三錢附子四錢乾薑三錢苡仁五錢茯苓五錢厚朴三錢枳實二錢陳皮二錢日二帖二十二日於前方內加炙甘草二錢生薑二兩去茯苓減苡仁日二帖二十三日諸證悉衰當減其制照前日方日一帖二十四日中風表解後餘邪入里舌黃身熱胸痞議瀉心湯瀉其痞乾薑五錢生薑五錢黃芩五錢炒黃連二錢炒半夏六錢頭煎二杯二煎一杯分三次服先寒後熱脅痛腰痛少陽證也議從少陽領邪外出太陽法柴胡六錢黃芩三錢黨參三錢桂枝四錢半夏錢半炙甘草三錢羌活錢半生薑三片寒熱後寒退熱存脅脹半夏五錢炙甘草錢半陳皮炭錢半生薑三錢黃芩四錢香附三錢鬱金二錢大棗二個張二十五日今年風木司天現在寒水客氣故時近初夏猶有太陽中風之症按太陽中風系傷寒門中第一關最忌誤下時人不讀唐晉以上之書故不識症之所由來仲景謂太陽至五六日太陽證不罷者仍從太陽驅出宜桂枝湯現在頭與身仍微痛既身熱而又仍惡風寒的是太陽未罷理宜用桂枝湯但其人素有濕熱不喜甘又有微咳議於桂枝湯內去甘藥加辛燥服如桂枝湯法桂枝六錢陳皮三錢白芍四錢半夏四錢杏仁三錢二十六日太陽中風誤下胸痞四五日太陽症未罷昨用太陽證仍在例之桂枝法今日惡寒已罷頭目已清惟胸痞特甚不渴舌白而壯熱泄瀉稀水頻仍仲景法云病發於陽而誤下成胸痞者瀉心湯主之今用其法再經謂脈不動數者為不傳經也昨日已動數太甚斷無不傳之理可畏在此乾薑五錢茯苓五錢連皮半夏五錢生薑三片黃連三錢二十七日太陽中風誤下前日先與解外昨日太陽證罷即瀉胸痞今日胸痞解惟自利不渴舌灰白脈沉數經謂自利不渴者屬太陰也太陰宜溫但理中之甘草人參恐不合拍議用其法而不用其方乾薑五錢半夏六錢蒼朮炭四錢生薑四錢陳皮炭二錢茯苓一兩連皮二十八日太陽中風先與解外外解已即與瀉誤下之胸痞痞解而現自利不渴之太陰證今日口不渴而利止是由陰出陽也脈亦頓小其半古云脈小則病退但仍沉數身猶熱而氣粗不寐陷下之餘邪不淨仲景傷寒論謂真陰已虛陽邪尚盛之不寐用阿膠雞子黃湯按此湯重用芩連議用甘草瀉心法甘草三錢黃芩四錢半夏五錢黃連三錢生薑三錢大棗二個茯苓三錢二十九日脈沉數陰經熱陽經不熱是陷下之餘邪在裡也氣不伸而噦噦者傷寒門中之大忌也皆誤下之故議少用丁香柿蒂湯法加芩連以徹裡熱疏逆氣公丁香二錢黃芩三錢柿蒂九個黃連一錢陳皮二錢薑汁三匙沖初一日誤下成胸痞自利兩用瀉心胸痞自利俱止但陷下之邪與受傷之胃氣搏而成噦昨用丁香柿蒂湯去人參加芩連方雖易仍不外仲聖苦辛通降之法病者畏而不服今日噦不止而左脈加進勉與仲聖噦門中之橘皮竹茹湯其力量降前方數等矣所以如此用者病多一日則氣虛一日仲聖於小柴胡湯中即用人參況誤下中虛者乎陳皮六錢生薑五錢炙甘草四錢竹茹五錢大棗四枚半夏三錢人參二錢如無以洋參代十七日誤下中虛氣逆成噦昨與金匱橘皮竹茹湯今日噦減過半古謂效不更方仍用前法但微喘而舌苔白仲聖謂喘家加厚朴杏子佳議於前方內加厚朴二錢杏仁三錢柿蒂三錢十九日誤下之陷證噦而喘昨連與橘皮竹茹湯一面補中一面宣邪茲已邪潰諸惡候如失脈亦漸平但其人中氣受傷不淺議與小建中湯加橘皮半夏小小建立中氣調和營衛兼宣胃陽令能進食安眠白芍六錢炒生薑三片半夏四錢桂枝四錢大棗二枚陳皮一錢炙甘草三錢飴糖一兩去渣後化攪勻再上火二三沸煮三杯三次服病解後微有飲咳議與小建中去飴糖加半夏陳皮茯苓苡仁蔻仁杏仁初六日病後兩服建中胃陽已復脾陽不醒何以知之安眠進食是胃陽起舌起白滑苔小便短大便不解脈乍數是脾陽未醒而上蒸於肺也議與宣利三焦法以醒脾陽杏仁五錢半夏五錢茯苓五錢陳皮三錢苡仁五錢枳實三錢通草一錢益智仁一錢初八日大小便已利脈仍洪數舌白滑苔未除仍宜苦辛淡法轉運脾陽宣行濕熱杏仁三錢蒼朮炭三錢蔻仁錢半黃芩炭二錢陳皮錢半黃柏炭三錢茯苓皮五錢半夏五錢苡仁五錢十一日脈仍沉數舌苔反白滑仍宜建中行濕以除伏邪濕最傷氣非濕去氣不得健與急劫濕法蔻仁錢半黃芩炭二錢杏仁三錢陳皮錢半黃柏炭二錢半夏五錢益智仁二錢苡仁五錢煨草果四錢製蒼朮四錢茯苓皮五錢煮三杯周十二時服完吳五十六歲十一月十二日內熱外寒兼發痰飲喉啞咳嗽痰多頭痛惡寒脈浮與麻杏石甘湯麻黃五錢去節半夏一兩生石膏六兩桔梗六錢杏仁八錢陳皮四錢炙甘草四錢煮四杯先服一杯得汗止後服不汗再服汗後勿見風十四日肺脈獨浮去麻黃三錢十七日脈浮喉啞咳嗽痰多麻黃三錢杏仁六錢陳皮三錢生石膏四兩桔梗五錢半夏六錢炙甘草二錢二十三日脈浮喉啞咳嗽痰多內飲招外風為病與大青龍法麻黃五錢杏仁八錢陳皮五錢生石膏四兩炙甘草三錢半夏八錢桔梗五錢生薑三錢大棗二錢頭煎三杯先服一杯得汗止後服不汗再服二十四日病減者減其制減麻黃二錢去陳皮薑棗加木通小便短故也二十七日喉復啞脈洪數小便已長前方去木通加石膏二兩趙十三歲十一月二十九日頭痛脈浮弦不甚緊無汗與杏蘇法杏仁二錢羌活一錢生薑三片蘇葉三錢甘草錢半大棗二枚防風二錢桔梗三錢煮兩杯先服一杯覆被令微汗不可使汗淋漓得汗止後服不汗再服第二杯再不汗再作服以得汗為度汗後避風只可啜稀粥戒一切葷腥中燥吳五十七歲乙酉四月十九日感受燥金之象腹痛泄瀉嘔吐現在泄瀉雖止而嘔不能食腹痛仍然舌苔白滑肉色刮白宜急溫之兼與行太陰之濕川椒炭三錢茯苓五錢陳皮三錢高良薑二錢苡仁五錢公丁香一錢吳萸二錢益智仁二錢半夏五錢二帖二十二日背仍痛原方加高良薑一錢吳萸一錢桂枝五錢再服四帖二十七日已效陰氣未退再服三帖分四日服完五月初三日痛減嘔與泄瀉俱止減川椒萸姜之半再服六帖十三日陰未化陽自不復且心下堅大如盤脈如故前方再服姚四十八歲乙酉四月二十一日燥金感後所傷者陽氣何得以大劑熟地補陰久久補之陽氣困頓無怪乎不能食而嘔矣六脈弦緊豈不知脈雙弦者寒乎川椒炭三錢陳皮三錢半夏五錢乾薑二錢茯苓五錢公丁香八分生薑三錢苡仁五錢初二日加桂枝三錢乾薑一錢減川椒之半十一日嘔痛皆止飲食已加惟肢軟無力陽氣太虛加甘草合前辛藥為辛甘補陽方法二十一日復感燥氣嘔而欲瀉於前方內去甘藥加分量自愈六脈弦細如絲陽微之極川椒炭三錢陳皮三錢吳萸三錢乾薑三錢茯苓五錢半夏五錢桂枝五錢公丁香錢半生薑五錢二十七日諸症皆效脈稍有神於原方內去吳萸丁香之剛燥加苡仁之平淡陽明從中治也李四十六歲乙酉四月十六日胃痛脅痛或嘔酸水多年不愈現在六脈弦緊皆起初感燥金之氣金來剋木木受病未有不剋土者土受病之由來則自金剋木始也此等由外感而延及內傷者自唐以後無聞焉議變胃而受胃變法即用火以剋金也又久病在絡法公丁香一錢茯苓五錢枳實四錢川椒炭三錢苡仁五錢生薑五錢半夏五錢陳皮三錢四帖二十三日復診仍用原方四帖五月初二日現在胃痛脅痛吐酸之證不發其六脈弦緊不變是胸中絕少太和之氣議轉方用溫平剛燥不可以久任也桂枝四錢茯苓五錢生薑三錢陳皮三錢大棗二枚炙甘草二錢半夏五錢乾薑二錢苡仁五錢白芍四錢服之如無弊可多服十一日診脈已回陽去乾薑減桂枝之半二十四日復診脈仍緊原方加益智仁二錢服三帖愈余五十二歲五月初二日胃痛脅痛脈雙弦午後更甚者陽邪自旺於陰分也川椒炭三錢陳皮三錢公丁香錢半降香末三錢香附三錢楂炭二錢吳萸二錢青皮二錢青橘葉三錢半夏五錢苡仁五錢接服霹靂散十七日復診病稍減脈仍緊去楂炭橘葉及川椒炭一錢加枳實三錢二十四日脈之緊者稍和腹痛已止惟頭暈不寐且與和胃令寐再商後法半夏一兩苡仁一兩茯苓五錢枳實三錢煮三杯分三次服以得寐為度如服二帖後仍不寐可加半夏至二兩再服一帖譚四十七歲五月初二日感受金涼胸痹頭痛脈弦細而緊薤白三錢川椒炭三錢厚朴二錢桂枝三錢陳皮三錢高良薑二錢半夏三錢苡仁五錢生薑五片大棗二個二帖十八日燥氣雖化六脈俱弦舌苔白滑用陽明從中治法與苦辛淡法最忌酸甘半夏四錢苡仁五錢香附三錢茯苓四錢乾薑錢半益智仁二錢陳皮三錢蔻仁錢半川椒炭二錢二十一日脈仍弦緊熱藥難退咳嗽減效不更方右脅微痛加香附三錢二十三日右脅微痛脈弦緊如故加蘇子霜三錢降香末三錢旋覆花三錢二十六日脅痛咳嗽皆止痰尚多脈弦未和於前方內去香附蘇子霜降香旋覆花加桂枝四錢乾薑二錢半以充其陽氣行痰飲和絃脈霹靂散方主治中燥吐瀉腹痛甚則四肢厥逆轉筋骽痛肢麻起臥不安煩躁不寧再甚則六脈全無陰毒發斑疝症等症並一切凝寒痼冷積聚寒輕者不可多服寒重者不可少服以愈為度非實在純受燥濕寒三氣陰邪者不可服桂枝六兩公丁香二兩草果二兩川椒炭五兩水菖蒲二兩青木香四兩吳萸四兩防己三兩檳榔二兩降香末五兩附子三兩小茴香四兩薤白四兩苡仁五兩五靈脂二兩高良薑三兩蓽澄茄五兩細辛二兩烏藥三兩乾薑三兩雄黃五錢上藥共為細末開水和服大人每服三錢病重者五錢小兒減半病甚重者連服數次以痛止厥回或瀉止筋不轉為度方論按內經有五疫之稱五行偏勝之極皆可致疫雖癘氣之至多見火證而燥金寒濕之疫亦復時有著風火暑三者為陽邪與穢濁異氣相參則為溫癘濕燥寒三者為陰邪與穢濁異氣相參則為寒癘現在見證多有肢麻轉筋手足厥逆吐瀉腹痛脅肋疼痛甚至反惡熱而大渴思涼者經謂霧傷於上濕傷於下此症乃燥金寒濕之氣直犯筋經由大絡別絡內傷三陰臟真所以轉筋入腹即死也既吐且瀉者陰陽逆亂也諸痛者燥金寒水之氣所搏也其渴思涼飲者少陰篇謂自利而渴者屬少陰虛則飲水求救也其頭面赤者陰邪上逼陽不能降所謂戴陽也其周身惡熱喜涼者陰邪盤踞於內陽氣無附欲散也陰病反見陽證所謂水極似火其受陰邪尤重也諸陽證畢現然必當臍痛甚拒按者方為陽中見純陰乃為真陰之證此處斷不可誤故立方會三陰經剛燥溫熱之品急溫臟真保住陽氣又重用芳香急驅穢濁一面由臟真而別絡大絡外出筋經經絡以達皮毛一面由臟絡腑絡以通六腑外達九竅俾濁穢陰邪一齊立解大抵皆扶陽抑陰所謂麗照當空群陰退避也趙三十八歲七月二十四日感受燥金之氣腹痛甚大嘔不止中有蓄水誤食水果公丁香三錢半夏一兩茯苓皮五錢生薑一兩川椒炭六錢烏梅肉三錢吳萸四錢陳皮五錢高良薑四錢枳實三錢水五碗煎二碗渣再煎一碗另以生薑一兩煎湯一碗候藥稍涼先服薑湯一口接服湯藥一口少停半刻俟不吐再服第二口如上法以嘔止痛定為度二十五日燥氣腹痛雖止當臍仍堅按之微痛舌苔微黃而滑周身筋骨痛脈緩陽明之上中見太陽當與陽明從中治例桂枝六錢川椒炭二錢生薑三錢白芍三錢炒公丁香一錢防己三錢苡仁五錢茯苓六錢半夏五錢煮三杯分三次服服此身痛止二十六日脈小於前身痛已止六脈未和舌黃滑苔半夏五錢生薑三錢蔻仁錢半茯苓五錢陳皮三錢厚朴錢半苡仁五錢大腹皮三錢川椒錢半二十八日腹脹如故不寐加半夏一兩初一日太陽痹桂枝六錢茯苓皮五錢茅朮炭三錢防己四錢通草一錢片薑黃三錢杏仁五錢苡仁五錢滑石六錢蠶砂三錢初六日腹脹停飲前方內去朮之守加苦辛之通又去滑石大腹皮三錢厚朴三錢枳實三錢陳皮三錢初十日六脈俱弦胃口不開腹脹肢倦宜通六腑即勞者溫之之法也桂枝六錢大腹皮三錢川椒炭三錢陳皮五錢益智仁三錢半夏五錢枳實二錢茯苓五錢厚朴二錢服五帖而愈張女十五歲燥金之氣直中入里六脈全無僵臥如死四肢逆冷已過肘膝骽痛轉筋與通脈四逆湯加川椒吳萸丁香一大劑厥回脈出一晝夜次日以食粥太早復中如前脈復厥體又死去矣仍用前方重加溫藥一劑厥回其半又二帖而無活後以補陽收功顧五十歲直中燥氣嘔少瀉多四肢厥逆無脈目開無語睛不轉與通脈四逆湯加人參川椒吳萸丁香一帖而效三帖脈漸復重與補陽而愈楊室女五十歲脅痛心煩懊憹拘急肢冷脈弦細而緊欲坐不得坐欲立不得立欲臥不得臥隨坐即欲立剛立又欲坐坐又不安一刻較一刻脈漸小立刻要脫與霹靂散不住灌之計二時服散約計四兩而稍定後與兩和脾胃而全安鄭二十六歲先是三月初九日得太陽中風與桂枝湯已愈十二日晚已臥下身有微汗因廚房不戒於火只穿小汗褂一件未著襪出外救火火熄復臥覺身微熱惡寒腹中脹痛脈弦數與桂枝柴胡各半湯汗出稍輕究不能解以後外雖化熱面赤汗多如溫病狀以當臍之痛未休舌白不燥斷不敢用辛涼而辛溫之藥或進或退十日不解至二十四日反重用溫熱佐以黃連三錢次日表證里證一齊俱解如失後與調理脾胃兩陽而安多十六歲燥淫表裡俱病面赤身熱舌黃燥渴六脈洪數而緊大便閉小便短通體全似火證只有當臍痛拒按此為陽中之陰乃為真陰與苦熱芳香一劑而熱退減輕分量三帖而病全失矣痙太陽所至溫癸亥二月二十九日六十日之幼孩痙已二十餘日現在脈不數額上涼汗並無外感可知乃雜藥亂投致傷脾胃故乳食有不化之形恐成柔痙俗所謂慢脾風議護中焦乃實土製風法又肝苦急急食甘以緩之義也明天麻三錢乾薑二錢茯苓五錢廣木香五分炙甘草三錢生苡仁五錢焦於朮錢半煨肉果一錢煨姜一片甘瀾水五茶杯煎成兩茶杯小兒服十之一二乳母服十之八九渣再煎一茶杯服如前三月初一日赤子不赤而刮白兼青脈遲涼汗舌苔白滑而厚食物不化洞泄者必中寒按痙必因於濕古所謂柔痙是也議從中治經謂有者求之無者求之此症全無風火之象純然虛寒乳中之濕不化土愈虛則肝中內風愈動若不崇土而惟肝是求恐日見窮蹴矣人參四分廣皮炭三分廣木香五分生於術一錢焦白芍一錢煨肉果五分炙甘草錢明天麻三錢生苡仁一錢初二日風濕相搏有汗為柔痙形若反弓者病在太陽俯視目珠向下者病在陽明以陽明為目下綱也今久病為雜藥困傷脾胃大便泄乳食不化為濕多風少痙時俯時多為病在陽明故此症以脾胃為主議補中益氣法滲濕下行內用風藥領邪外出人參三分桂枝二分茯苓塊三錢白朮一錢葛根二分山藥一錢炙甘草五分生苡仁錢半焦白芍一錢初三日寒濕柔痙昨用升陽益氣法從陽明提出太陽茲精神倍昔顏色生動舌上白濁化淨大便已實甚為可喜但痙家有炙瘡者難治人參三分茯苓塊一錢嫩桂枝三分生於術一錢焦杭白芍一錢葛根二分廣皮炭二分蓮子三粒去心不去皮打碎生苡仁一錢炙甘草五分初四日痙家自汗有炙瘡者難治刻下且住脾胃從脾胃中立以條連四肢是久痙一定之至理若鏤治其痙是速之也人參三分廣皮三分桂枝二分茯苓塊一錢焦於朮八分煨肉果三分生苡仁一錢炙甘草八分訶子肉五分煨茅朮炭六分初五日痙家為苦寒所傷脾陽下陷又有炙瘡其痙萬萬不能即愈議護中陽勿致虛脫為要非深讀錢仲陽陳文仲薛立齋葉天士之書者不知此恙人參四分訶子肉六分煨白芍二錢於朮一錢炒桂枝三分廣木香四分茯苓一錢煨肉果六分廣皮炭三錢炙甘草八分苡仁錢半濃煎初七日脈仍不數大便猶溏但舌苔微黃神氣漸復不似前虛寒太甚之象宜退剛藥少進柔藥醫經謂上守神粗守形兵法謂見可而進知難而退此之謂也人參三分麥冬一錢米炒茯苓一錢整蓮子一錢於朮一錢炒白芍一錢炒炙甘草七分陳皮四分鹽炒黑初九日諸證漸退神氣亦佳但舌上覆起重濁之白苔乳濕之過暫停參藥且用疏補法生苡仁錢半整蓮子一錢麥冬一錢帶心厚朴五分茯苓一錢焦神麯八分木香四分廣皮炭五分張十三歲乙酉六月初三日脈沉細而弱舌苔白滑幼童體厚純然濕邪致痙一年有餘蒼朮炭三錢雲苓皮五錢川椒炭三分白蔻仁一錢生苡仁六錢廣皮三錢桂枝三錢四帖初八日痙症發來漸稀效不更方八帖十六日脈至沉至細至緩舌白滑甚濕氣太重故效而不愈於前方中加劫濕而通補脾陽之草果調和營衛之桂枝白芍甘草五帖二十一日痙症脈沉細舌白滑與濕淡法發來漸稀未得除根於前方內去剛燥加化痰桂枝四錢苡仁五錢半夏六錢白芍三錢炒益智子二錢炙甘草一錢廣皮三錢雲苓五錢薑汁三匙沖二十五日服前方四帖已效舌苔仍然白滑六脈陽微照前方再服四帖二十九日前方已服四帖諸症皆安惟痰尚多再四帖七月初九日前方又服九帖痙症只發一次甚輕已不嘔吐痰尚多脈甚小照前方再服瘛瘲少陽所至陳十五歲乙丑六月二十五日病久陰傷已極骨瘦如柴又加卒然中暑中熱氣舌絳芒刺唇乾液涸無怪乎痙厥神昏十指蠕動危險之至以脈尚浮弦而芤勉與一面大隊填陰兼咸以止厥法先與紫雪丹二錢涼水和服共服六錢白芍五錢細生地三錢犀角五錢羚角三錢麻仁二錢炙甘草二錢阿膠三錢生鱉甲五錢牡蠣五錢濃煎緩緩服二十八日神識未清間有譫語炙甘草六錢麥冬八錢連心真大生地八錢生鱉甲五錢阿膠三錢麻仁三錢犀角五錢生白芍五錢七月初一日邪少虛多用復脈已當但舌上黑苔未化宿糞未見兼加潤法生白芍六錢炙甘草四錢麥冬六錢真大生地八錢阿膠三錢麻仁五錢犀角
body:
  text: 卷三中風陶氏六十八歲左肢拘攣舌厚而蹇不能言上有白苔滴水不能下咽飲水則嗆此中風挾痰之實症前醫誤與補陰故隧道俱塞先與開肺生石膏四兩防己五錢杏仁四錢姜半夏五錢茯苓塊五錢桑枝五錢陳皮三錢白通草錢半服一帖而飲下咽服七帖而舌腫消服二十帖諸病雖漸減而無大效左肢拘攣如故舌雖消腫而語言不清脈兼結余曰此絡中痰堵塞皆誤補致壅之故非針不可於是延郟七兄針之舌上中泉穴一針出紫黑血半茶碗隨後有物如蚯蚓令伊子以手探出即使針孔中拉出膠痰一條如勻粉長七八寸左手支溝穴一針透左關手背三陽之絡用小針十數針以後用藥日日見效前方止減石膏之半服至七十餘帖自行出堂上轎矣哈六十六歲中風濕口歪臂不舉腿腫脈洪數口渴胃不開與辛涼開水道法桂枝三錢防己二錢飛滑石一兩通草二錢半夏五錢桑葉五錢石膏四錢茯苓皮一兩晚蠶砂三錢二帖而效十四帖痊愈後以補脾胃收全功中風神呆不語前能語時自雲頭暈左肢麻口大歪不食六脈弦數此痱中也與柔肝法生白芍三錢麥冬二錢生鱉甲五錢左牡蠣五錢炙甘草三錢生地黃八錢一帖而神有清意人與之言能點頭也又於前方加生阿膠三錢丹皮四錢三帖而半語七帖而愈能食十二三帖而如故李氏七十二歲伏暑挾痰飲肝鬱又加中風頭痛舌厚白苔言蹇畏寒脈洪數而弦先與辛涼清上苦桔梗三錢桑葉三錢連翹三錢蒺藜二錢甘草一錢茶菊花三錢銀花三錢薄荷錢半四帖而頭痛畏寒止舌漸消苔不退茲以通宣三焦兼開肝鬱茯苓五錢連皮杏仁泥五錢半夏四錢白蔻仁二錢飛滑石六錢香附二錢通草一錢廣鬱金二錢薏仁五錢服二十餘帖而大安一切復元少陽瘛瘲某氏己卯七月其人本有肝風頭痛病根少陽鬱勃真水不能上濟可知又現伏暑內發新涼外加金來剋木木愈病矣少陽所至為瘛瘲理固然也勉與清膽絡兼清心包犀角三錢丹皮五錢鮮荷葉一張去蒂羚羊角三錢細生地五錢鉤藤二錢茶菊花三錢桔梗二錢甘草錢半桑葉三錢間服紫雪丹一二錢又此症肝風無疑昨服柔肝清熱之劑而燒退是外邪已解現在六脈弦細手足發涼似有厥意治法熄風之中似宜參入開心胞之絡為是倘一二天不醒便難挽回矣丹皮五錢茶菊花三錢細生地五錢羚羊角三錢嫩桑枝二十寸刺蒺藜二錢石菖蒲一錢生甘草一錢生牡蠣三錢沙參二錢生阿膠二錢生鱉甲二錢間服紫雪丹及牛黃丸又用玉女煎加犀角丹皮又用玉女煎加犀角丹皮連翹銀花重用石膏知母又少陽頭痛甚急外因亦未盡解生石膏一兩生甘草二錢炒知母二錢桑葉三錢丹皮五錢天冬二錢菊花三錢鉤藤二錢銀花三錢羚羊角三錢左牡蠣五錢連翹三錢連心細生地五錢麥冬五錢連心間服紫雪丹三分肝風章氏七十二歲癸丑正月二十八日老年下虛上盛又當厥陰司天之年厥陰主令之候以致少陽風動頭偏右痛目系引急最有壞眼之慮刻下先與清上羚羊角三錢刺蒺藜一錢連翹一錢桑葉二錢茶菊花二錢生甘草八分桔梗錢半蘇薄荷八分日二帖服二日三十日少陽頭痛已止現在胸痞脅脹肝胃不和肢痛腰痛議兩和肝胃之中兼與宣行經絡桂枝尖二錢子青皮一錢製半夏五錢廣鬱金二錢廣皮錢半制香附二錢杏仁泥三錢生薑汁三匙服二帖二月初二日因食冷物晝寐中焦停滯腹不和泄瀉與開太陽闔陽明法桂枝五錢茯苓塊五錢炮姜錢半蒼朮三錢半夏三錢木香錢半豬苓三錢廣陳皮錢半澤瀉三錢藿香梗三錢煨肉果錢半頭煎兩茶杯二煎一茶杯分三次服初四日諸症向安惟余晨泄左手脈緊宜補腎陽煨肉果三錢五味子一錢蓮子五錢連皮去心補骨脂三錢生於術三錢芡實三錢菟絲子二錢茯苓塊五錢水五碗煮成兩碗分二次服渣再煮一碗明早服初七日即於前方內去菟絲子加牡蠣粉三錢初十日太陽微風以桂枝法小和之桂枝二錢廣陳皮二錢白芍二錢炒茯苓塊三錢炙甘草八分半夏三錢生薑二片大棗一枚去核水三杯煮取二杯分二次服十一日右目澀小酉刻後眼前如有黑霧議清肝絡熄肝風益肝陰法桔梗錢半青葙子二錢沙參三錢生甘草八分茶菊花錢半沙蒺藜二錢何首烏三錢三帖後瞭然如故陶氏癸酉二月十五日上脈洪大尺部更甚左脈弦細上盛下虛卒中不能言如中風狀乃肝風內動絡熱竅閉之故證勢甚重羚羊角一錢桔梗一錢麥冬二錢桑葉一錢沙參錢半生鱉甲三錢茶菊花錢半甘草八分刺蒺藜一錢細生地錢半日二帖服三日二十日上盛下虛竅閉不能語用清輕合芳香開上今稍能言但虛煩不眠心悸頭暈仍系厥陰未熄茲用補心肝之體兼實下法白芍六錢炒沙參三錢阿膠二錢蓮子五錢大生地五錢棗仁五錢炒龜板四錢硃砂五錢麥冬五錢連心炙甘草三錢茯苓塊三錢水五碗煮取兩碗分三次服再煮一杯服黃三十歲肝風內動脈弦數乃真水不配相火水不生木故木直強而上行頭暈甚即顛厥也久不治為痱中醫云痰者妄也先與清肅少陽膽絡繼以填補真陰可也羚羊角三錢茶菊花三錢黑芝麻三錢研桑葉三錢生甘草一錢丹皮二錢苦桔梗二錢鉤藤二錢薄荷七分丸方定風珠肝厥高氏四十五歲乙丑十一月十一日肝陽上竄因怒即發十餘年矣經云久病在絡豈經藥可效再肝厥之症亦有寒熱之不同此症脈沉而弦細其為寒也無疑大凡寒厥必死今不死者以其為腑厥而非臟厥也現在脅下有塊有聲經色紫黑擬先用溫通絡脈法新絳紗三錢旋覆花三錢川椒二錢炒黑降香末三錢歸鬚二錢製半夏五錢桂枝尖三錢生香附三錢桃仁炭三錢煮二杯二次服頟三兄夫人二十二歲除夕日亥時先是產後受寒痹痛醫用桂附等極剛熱之品服之大效醫見其效也以為此人非此不可用之一年有餘不知溫燥與溫養不同可以治病不可以養生以致少陽津液被劫無餘厥陰頭痛單巔頂一點痛不可忍畏明至於窗間有豆大微光即大叫必室如黑漆而後少安一日厥去四五次脈弦細數按之無力危急已極勉與定風珠潛陽育陰以熄肝風真大生地八錢麻仁四錢生白芍四錢麥冬四錢帶心海參二條生阿膠四錢生龜板六錢炙甘草五錢生牡蠣六錢生鱉甲六錢雞子黃二枚去渣後化入攪勻煮成八杯去渣上火煎成四杯不時頻服正月初一日微見小效加鮑魚片一兩煮成十杯去渣煎至五杯頻服初四日腰以上發熱腰以下冰涼上下渾如兩截身左半有汗身右半無汗左右渾如兩畔自古方書未見是症竊思古人云琴瑟不調必改弦而更張之此症當令其復厥厥後再安則愈照前方定風珠減半加青蒿八分當夜即厥二三次初五日照前方定風珠原分量一帖服後厥止神安初七日仍照前方初八日方皆如前漸不畏明至正月二十日外徹去幃帳湯藥服至二月春分後與專翕大生膏一料痊愈楊室女四十九歲甲申十二月初二日初因肝鬱脅痛繼而肝厥犯胃醫者不識病名肝著與絡痛治法無非滋陰補虛或用涼藥以致十年之久不能吃飯飲粥湯止一二口食炒米粉止一酒杯稍聞聲響即痙厥終夜抽搐二三日方漸平六脈弦緊而長經閉二年周身疼痛痰飲咳嗽終年無已骨瘦如柴奄奄一息此症內犯陽明故不食木克脾土故飲聚陽明空虛故無主聞聲而驚外犯太陽故身痛而痙本臟致病故厥經謂治病必求其本仍從肝絡論治新絳紗歸鬚川椒炭桂枝鬱金旋覆花青皮蘇子霜半夏降香末十四日服前方七帖脅痛雖輕痰飲特甚喘咳頻仍夜臥不安暫停絡藥專與和胃蠲飲半夏八錢廣陳皮四錢生苡仁五錢茯苓六錢枳實三錢淡乾薑三錢桂枝三錢十七日胃稍開能食稀粥半碗脅仍痛仍服前活絡方去川椒加廣陳皮十二月初四日十一日脅痛平咳嗽未除又服前蠲飲方十一日因余有由紹興之行令其常服和胃方脅痛發時暫服新絳旋覆花湯此時已能食爛飯半碗矣乙酉二月二十八日脈稍和平雖弦而有胃氣乾飯能吃一碗有半經亦復通仍間服前二方夜間偶感燥症欲起不得起欲坐不得坐欲臥不得臥煩躁無奈不可當約二時服霹靂散三兩許始安次日仍與和胃十八日能食乾飯兩小碗矣六脈又和一等仍間服前二方四月初三日余復由淮至紹初八日至蘇州不放心此病作書一封令其調適性情五月間又作書一封痛以大道理開導之十月間始得回書據云竟以余書作座右銘每日諷誦一過飲食又進精神大長闔家歡樂脅痛伊氏二十歲肝鬱脅痛病名肝著亦婦科之常證無足怪者奈醫者不識見其有寒熱也誤以為風寒而用風藥夫肝主風同氣相求以風從風致令肝風鴟張肝主筋致令一身筋脹肝開竅於目致令晝夜目不合不得臥者七八日肝主疏泄肝病則有升無降失其疏泄之職故不大便小溲僅通而短赤特甚醫者又不識誤以為腸胃之病而以大黃通之麻仁潤之致令不食不飢不便不寐六脈洪大無倫身熱且坐不得臥時時欲嘔煩躁欲怒是兩犯逆也金匱論一逆尚引日再逆促命期不待智者而知其難愈也議宣通絡脈法肝藏血絡主血故也必加苦寒泄熱脈沉洪有力且膽居肝內肝病膽即相隨故也旋覆花五錢炒黃連二錢桃仁四錢歸鬚四錢鬱金三錢川楝皮五錢新絳四錢絳香末四錢蘇子四錢急流水八碗又服前方見小效即於前方內加丹皮三錢炒黑生香附二錢減川楝皮二錢又脅痛減其大半但不得寐時時欲嘔擬兩和陽明厥陰仍兼宣絡半夏五錢醋炒青皮錢半降香末三錢新絳三錢歸鬚三錢蘇子霜三錢秫米一撮桃仁三錢川楝皮二錢廣鬱金二錢黃芩二錢煮三碗日二夜一又昨方業已效今日復苦藥即苦與辛合能降能通之意即於前方內加薑汁炒古勇黃連二錢又昨用苦辛法脈減便通今日腹中覺痛將近經期一以宣絡為主新絳紗五錢蘇子霜二錢丹皮二錢炒制香附二錢兩頭尖二兩旋覆花五錢元胡索二錢條芩錢半酒炒桃仁泥四錢降香末三錢歸鬚三錢鬱金三錢水八碗煮取三杯日二夜一又昨日一味通絡已得大便通利腹中痛止但不成寐今日用胃不和則臥不安飲以半夏湯覆杯則寐法仍兼宣絡此仲景先師所謂衝脈累及陽明先治衝脈後治陽明也半夏一兩旋覆花五錢降香末二錢秫米二兩新絳四錢水十杯煮成四杯日三夜一又昨與半夏湯和胃業已得寐但脈沉數溲赤短議加苦藥泄肝熱而通小腸火府半夏六錢降香末三錢黃柏二錢鹽水炒秫米一兩新絳四錢旋覆花五錢生香附三錢黃連二錢炒煎法如前又昨日和胃宣絡兼用苦通火府今日得寐溲色稍淡口亦知味是陽明有漸和之機矣惟胸中微痛背亦掣痛按肝脈絡胸背則太陽經也是由厥陰而累及少陽肝膽為夫妻也由少陽而累及太陽少太為兄弟也今日仍用前法加通太陽絡法半夏五錢降香末三錢黃柏錢半鹽水炒旋覆花三錢古勇黃連一錢桂枝尖三錢新絳三錢秫米六錢生香附三錢煎法如前又繞臍痛者瘕也亦衝脈肝經之病桂枝尖三錢新絳三錢半夏五錢炒云連一錢當歸三錢炒黑生香附三錢淡吳萸三錢炒小茴香三錢炒黑秫米八錢川楝子三錢又兩和肝胃兼治瘕痛半夏八錢青皮二錢吳萸三錢炒黑新絳紗三錢小茴香三錢炒黑生香附三錢旋覆花三錢桂枝尖三錢云連錢半炒黑淡乾薑二錢烏藥三錢秫米一兩降香末三錢全當歸三錢炒黑煮成四碗日三夜一又腹中拘急而痛小便短赤皆陰絡阻塞濁陰凝聚之象與宣通陰絡降濁法桂枝尖三錢降香末三錢琥珀三分研細末小茴香三錢炒川楝皮三錢原麝
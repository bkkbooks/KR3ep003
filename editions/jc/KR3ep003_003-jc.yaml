昨日稍加逐痰痰出如許大勢安靜但多怒耳右脈仍滑痰未淨也半夏六錢秋小麥八錢白附子二錢石菖蒲一錢旋覆花三錢茯神塊三錢代赭石五錢煅飛炙甘草一錢其後痰去以大補心脾而安鮑三十二歲十月初二日大狂七年先因功名不遂而病本京先醫市醫儒醫已歷不少既徽州醫杭州醫蘇州醫湖北醫所閱之醫不下數百矣大概補虛者多攻實者少間有已時不旋踵而發余初診時見其蓬首垢面下體俱赤衣不遮身隨作隨毀門窗分碎隨釘隨拆鐐銬手足外有鐵索數根錮鎖於大石盤上言語之亂形體之羸更不待言細詢其情每日非見婦人不可婦人不願見彼盡鬧不可叫號聲嘶衰鳴令人不可聞只得令伊姬妾強侍之然後少安次日仍然無一日之空診其脈六脈弦長而勁余曰此實症非虛症也於是用極苦以瀉心膽二經之火瀉心者必瀉小腸病在臟治其腑也但無出路亦必瀉小腸也龍膽草三錢胡黃連三錢天門冬三錢細生地三錢丹皮三錢大麥冬三錢連心服二帖而大效妄語少而舉動安靜初三日見其效也以為久病體虛恐過剛則折用病減者減其制例於原方減苦藥加補陰之甘潤初五日病家來告云昨服政方二帖病勢大重較前之叫哮妄語加數倍之多無一刻靜此症想不能治諒其必死先生可不診矣余曰不然初用重劑而大效繼用輕劑加補陰而大重吾知進退矣復診其脈弦長而數於是重用苦藥龍膽草六錢洋蘆薈六錢天冬五錢麥冬五錢連心胡黃連五錢秋石二錢烏梅肉五錢一氣六帖一日較一日大效至十一日大為明白於是將其得病之由因伊念頭之差其念頭之差因未識文章至高之境即欲至高尚有命在非人力所能為何怒之有人生以體親心為孝痛乎責之俯首無辭以後漸去苦藥加補陰半月而後去刑具著衣冠同跪拜神識與好人無異服專翕大生膏一料而大壯下科竟中矣章氏四十二歲先是二月間病神識恍惚誤服肉桂熟地等補藥因而大狂余於三月間用極苦以折其上盛之威間服芳香開心包治三十日而愈但脈仍洪數余囑其戒酒肉服專翕大生膏補陰配陽彼不惟不服丸藥至午節大開酒肉於是狂不可當足臭至鄰不時脫淨衣褲上大街一二男子不能搏之使回五月十四日又延余視余再用前法隨效二三日仍然如故蓋少陽相火極挾制君主行令藥隨暫開其閉暫折其威相火一動而仍然如故延至六月十六日午刻復自撕其褲人不防而出大門矣余坐視不忍復自漸無術以已其病因謂其胞弟曰此症非打之極痛令其自著衣褲也不可蓋羞惡之心亦統於仁能仁則不忍忍則不仁不仁之至羞惡全喪打之極痛則不能忍不忍而仁心復仁心復而羞惡之心亦復矣此古聖王撲作教刑之義也伊弟見其乃姊如是景況羞而成怒以保父母體面為義於是以小竹板責其腿令著褲彼知痛而後自作衣著衣稍明次月十七日立秋余以大劑苦藥一帖而全愈蓋打之功與天時秋金之氣藥之力相須而成功也後以專翕生生膏而收全功虛勞伊勞傷急怒吐血二者皆治在肝絡醫者不識見血投涼以致胃口為苦寒二十歲所傷殘脾陽腎陽亦為苦寒滑潤伐其生髮健運之常此腹痛晨泄不食脈沉弦細之所由來也按三焦俱損先建中焦補土可以生金腎關之虛亦可仰賴於胃關矣蓮子五錢去心芡實三錢白扁豆錢半冰糖三錢茯苓塊三錢廣皮炭一錢人參一錢緩緩多服為宜陳二十三歲左脈搏大下焦肝腎吐血上焦咳嗽中焦不食謂之三焦俱損例在不治勉擬三焦俱損先建中焦法桑葉二錢白扁豆三錢茯苓塊一錢蓮子三錢芡實三錢冰糖三錢桂枝二錢焦白芍錢半沙參三錢胡肉桃三錢服四帖後能食陳氏三十二歲甲子四月初五日脈弦細失音謂之金碎不鳴暮熱不食食則嘔亦系俱損為難治胡桃肉三錢甜杏仁三錢冰糖三錢白扁豆五錢茯苓塊二錢桑葉二錢洋參二錢沙參三錢柏子霜三錢另含鮑魚片洋參片施二十歲形寒而六脈弦細時而身熱先天不足與諸虛不足之小建中法芍藥六錢生薑四錢大棗四枚去核桂枝四錢炙甘草三錢膠糖一兩去渣化入前方服過六十劑諸皆見效陽雖轉而虛未復於前方內減薑桂之半加柔兼藥與護陰法大生地五錢五味子二錢麥冬四錢連心姚三十歲乙酉五月初五日六脈弦細而緊勞傷吐血諸虛不足小建中湯主之小建中湯加茯神四錢共服二十一帖全愈李二十四歲乙酉五月初三日每日五更胃痛欲飲得食少安胃痛則背冷如冰六脈弦細陽微是太陽之陽虛累及陽明之陽虛陽明之陽虛現症則太陽之陽更覺其虛此等陽虛只宜通補不宜守補半夏六錢廣皮四錢川椒炭五錢乾薑四錢桂枝八錢十四日背寒減腹痛下移減桂枝加萸良薑傅十八歲乙酉五月十三日六脈弦細而緊吐血遺精陽氣不攝胃口不開法當與建中復其陽奈系酒客中焦濕熱壅聚不可與甘改用辛淡微甘以和胃胃旺得食而後諸症可復也半夏五錢白芍五錢薑汁每杯點三小茶匙廣皮炭三錢桂枝木三錢生苡仁五錢雲苓塊五錢麥冬三錢連心炒神麯五錢七帖二十二日業已見效胃開得食脈尚弦緊多服為宜沈十五歲乙酉年五月十五日幼孩脈雙弦而細緊瘰癧結核胃陽不開色白食少且嘔形體羸瘦與通補胃陽半夏四錢云芩塊四錢炒廣皮二錢白扁豆四錢生薑三錢六月十二日前藥已服十二帖嘔止胃開腹微脹脈有回陽之氣於前方加厚朴杉皮消脹脹消後按服前方化核於前方內去生薑廣皮加香附土貝母忍冬藤青橘葉海藻以化瘰癧痰核錢二十七歲乙酉五月二十八日六脈弦緊胃痛久痛在絡當與和絡公丁香八分小茴香炭二錢生薑二錢歸鬚二錢桂枝尖三錢降香末三錢烏藥二錢良薑一錢半夏三錢此方服七帖後痛止以二十帖神麯
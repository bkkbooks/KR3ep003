次汗出三寸許二帖俱服完鯉魚湯一鍋喝一晝夜亦服盡汗至伏兔而已未過膝也臍以上腫俱消腹仍大初七日經謂汗出不止足者死此症尚未全活雖腰以上腫消而腹仍大腰以下其腫如故因用腰以下腫當利小便例與五苓散服至二十一日共十五天不效病亦不增不減陳蔭山先生云前用麻黃其效如神茲小便滴不下奈何祈轉方予曰病之所以不效者藥不精良耳今日先生去求好肉桂若仍系前所用之桂明日予不能立方固無可轉也二十二日陳蔭山購得新鮮紫油邊青花桂一枝重八錢乞予視之予曰得此桂必有小便但恐脫耳膀胱為州都之官氣化則能出焉氣虛亦不能化於是用五苓二兩加桂四錢頂高遼參三錢服之盡劑病者所睡系棕床予囑備大盆二三枚置之床下溺完被濕不可動俟明日予親視挪床其溺自子正始通至卯正方完共得溺大盆有半予辰正至其家視其周身如空布袋又如腐皮於是用調理脾胃痊愈洪氏六十八歲孀居三十餘年體厚憂鬱太多肝經鬱勃久矣又因暴怒重憂致成厥陰太陰兩經䐜脹併發水不得行腫從跗起先與腰以下腫當利小便例之五苓散法但陰氣太重六脈沉細如絲斷非輕劑所能了桂枝五錢生蒼朮五錢豬苓五錢澤瀉五錢茯苓皮六錢肉桂四錢廣皮五錢厚朴四錢前方服三五帖不效亦無壞處小便總不見長肉桂加至二三兩桂枝加至四五兩他藥稱是每劑近一斤之多作五六碗服五七帖後六脈絲毫不起腫不消便亦不長所以然之故肉桂不佳陰氣太重憂鬱多年暴怒傷肝必有陳菀仍用原方加雞矢醴熬淨煙六錢又加附子八錢服之小便稍通一連七帖腫漸消飲食漸進形色漸喜於是漸減前方分量服至十四帖腫脹全消後以補脾陽疏肝鬱收功郭氏六十二歲先是郭氏喪夫於二百里外其祖墓之側郭攜子奔喪飢不欲食寒不欲衣悲痛太過葬後廬墓百日席地而臥哭泣不休食少衣薄回家後致成單腹脹六脈弦無胃氣氣喘不能食唇舌刮白面色淡黃身體羸瘦余思無情之草木不能治有情之病必得開其愚蒙使情志暢遂方可冀見效於萬一因問曰汝之痛心疾首十倍於常人者何故伊答曰夫死不可復生所遺二子恐難立耳余曰汝何不明之甚也大凡婦人夫死曰未亡人言將待死也汝如思夫愈切即死墓側得遂同穴之情則亦已矣雖有病何必醫醫者求其更蘇也其所以不死者仍系相夫之事業也汝子之父已死汝子已失其蔭汝再死汝子豈不更無所賴乎汝之死汝之病不惟無益於夫而反重害其子害其子不惟無益於子而且大失夫心汝此刻欲盡婦人之道必體亡夫之心儘教子之職汝必不可死也不可死且不可病不可病必得開懷暢遂而後可愈單腹脹死症也脈無胃氣死脈也以死症而見死脈必得心火旺折泄肝鬱之陰氣而後血脈通血脈通臟氣遂死證亦有可生之道詩云見晛曰消者是也伊聞余言大笑余曰笑則生矣伊云自此以後吾不惟不哭並不敢憂思一味以喜樂從事但求其得生以育吾兒而已余曰汝自欲生則生矣於是為之立開鬱方十數劑而收全功旋覆花三錢新絳紗包降香末三錢歸鬚二錢蘇子霜三錢鬱金三錢香附三錢川厚朴三錢姜半夏四錢廣皮三錢青橘皮二錢吳氏二十八歲春夏間乘舟由南而北途間溫毒愈後感受風濕內脹外腫又有肝鬱之過時當季夏左手勞宮穴忽起勞宮毒如桃大此症治熱礙濕治濕礙熱之弊選用幼科痘後餘毒歸肺喘促咳逆之實脾利水法加極苦合為苦淡法俾熱毒由小腸下入膀胱隨濕熱一齊泄出也蓋勞宮毒屬心火瀉心者必泄小腸小腸火腑非苦不通腰以下腫當利小便利小便者亦用苦淡也豬苓一兩茯苓皮一兩白通草三錢澤瀉一兩晚蠶砂二兩雅連四錢黃柏四錢飛滑石四錢黃芩四錢煮成五碗分五次服以小便長者為度此方服七帖分量不增減腫脹與勞宮毒俱消以後補脾收功陳二十六歲乙酉年五月十五日脈弦細而緊不知飢內脹外腫小便不利與腰以下腫當利小便法陽欲滅絕重加熱以通陽況今年燥金太乙天符經謂必先歲氣毋伐天和桂枝六錢豬苓五錢生茅朮三錢澤瀉五錢廣橘皮三錢川椒炭五錢厚朴四錢茯苓皮六錢公丁香二錢杉木皮一兩煮四杯分四次服二十五日諸症皆效知飢腫脹消其大半惟少腹有疝竟如有一根筋吊痛於原方內減丁香一錢加小茴香三錢單氏四十二歲腫脹六年之久時發時止由於肝鬱應照厥陰䐜脹例治降香末三錢木通二錢香附三錢旋覆花三錢歸鬚三錢鬱金二錢青皮二錢厚朴三錢大腹皮三錢雲苓六錢半夏四錢煮成三杯分三次服不能寬懷消怒不必服藥二十六日服前方八帖腫脹稍退惟陽脈微弱加以椒炭三錢大便不通加兩頭尖三錢去陳菀單腹脹毛四十四歲病起肝鬱木鬱則剋土克陽土則不寐克陰土則䐜脹自鬱則脅痛肝主疏泄肝病則不能疏泄故二便亦不宣通肝主血絡亦主血故治肝者必治絡新絳紗三錢半夏八錢香附三錢旋覆花三錢青皮三錢小茴香三錢歸鬚三錢降香末三錢廣鬱金三錢蘇子霜三錢頭煎兩杯二煎一杯分三次服三帖初七日服肝絡藥脹滿脅痛不寐少減惟覺胸痛按肝脈絡胸亦是肝鬱之故再小便赤濁氣濕也桂枝嫩尖三錢晚蠶砂三錢歸鬚二錢川楝子三錢半夏六錢降香末三錢白通草三錢青橘皮三錢茯苓皮三錢旋覆花三錢新絳紗包小茴香三錢炒黑兩頭尖三錢服二帖初十日驅濁陰而和陽明現在得寐小便少清但肝鬱必剋土陰土鬱則脹陽土鬱則食少而無以生陽故清陽虛而成胸痹暫與開痹薤白頭三錢半夏一兩廣鬱金三錢栝蔞實三錢連皮仁研生苡仁五錢桂枝尖五錢茯苓皮五錢厚朴三錢小枳實二錢服三帖十四日脈緩太陽已開而小便清通陽明已闔而得寐能
熱痛起蓓蕾下濁氣亦如前但少輕耳自巳初服藥起至亥正共服五次每次輕一等次一日腹微痛再服烏藥散則腹中不知熱矣以後每日服二三次七日後腫痛全消後以習射助陽而體壯葉四十五歲乙酉四月二十八月無論癥瘕雖有氣血之分然皆系陰病結於陰部豈有用陰藥之理維日已久沉寒痼冷疾非巴豆不能除根用天台烏藥散六月初九日業已見效未能除根照常服前藥早晚各五分癥瘕痛發時服二錢舌苔厚白面色淡黃而暗左脈沉細陽微再與湯藥行濕通陽雲茯苓塊五錢益智仁錢半萆薢四錢白蔻仁一錢連皮生苡仁五錢半夏五錢廣陳皮二錢桂枝二錢白通草一錢服至舌苔退為度甘二十九歲乙酉年五月初一日十年瘕氣六脈弦細而緊淡吳萸三錢烏藥三錢川椒炭五錢歸鬚二錢良薑二錢小茴香五錢炒黑煮三杯分三次服已服五帖初九日病減者減其制每日服半帖王氏四十歲乙酉五月二十一日六脈弦緊心下伏梁非易化之症一生憂泣肝之郁也又當燥金太乙天符之年金來剋木痛愈甚矣與溫絡法其吐血亦絡中寒也降香末三錢川椒炭二錢香附三錢半夏三錢枳實三錢歸鬚三錢公丁香八分廣皮服四帖二十五日諸症皆效自覺氣上阻咽加旋覆花五錢二十九日效不更方再服六月初二日加吳萸三錢余氏三十歲乙酉五月二十四日瘕結臍左經來必痛六脈沉細陽微吳茱萸三錢川楝子三錢公丁香一錢良薑二錢全當歸三錢降香末三錢小茴香三錢艾炭三錢煮三杯分三次服服七帖後接服丸藥六月初二日業已見效每日服半帖再服十天二十日每行經前三日腹微痛時空心服化癥回生丹一丸服至經盡後腹中絲毫不痛為止下月經行腹痛發時再如此服法癥瘕痛亦服回生空心服一丸化淨為度車五十五歲鬚髮已白大半臍左堅大如盤隱隱微痛不大便十數日先延外科治之外科謂腸癰以大承氣下之三四次終不通延余診視按之堅冷如石面色青黃脈短澀而遲先尚能食屢下之後糜粥不進不大便已四十九日余曰此癥也金氣之所結也以肝木抑鬱又感秋金燥氣邪中入里久而結成愈久愈堅非下不可然寒下非其治也以天台烏藥散二錢加巴豆一分薑湯和服設三服以待之如不通第二次加巴豆霜分半再不通第三次加巴豆霜二分服至三次後始下黑亮球四十九枚堅莫能破繼以苦溫甘辛之法調理漸次能食又十五日不大便余如前法下至第二次而通下黑亮球十五枚雖亦堅結然破之能碎但燥極耳外以香油熬川椒熨其堅處內服芳香透絡月餘化淨於此證方知燥金之氣傷人如此而溫下之法斷不容紊也乙酉年治通廷尉久疝不愈時六十八歲先是通廷外任時每發疝醫者必用人參故留邪在久不得愈至乙丑季夏受涼復發堅結肛門坐臥不得脹痛不可忍汗如雨下七日不大便余曰疝本寒邪凡堅結牢固皆屬金象況現在勢甚危急非溫下不可亦用天台烏藥散一錢巴豆霜分許下至三次始通通後痛漸定調以倭硫黃丸兼用金匱蜘蛛散漸次化淨淋濁郎五十六歲便泄帶血既有膀胱之濕又有小腸之熱用導赤合四苓湯法豬苓三錢茯苓皮五錢萆薢五錢澤瀉三錢次生地五錢甘草梢一錢淡竹葉二錢木通三錢飛滑石五錢十二月初一日少腹痛於前方內加川楝子三錢小茴香炭三錢王十七歲濕土司天濕熱下注致成淋症莖腫萆薢三錢白通草一錢甘草梢三錢茯苓皮五錢滑石二錢生苡仁五錢車前子二錢澤瀉三錢蘆根三錢十五日於前方內加黃柏炭三錢龔五十八歲先是大小便俱閉自用大黃八錢大便雖通而小便點滴全無續用五苓仍不通診其六脈弦緊病因肝鬱而成開陰絡法降香末三錢歸鬚三錢兩頭尖三錢琥珀三分丹皮三錢韭白汁三匙沖麝香五釐同研沖一帖而通二帖而暢普三十八歲小便淋濁莖管痛不可忍自用五苓八正萆薢分清飲等滲濕愈利愈痛細詢病情由房事不遂而成余曰溺管與精管異途此症當治精管為是用虎杖散法現無虎杖草以杜牛膝代之杜牛膝五錢當歸三錢降香末三錢麝香五釐桃仁泥三錢兩頭尖三錢琥珀六分丹皮三錢一帖而痛減五帖而痛止七帖而濁淨後以補奇經而愈珍四十五歲血淋太多先與導赤不應繼以脈弦細詢由怒鬱而起轉方與活肝絡新絳紗三錢蘇子霜一錢丹皮炭五錢旋覆花三錢桃仁三錢紅花二錢片薑黃三錢香附三錢歸鬚三錢鬱金二錢降香末三錢四帖而安王四十五歲小便狂血脈弦數病因肝鬱新絳紗三錢細生地五錢青皮二錢旋覆花三錢丹皮炭五錢桃仁三錢降香末三錢香附三錢歸鬚三錢服四帖而血止止後兩月又因動氣而發仍與前方七帖而愈範二十八歲因怒鬱而大小便閉與極苦而通小腸借火腑通膽腑法黃芩三錢歸鬚三錢桃仁泥三錢胡黃連三錢龍膽草三錢廣鬱金二錢二帖而大小皆通保女十八歲怒郁少腹脹大如斗小便點滴全無已三日矣急不可耐仰臥不能轉側起立與開經絡降香末三錢香附米三錢廣鬱金二錢龍膽草三錢青皮二錢韭白汁三匙沖歸鬚三錢琥珀五分兩頭尖三錢麝香五釐一帖而通二帖而暢保五歲夏日痘後受暑小便不通脈洪數玉莖腫亮蜷曲如勾與涼利膀胱白通草錢半蠶砂三錢滑石六錢雲苓皮五錢苡仁五錢杏仁三錢一帖而通三帖而玉莖復元葉四十五歲乙酉年七月初一日金實無聲六脈俱弦痰飲兼之濕痹小便白濁先與行濕茯苓皮五錢川萆薢五錢通草一錢桂枝五錢防己三錢蠶砂五錢半夏五錢杏仁泥四錢生苡仁五錢甘草一錢滑石六錢服七帖十四日復診加九月初三日豬苓三錢澤瀉三錢伏飲濕痹便濁前與淡滲通陽已服三十帖因停藥二十餘日現在飲又上泛胸滿短氣腰痠淋濁未除且與行心下之飲脈弦細陽不復姜半夏五錢杏仁四錢雲苓皮五錢廣陳皮三錢防己四錢桂枝三錢枳實四錢萆薢五錢通草錢半晚蠶砂三錢十二日服九帖去杏仁防己加薏苡五錢又服三十餘帖十月初五日痰飲痹症淋濁皆寒濕為病誤與補陰以致濕邪膠痼沉著急難清楚前與開痹和胃現今雖見效不少究竟濕邪為患陰柔之邪久為呆補所困難以旦夕奏功也桂枝四錢川萆解五錢澤瀉三錢姜半夏六錢滑石六錢雲苓皮五錢廣皮五錢蠶砂三錢車前子三錢枳實三錢豬苓三錢生苡仁五錢煮三杯分三次服十月二十五日濁濕誤補久留與開太陽闔陽明法數十帖之多雖見大效究未清楚小便仍間有濁時腿仍微有痠痛姜半夏一兩桂枝四錢片薑黃二錢廣陳皮五錢通草一錢川萆薢五錢晚蠶砂三錢川椒炭三錢生苡仁五錢防己三錢豬苓三錢小枳實二錢茯苓皮五錢十一月十八日痹症挾痰飲小便濁喉啞先開上焦後行中下之濕余有原案苦桔梗五錢甘草三錢杏仁五錢半夏一兩雲苓皮五錢生苡仁五錢喉啞服此備用方桂枝四錢廣皮三錢生苡仁五錢雲苓皮六錢半夏六錢蠶砂三錢川萆薢五錢車前子四錢滑石一兩川黃柏三錢鹽水炒便濁服此泄瀉陶四十五歲乙酉年四月十五日久泄脈弦自春令而來古謂之木泄侮其所勝也柴胡三錢豬苓三錢生薑五錢姜半夏五錢炙甘草二錢大棗三枚去核澤瀉三錢廣陳皮三錢茯苓塊五錢桂枝三錢十九日泄瀉已減前數加蒼朮三錢前後共計服十三帖全愈五月初六日前曾木泄與小柴胡湯十三帖而愈向有糞後便紅乃小腸寒濕之症現在脈雖弦而不勁且兼緩象大便復溏不必用柴胡湯矣轉用黃土湯法灶中黃土四兩黃芩炭二錢熟附子三錢茯苓塊五錢連皮炒蒼朮五錢廣皮炭二錢煮三杯分三次服十二日濕溫成五泄先與行濕止泄其糞後便紅少停再擬豬苓五錢蒼朮四錢澤瀉五錢茯苓六錢連皮桂枝五錢苡仁五錢廣皮四錢廣木香二錢煮三杯分三次服以泄止為度八月初六日胃不開大便溏小便不暢脈弦豬苓三錢白蔻仁二錢澤瀉三錢生苡仁五錢茯苓皮五錢廣皮二錢姜半夏三錢柴胡一錢煮三杯分三次服陸二十七歲乙酉年五月十九日六脈弦細面色淡黃泄則脾虛少食則胃虛中焦不能建立安望行經議先與強土藿香梗二錢廣皮炭錢半廣木香錢半白蔻仁一錢雲苓塊三錢蘇梗錢半苡仁二錢姜半夏三錢益智仁一錢煮三杯分三次服七帖二十八日右脈寬泛緩也胃口稍開泄則加添小便不通加實脾利水豬苓三錢澤瀉三錢茯苓五錢苡仁五錢六月十八日前方服十四帖泄止胃稍醒脘中悶舌苔滑周身痹痛六脈弦細而沉先與和中治痹在後桂枝三錢防己三錢益智仁錢半藿香梗三錢杏仁三錢苡仁五錢姜半夏五錢白蔻仁二錢廣皮三錢煮三杯分三次服王三十五歲渴而小便後淋濁此濕家渴也況舌苔黑滑乎議金匱渴者豬苓湯法但前醫大劑地萸五味麥冬龜膠等純柔黏膩補陰封固日久恐難速愈戒豬肉介屬滑膩豬苓六錢萆薢六錢澤瀉五錢初五日渴而小便短便後淋濁與豬苓湯法小便長而淋濁大減渴止舌黑苔退惟肩背微有麻木酸楚之象是臟腑之濕熱已行而經絡之邪未化也與經腑同治法生石膏八錢雲苓塊五錢連皮晚蠶砂三錢杏仁四錢廣皮錢半通草一錢防己二錢萆薢四錢生苡仁四錢桂枝三錢黃柏炭錢半

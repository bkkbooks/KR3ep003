body:
  text: 序醫案之作昉於明人四庫全書醫家類著録薛己陳桷兩家醫案世鮮傳本惟明江瓘名醫類案國朝魏之琇續名醫類案乾隆間長塘鮑氏刊行之同治間有重刻本江氏徵引古今方論附以評語頗多辨證魏氏採托尤繁富而不能免蕪雜之纍若喻嘉言寓意草自述其所治驗而不以醫案名葉天士臨證指南盛行吳越間市醫淺學奉若科律然中多門弟子偽託不皆出於天士故純駁互見膠柱鼓瑟貽誤後來識者病焉淮陰吳鞠通氏以醫名大江南北所著溫病條辨上為吳又可之諍臣下導王孟英之先路亦既家有其書矣金君月笙覃精靈蘭之祕博觀醫家書得鞠通氏醫案手稿分類編次釐為五卷金君謹齋為排印行之而督余序其端余於醫學無所得顧少而善病頗事涉獵因受而卒業為竊嘆是書也可以為醫門之階梯矣其辨微也分肌擘理若屠牛坦一朝解十二牛而芒刃不頓其糾繆也若老吏讞獄雖情偽萬變執吾法以繩之而無所於撓至若療章氏顛狂之疾而先激其羞惡之良心几几於窮理盡性之學治陳某腫脹之疾與陳頌帚論藥齊輕重以決其效不效折座客之氣而卒以服頌帚之心於戲可不謂神矣乎昔杭先生大宗序名醫類案括以三言曰審脈曰辨藥曰慎思其論絶偉余於是書則但取鞠通氏之自道曰認證無差一言盡之矣認證無差非多讀古書善察時變者不能今世言醫者十九下工耳不讀古書不察時變苟焉以醫為市其戕賊於芒昧中者不知其凡幾矣夫守一家之言詎遂足為高手醫然得是書而深究其處方用意之所在觸類以充其識隅反以神其悟由是上通五運六氣三部九候之旨不愆於湯齊先後緩急之序毋以學醫人費蒙世詢病馴至於祲診潛消民無夭札則金君傳布是書之舉不誠為仁人之用心矣乎歲在柔兆執徐塗月吳慶坻序

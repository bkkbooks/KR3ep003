body:
  text: 卷四痘症周女一周零一月庚申六月身熱耳冷隱隱有點防痘夏令感溫暑而發先宜辛涼解肌令其易出切忌辛溫發表致表虛發癢潰爛且助溫熱連翹三錢甘草一錢苦桔梗三錢蘆根三錢炒銀花三錢薄荷八分芥穗八分初二日點出未透仍宜解肌照前方初三日險痘三天來已出齊但頂陷色暗與活血提頂法再色白皮薄兩太陰素虛之體此痘如用羌活防風必致塌癢進苦降必致泄瀉當歸二錢苦桔梗一錢焦白芍錢半銀花三錢白芷二錢黃芩炭錢半木通二錢紫草八分南山楂炭一錢連翹二錢暹邏犀角一錢初四日氣虛則根松頂陷血鬱則色淡盤軟毒重則攢簇且與消毒活血提頂扶過七日能用補托方可有成不然九朝塌癢可慮況現泄瀉當歸二錢土炒甘草錢半白芷二錢紅花一錢暹邏犀角三錢皂針一錢羚羊角三錢連翹三錢苦桔梗二錢紫草錢半炒銀花三錢公雞冠血每大半黃酒杯點三小匙初五日痘五天半氣虛不能解毒外出牽延時日必致內陷塌癢今日仍然外感用事未敢大補亦須少用托法白芷二錢連翹錢半丹皮二錢皂針錢半苦桔梗二錢白歸身三錢甘草五分紫草一錢燕窩根五錢生綿黃耆三錢雞冠血三五匙濃煎一茶杯服完渣再煮濃半杯明早服初六日六天少用補托業已起脹顏色頗鮮但皮薄殼亮今日須大補明日須峻補生綿黃耆五錢苦桔梗三錢雞冠血每一酒杯點三滴炙甘草錢半紫草二錢黨參三錢白歸身三錢廣皮炭一錢白芷二錢川芎一錢燕窩根一兩公雞湯煎藥初七日兩用托補色鮮而潤陷者復起但清漿十之二三亮殼頗多今到七日臟腑已周氣血用事正好施補氣載毒之方生綿耆五錢廣皮一錢炙甘草二錢白芷一錢苦桔梗三錢人參一錢廣木香八分煨肉果錢半川芎四分燕窩根一兩公雞湯煎藥八天痘頂圓綻者不過一二頭面行漿胸背清漿三四四肢全然空亮根盤色淡此氣血兩虛急宜峻補用參歸鹿茸合陳氏異功法人參一錢歸身六錢煨肉果二錢黃毛茸五錢水黃酒另煎苦桔梗三錢白芷三錢廣木香一錢炙甘草三錢燕窩一兩生綿耆一兩茯苓塊三錢廣皮炭三錢公雞湯一中碗此藥煮成四茶杯加茸汁半茶杯雞湯一中碗燕窩湯一碗和勻上火煨濃小人服一半乳母服一半初九日九天昨用峻補兩臂雖有黃漿四肢仍然空亮泄瀉之故用文仲大異功散生嫩耆一兩人參一錢廣木香二錢當歸五錢土炒煨肉果三錢廣皮炭二錢煨訶子三錢於白朮五錢炒上肉桂一錢研細去粗皮茯苓塊六錢炙甘草三錢鹿茸尖六錢酒煎初十日即於前方內去肉桂鹿茸尖歸身減黃耆四錢加澤瀉五錢十一日照前方十二日即於前方內加薏米仁五錢十三日漿未十分滿足四肢間有破損難保無痘毒咳嗽等事茲用利水以助結痂驅逐餘毒即在其中所謂一舉兩得者也洋參三錢澤瀉三錢廣皮炭一錢茯苓塊五錢生苡仁八錢炙甘草錢半焦於朮三錢廣木香三錢煨肉果二錢煨訶子二錢十四日腳腫胸悶溲短水不利也茯苓塊五錢炒銀花二錢冬白朮三錢澤瀉二錢生苡仁五錢廣皮炭錢半飛滑石二錢連翹二錢五穀蟲錢半何男四歲九月初三日三天氣虛毒重黏連成片兼之色滯頂陷攻毒則礙虛溫托則礙毒兩難措手和中安表更不濟事勉議活血擺毒苦桔梗三錢烏犀角五錢連翹三錢生甘草一錢白芷一錢薄荷一錢炙天蟲二錢紫草三錢全歸三錢南楂三錢丹皮三錢羚羊角三錢每一酒杯和豬尾膏三小匙初五日四天昨用活血解毒大有起色但喉聲微啞面目浮腫太甚唇色絳紅時癘之火毒太重今日猶宜解毒苦桔梗六錢暹羅犀角六錢連翹三錢人中黃三錢桃仁錢半古勇黃連一錢天蟲三錢白芷一錢全歸二錢炒楂肉二錢紫草三錢穀精草三錢丹皮三錢羚羊角三錢銀花五錢紫花地丁五錢以銀花紫地丁前湯代水初六日五天半漸有起色但險症變幻不一時刻小心為要今日仍宜活血提頂微加托裡生綿耆三錢紫草三錢紅花三分炙甘草三錢歸身三錢土炒銀花三錢白芷二錢穀精草三錢皂針一錢犀角三錢連翹三錢每一酒杯約加雞冠血三小匙初七日六天半時癘已退氣血用事頭面清漿三四周身亮殼非重用溫托不可看守勿懈不致損破可望成功生黃耆八錢紫草二錢燕窩根五錢炙甘草三錢廣木香錢半歸身三錢黨參三錢白芷二錢雞冠血每酒杯沖三匙初八日七天半漿未及半咬牙寒戰灰白塌陷非陳文仲大異功散不可人參錢半廣皮錢半焦於朮三錢生綿耆八錢廣木香二錢茯苓塊二錢炙甘草三錢白芷三錢糯米三錢上上桂心錢半歸身四錢公雞湯煎初九日八天半昨用大異功法咬牙寒戰已去大半但漿猶未足用異功參歸鹿茸法綿黃耆一兩上上肉桂二錢去粗皮廣木香二錢人參三錢黃毛鹿茸五錢生白芷二錢茯苓塊三錢當歸三錢土炒訶子肉二錢炒焦於朮三錢煨肉果二錢炙甘草錢半廣皮炭半錢熬濃服初十日九天半咬牙寒戰已去十分之九但身上漿清腿足未灌泄瀉頻仍翁仲仁有泄瀉安寧大虛少毒之診今日猶宜峻補如泄瀉不止再加澀腸綿黃耆一兩廣木香錢半人參三錢生鹿茸五錢酒另煎上肉桂二錢白芷二錢炙甘草二錢煨肉果三錢厚朴二錢訶子肉三錢煨十一日十天半用異功散得效但泄瀉不止膚癢漿薄必有餘毒今日仍可托補一天議於明日用實脾利水收痂法俾不盡之熱毒從小便而去生綿黃耆一兩廣木香二錢煨肉果三錢人參二錢廣皮炭二錢炙甘草三錢上肉桂一錢厚朴二錢訶子肉三錢十二日十一天痂雖結而漿薄泄瀉以實脾利水為法仍兼澀腸人參八分煨肉果三錢厚朴二錢焦於朮三錢炙甘草錢半上肉桂一錢茯苓塊三錢炙黃耆五錢生苡仁五錢廣皮炭二錢訶子肉五錢廣木香二錢十三日十二天漿薄微咳痂癢便溏仍當補氣兼與實脾人參八分煨肉果錢半厚朴二錢生黃耆五錢訶子肉二錢廣木香一錢茯苓塊五錢炙甘草三錢焦於朮三錢生苡仁五錢廣皮炭一錢十四日十三天喉啞咳嗽而渴肺中餘毒未清便溏溺短痘後脾虛宜實茯苓塊三錢五穀蟲一錢冬白朮三錢炒厚朴錢半生苡仁五錢苦桔梗三錢訶子肉二錢煨炒銀花二錢地骨皮二錢連翹錢半吳氏五歲辛酉九月二十日險中逆痘三天繁紅扁闊成片不起翁仲仁謂重壅遏其形退縮且煩躁肢逆唇焦舌黃溲短腹痛痘頂先出者已焦勉用雙解法芥穗三錢全歸三錢苦桔梗三錢楂肉三錢生大黃五錢生甘草一錢牛蒡子三錢連翹二錢銀花三錢豬尾三匙入梅片二分熬膏桃仁粉二錢薄荷一錢二十一日四天豔紅扁闊下後稍見起發究不肥綻何能起脹成漿咳嗽痰多且與清涼敗毒活血松肌開提肺氣犀角三錢杏仁三錢紫草二錢和豬尾膏羚羊角三錢苦桔梗五錢銀花三錢連翹三錢甘草一錢大力子三錢芥穗三錢歸尾一錢楂炭五錢二十二日五天密布不齊身熱未退扁闊癟陷形色滯暗不能起脹那得成漿勉於清毒之中兼與活血提頂犀角三錢天蟲三錢杏仁三錢羚羊角三錢歸鬚二錢銀花三錢苦桔梗三錢牛蒡子三錢白芷二錢甘草一錢皂針一錢楂肉二錢連翹三錢紫草二錢雞冠血每杯沖四茶匙二十三日六天頭面雖有行漿之意究竟周身平陷較昨日顏色略潤耳仍與清毒活血提頂少加托裡生黃耆三錢天蟲二錢全歸三錢皂針錢半人中黃一錢杏仁三錢白芷二錢紫草三錢牛蒡子三錢銀花三錢穿山甲一錢苦桔梗五錢犀角三錢雞冠血每杯沖四茶匙二十四日七天頭面行漿周身平塌空殼用伍氏內托法生綿耆八錢大力子三錢炒研白芷二錢全歸三錢苦桔梗三錢川芎錢半炙甘草錢半洋參錢半炒老黃色紫草二錢燕窩根五錢公雞湯一茶杯雞冠血每杯沖三茶匙二十五日八天頭面漿足周身平塌者已起空殼者亦有行漿之勢翁仲仁謂喉啞聲嘶漿行飽滿亦無妨咬牙在七日以後屬氣虛況其食少乎非陰虛也生綿耆八錢炙甘草一錢公丁香四分白芷二錢象貝二錢苦桔梗五錢天蟲三錢洋參錢半炒老黃牛蒡子三錢雞湯一茶杯二十六日九天漿已行及大半但氣虛作癢看守勿懈毋令損破為要生綿耆一兩一錢象貝三錢白芷三錢天蟲三錢苦桔梗六錢牛蒡子三錢洋參二錢冬白朮二錢炙甘草三錢廣木香一錢二十七日十天漿已行及十之七八惟痰咳微癢眼中出膿為可慮生綿耆生甘草穀精草苦桔梗焦冬朮桑葉生苡仁連翹土貝母二十八日十一天濕重小便不利畏寒咬牙洋參錢半廣皮炭錢半生黃耆五錢炙甘草三錢生苡仁五錢冬白朮三錢穀精草三錢茯苓塊三錢二十九日十二天實脾利水以收痂止嗽加辛涼敗毒以護目疾生黃耆二錢地骨皮二錢炙甘草錢半連翹二錢炒冬朮三錢炒銀花二錢茯苓塊三錢穀精草三錢生苡仁五錢初一日十三天濕氣已行痂結過半正氣已化痂落過半飲甚好目開無恙已收全功惟咳嗽減而未清仍宜實脾利水復以辛涼敗毒炒冬朮三錢地骨皮一錢茯苓塊三錢炒銀花錢半生苡仁三錢五穀蟲一錢連翹錢半象貝錢半某七官痘粒分顆原屬純正但殼薄頂平無漿間有二三陷者且有灰色明日七朝氣血用事非峻補不可一切辛竄走里者必不可不用為其溫中而托絡也其走表者斷不可用以其虛表而致塌癢也再九日以後須防泄瀉咳嗽嵩女五個月初十日相火用事病民病溫防發痘先宜辛涼達表切忌發汗連翹二錢銀花二錢甘草一錢苦桔梗二錢杏仁粉二錢薄荷五錢芥穗八分蘆根三把牛蒡子二錢十一日險痘一天連翹二錢銀花二錢苦桔梗二錢甘草一錢紫草一錢蘆根二兩歸鬚八分薄荷八分牛蒡子二錢芥穗一錢煎湯代水十二日脾經險痘二天色重黏連船小載重夜間煩躁先以活血敗毒楂肉三錢大黃一錢連翹二錢當歸八分土炒銀花五錢桃仁泥八分地丁三錢苦桔梗二錢紅花三分人中黃一錢丹皮二錢犀角一錢豬尾膏三小匙白茅根一兩煎湯代水十三日險痘三天色重黏連間有陷頂議涼血提頂連翹二錢細生地錢半銀花錢半歸鬚八分苦桔梗一錢白茅根三錢甘草八分犀角八分紅花五分羚羊角二錢丹皮二錢蘆根三把十四日險痘四天形色俱有起色但頂平便溏耳將就可望有成生黃耆三錢茯苓塊三錢炙甘草錢半沙洋參一錢白芷一錢炒山甲一錢白茅根三錢皂針八分白朮炭二錢炒銀花二錢雞冠血三小匙公雞湯煎藥十五日五天即於前方內去銀花雞冠血加廣皮一錢十六日六天雖然行漿但色灰便溏焦於朮錢半廣木香一錢訶子肉一錢茯苓塊三錢煨肉果錢半炙甘草二錢綿黃耆三錢廣皮炭一錢洋參二錢薑汁炒水煎濃十七日七天業已回漿十分全功但便溏濕重仍有意外之虞法宜實脾利水焦於朮三錢廣木香一錢茯苓塊三錢訶子肉一錢生苡仁三錢煨肉果一錢廣皮炭八分人參一錢姜炒炙甘草一錢嵩女三歲癸亥十一月初十日芥穗錢半藿香葉八分防風錢半薄荷八分連翹二錢杏仁一錢甘草一錢桑葉一錢苦桔梗二錢蘆根二把十一日重險痘一天熱一日而見點陽明絡現黏連成片汗多便溏氣虛毒重九朝塌癢難防勉與擺毒松肌連翹三錢銀花五錢桑葉三錢丹皮二錢紫花地丁五錢先煮代水歸尾八分苦桔梗三錢牛蒡子八分研甘草一錢蘆根五把豬尾膏三匙冰片二釐和入十二日二天出不爽快未三歲之兒九日限期時刻有違陷之慮即於前方內加白茅根五錢暹邏犀角一錢十三日重險三天面貌繁紅殼薄頂陷根松黏連成片身上色淡不起小便清大便多而稀頭溫足冷應作氣虛不能送毒外出看總
隻重九斤紫河車一具此二味亦原方所有但加重耳並藥共十餘斤先分九鍋煎去渣後並一鍋煎自早至暮不敢草率成濃膏得兩碗許令乃母飲半茶杯小人飲半酒杯二鼓時其母因乳脹謂余曰藥甚靈余無乳者已數日今忽蓬蓬豈非藥力乎余曰可急令小孩吮之彼曰小孩不得寐者已數日今方熟睡可驚之乎余曰限期已緊所以令汝服藥為以乳汁上漿也今乳脹可急與之因促之醒痛吮一飽少時又寐漏下三鼓清漿如露矣未至四鼓又令母女服藥如前四鼓未罷漿如蠟色五鼓以後又如茶色濃厚如及時之漿天明已十七朝矣又延謝先生至彼一視曰奇哉何因得此余曰用君原方彼比曰只添得燕窩一味何神至此余曰余作日云此方上得起漿甘受重罰者以先生七八朝即用此方彼時氣血方壯毫無漿汗今已十五朝氣血消耗豈能上漿乎余又謂此方不能上漿亦受重罰者以先生之方如錯小女早不活矣因令伊視方之背伊見照方二十帖之文又令視諸藥渣因謝曰余實不能女二十日十九朝痘後便溏而頻久則脾腎兩傷補澀為穩真雲苓五錢白朮三錢土炒肉果霜三錢半夏一錢訶子肉三錢生苡仁五錢二十四日實脾利水之中兼化清氣於朮三錢土炒五穀蟲三錢雲苓塊五錢晚蠶砂三錢薏仁五錢蟬衣七枚地骨皮三錢初一日三十一天痘後解毒腫潰補托之中加以敗毒人參一錢銀花三錢雲苓三錢黃耆三錢苡仁五錢於朮三錢炙甘草錢半五穀蟲三錢初四日痘後餘毒腫潰稍加銀花敗毒大便即溏議於前方去銀花加肉果霜訶子肉人參一錢五穀蟲二錢肉果霜錢半黃耆三錢訶子肉三錢炒白雲苓三錢炙甘草錢半於朮三錢木香一錢薏仁五錢初七日三十六朝痘毒潰爛應照潰瘍例即用痘科門中之保元合異功法綿耆五錢於朮二錢廣皮一錢炙甘草二錢苡仁三錢人參一錢雲苓五錢初八日傷食暮熱嘔吐痘後太飽之故與止渴消食熱自止夜間不可吃粥地骨皮三錢苡仁三錢雲苓三錢炒神麯錢半半夏二錢炒廣皮一錢男二十日風木司天之年又當風木司令之候風木內含相火時有痘疹無論但受風溫身熱而不發痘或因風溫而竟發痘或發斑疹皆忌辛溫表藥惟與幸涼解肌透絡最穩此時醫所不知蓋風淫所勝治以辛涼佐以苦甘內經之正法也苦桔梗三錢大力子錢半鮮蘆根五錢甘草一錢桑葉三錢薄荷八分汗多不用連翹三錢芥穗一錢銀花三錢二帖此方治初痘起最能化多為少涼絡而易出見點亦服此二十一日申刻險兼逆痘二天痘色焰紅唇赤舌赤見點繁瑣三五成群毒參陽位勉與涼血敗毒苦桔梗三錢地龍三錢連翹三錢人中黃三錢桃仁三錢生石膏八錢研銀花五錢犀尖五錢白茅根三錢丹皮三錢生軍三錢炒黑紫地丁五錢此案為鈔録者失去十四帖大意以犀角地黃湯加連翹銀花茅根細生地等一味涼血收功至十五朝猶用犀角十六朝以辛涼清餘熱一方服至二十一朝趙姑十二歲六月二十二日暑傷兩太陰身熱而嘔舌白滑黃芩炭二錢杏仁三錢白蔻仁一錢半夏三錢生苡仁三錢雲苓皮四錢連翹三錢藿葉二錢銀花三錢二十三日痘三天頂平根松色暗夾虛夾毒之痘與活血提頂敗毒扶到七天方好補托苦桔梗三錢紅花二錢銀花三錢人中黃錢半白芷三錢楂炭二錢大力子二錢防風三錢紫草茸一錢全當歸二錢連翹三錢紫地丁二錢二十四日痘四天頂平根松色暗便閉不食昨用活血敗毒宣絡今夜已見大便熱退能食頭面已有起脹之勢前後心續出盈千皆根泛頂平稍大者頂即陷應照虛寒例治與宣氣活絡提頂不得過用敗毒清裡致令便溏內陷當歸二錢土炒廣皮炭二錢穿山甲一錢炒頂紅花二錢廣木香一錢蘑菰一錢白芷三錢炒銀花三錢炙甘草五分防風二錢楂炭二錢二十五日痘五天頂平帶陷根松色暗昨日即照虛寒例治而用溫煦芳香今日口並不渴而舌苔白厚盛暑之際尚兼足太陰之暑濕痘七日以前外感用事必視其何邪在何臟腑而清之以為七日以後上漿之地當歸土炒廣皮炭二錢生苡仁三錢廣木香一錢藏紅花銀花四錢白蔻仁一錢六一散三錢白芷防風茯苓皮三錢煮四小杯分四次服頭煎五杯水煎兩杯二煎五杯水煎兩杯二十六日痘六天頂平多陷根松色暗頭面之色已華前後心尚多陷而暗身痛口不渴與活血提頂令其易於上漿當歸三錢土炒乳香二錢銀花五錢上紅花二錢沒藥二錢公雞冠血每杯點三匙白芷三錢廣皮三錢生綿耆五錢山甲三錢廣木香二錢炙甘草三錢公雞湯煎煮三杯分三次服二十七日七天已有行漿之勢平頂陷頂尚多加補托以助之二十八日痘八天頭面行漿已有七成臂次於手足次於胸順也胸以下陷頂多面色灰仍須溫煦以助行漿之勢綿黃耆八錢高麗參三錢炙甘草錢半當歸三錢土炒廣木香三錢防風三錢上紅花二錢廣皮三錢雲苓塊三錢白芷三錢二十九日痘九天正在行漿之際便頻眼開即是虛象黏連之處顏色即灰非虛而何急急補托而兼溫煦為要炙綿耆一兩廣皮三錢炙甘草三錢人參三錢廣木香二錢雲苓塊三錢白芷三錢炒於朮三錢防風三錢肉果霜三錢七月初一日十天雖已結痂漿未十分滿足尚有正行漿之處仍用前方再為補托明日收痂未遲初二日十一天痘已結痂漿未十分滿足之故皆因連日便頻受暑積滯而成痢積先擬溫下其積今視四肢鼓立胸前全陷並非正結恐一進沉降並四肢而變陷矣前方系必不可不用之藥茲且暫停勉與實脾利水以收痂少加化積俟十四日之後痘勢收場如積滯未化再與下法雲苓塊五錢連皮黃芩炭錢半炒神麯三錢生苡仁五錢南茶炭二錢黃皮炭三錢焦白朮二錢檳榔二錢益智仁二錢枯山連一錢姜炒初三日痘十二天仍服前原方初四日痘十三天業已結痂原可妥當收功不意盛暑流行之際食物不化致成欲便先痛便後痛減裡急後重之痢疾法當溫下假使畏縮不前拖延日久必無好音莫如乘此邪氣初聚之時急奪其邪冀邪去正存方可收拾一切未完也白芍三錢檳榔三錢生大黃五錢酒炒半黑炒黃芩三錢楂炭三錢熟附子二錢炒山連二錢神麯四錢廣皮炭三錢小枳實三錢赤徭桂錢半煮成三杯先服一杯候一二時俟其再便腹不痛即勿服腹仍痛再服第二杯三杯亦如之初五日痘十四天四肢結痂十有其五昨日服藥後腹痛愈甚便中糞多積少日夜共七八次今用前方減附子一錢桂心二分服後巳刻至未刻便紅積二次腹中仍痛糞色如赭後二杯即加赤桂心八分約服一半杯腹痛即便紅積仍有糞色黃夜半服第三杯寅時連便二次糞色仍赭微有紅積腹仍微痛初六日痘十五天膝下至足趾痂尚未結全巳刻便一次燥糞黃色兼赭色溏糞微滯紅積腹不痛午刻服第一杯至亥刻便一次糞色黃無積醜刻便一次無積糞黃生苡仁五錢黃芩炭錢半高麗參三錢雲苓五錢連皮南楂炭二錢炒神麯三錢炒白芍二錢廣皮炭三錢檳榔二錢山連一錢姜炒赤桂心錢半炙甘草一錢初七日痘十六天痂已結齊痢已痊可不必服藥目帶微腫穀精草泡茶飲之初八日青睛有云翳速清膽絡之熱毒穀精草四兩桑葉三錢連翹三錢茶菊花三錢青葙子三錢初九日痘漿未足毒流膽絡故青睛白翳又感時令燥氣化火故白睛起太陰睛症考古治法治以六味丸作湯改茯苓為君再加清膽絡之熱毒以退翳雲苓塊四錢山藥錢半青葙子二錢澤瀉錢半穀精草三錢萸肉錢半真大生地二錢茶菊花二錢丹皮二錢桑葉二錢初十日仍照前方服加生甘草一錢五分銀花五錢連翹三錢目內白翳稍退煩躁常哭因痘後血虛化燥故也與甘麥大棗湯主之生甘草錢半小麥七合大棗五枚煮粥服之十一日目內白翳仍有身上起大小瘡數十粒復生細痘在舊痂窩內痘漿未足流毒成瘡故也仍服初九日方十二日目內白翳退太陰睛瘡仍在瘡未見消落原方再作服十三日目內太陰睛瘡仍在續出之瘡痘未退仍服原方瘡貼紫草膏加爛草灰十四日藥原方十五日停藥十六日目內太陰睛瘡稍退仍有翳身上瘡已落痂者復生小瘡未落之處復有倒漿欲潰總之流毒未清之故也原方再服目內翳以四退散治之十七至二十三日痘已滿月目內太陰睛瘡未盡翳仍在仍服原方又服錢氏蟬蛻散一日二服蟬衣為末每服一錢羊肝湯下日二服四退散主治目睛老翳人蛻蛇蛻蟬蛻雞蛻即鳳凰衣每藥一兩加梅片一分左眼右鼻聞右眼左鼻聞每聞少許兩月後全愈趙姑乙酉六月十五日體堅痘少原可不必服藥但痘愈少漿更不可不足舌苔厚中黃邊白且與清毒一帖明日再與托漿一帖苦桔梗一錢人中黃八分銀花三錢荷葉邊一角牛蒡子錢半全歸錢半連翹三錢明日服保元法煮兩小杯分二次服十六日於前方內加黨參三錢生綿耆四錢炙甘草一錢半白芷五錢十七日辛涼結痂古人之正法也實脾利水亦有濕者所宜施也茲當暑月舌苔厚而白濕也身熱未盡退熱也二法可合用連翹三錢雲苓塊三錢連皮銀花三錢生苡仁三錢蘆根三錢噎王左尺獨大腎液不充腎陽不安其位尺脈以大為虛經所謂陰衰於下者是也右手三部俱弦食入則痛經所謂陽結於上者是也有陰衰而纍及陽結者有陽結而纍及陰衰者此證形體長大五官俱露木火通明之象凡木火太旺者其陰必素虛古所謂瘦人多火又所謂瘦人之病慮虛其陰凡噎症治法必究陰衰陽結何者為先何者為後何者為輕何者為重此症既系陰虛為本陽結為標何得妄投大黃十劑之多雖一時暫通陽結其如陰虛而愈虛何業醫者豈不知數下亡陰乎且云歧子九法大半皆攻喻嘉言痛論其非醫者豈未之見耶愚謂因怒停食名之食膈或可一時暫用亦不得恃行數用今議五汁飲果實之甘寒牛乳血肉之變化降胃陰以和陽結治其標大用專翕膏峻補肝腎之陰以救陰衰治其本再能痛戒惱怒善保太和猶可望愈真大生地四斤人參四斤杭白芍四斤清提麥冬四斤阿膠四斤蔡龜膠四斤山萸肉二斤鱉甲四斤芡實二斤沙苑蒺藜四斤海參四斤鮑魚四斤豬脊髓一斤羊腰子三十二對雞子黃六十四個雲苓塊四斤烏骨雞一對牡蠣四斤蓮子四斤桂圓肉二斤白蜜四斤取盡汁久火煎煉成膏李五十四歲大凡噎症由於半百之年陰衰陽結古來紛紛議論各疏所長俱未定宗大抵偏於陽結而陰衰者宜通陽氣如旋覆代赭湯進退黃連湯之類偏於陰衰而陽結者重在陰衰斷不可見一毫香燥如丹溪之論是也又有食膈宜下痰膈宜導血膈宜通絡氣膈宜宣肝嘔吐太過而傷胃液者宜牛轉草復其液老僧寡婦強制太過精氣結而成骨橫處幽門宜鵝血以化之廚役受穢濁之氣傷肺酒肉勝食而傷胃宜化清氣不可勝數按此症脈沉數有力而渴面色蒼而兼紅甫過五旬鬚髮皆白其為平日用心太過重傷其陰而又伏火無疑用玉女煎法真大熟地六錢煅石膏八錢牛膝三錢炙甘草三錢麥冬六錢白粳米一撮知母二錢旋覆花三錢新絳紗包每早服牛乳一茶碗張六十三歲老年陽結又因久飲怒郁肝旺剋土氣上阻咽致成噎食按陽氣不虛不結斷非破氣可療議一面通補胃陽一面鎮守肝陰法洋參二錢茯苓塊四錢桂枝六錢代赭石一兩二錢煅半夏一兩旋覆花五錢包生薑六錢七帖二十日陽脈已起恐過涸其液議進陰藥退陽藥洋參四錢桂枝三錢白芍六錢炒旋覆花六錢茯苓三錢炙甘草三錢代赭石一兩煅半夏六錢薑汁每杯沖三小匙二十五日前日脈數因退陽進陰今日脈緩而痰多仍須進陽俾中焦得運以復其健順之體洋參二錢桂枝六錢焦白芍三錢半夏一兩二錢茯苓八錢代赭石一兩六錢旋覆花六錢包生薑五大片二帖傅五十五歲先因酒樓中飲酒食燒小豬響皮甫下咽即有家人報知朋友凶信隨即下樓尋車車伕不知去向因步行四五里尋至其友救難未遇又步行四里又未遇渴急飲冰凍烏梅湯三碗然後買車返家心下隱隱微痛一月後痛有加延醫調治一年不效次年五月飲水一口胃中痛如刀割乾飯不下咽已月餘矣閏五月初八計一粒不下已十日骨瘦如柴面赤如赭脈沉洪有力胃中痛處高起如桃大按之更痛余曰此食膈也當下之因用大承氣湯加牽牛作三碗一碗痛至少腹三碗痛至肛門大痛不可忍又不得下於是又作半劑服一碗外加蜜導法始下如鴨蛋黑而有毛堅不可破次日先吃爛面半碗又次日飲粥湯三日食粥五日吃乾飯矣下後所用者五汁飲也楊四十六歲先因微有痰飲咳嗽誤補於前誤下於後津液受傷又因肝鬱性急致成噎食不食而大便燥六脈弦數治在陰衰炙甘草三錢大生地六錢生阿膠三錢化丹皮三錢麥冬三錢麻仁三錢鬱金八分服七帖而效又於前方加鱉甲四錢杞子三錢服十七八帖而大效進食如常惟余痰飲後以外臺茯苓飲散減廣皮枳實收全功嘔吐金六十八歲癸酉三月二十日舊有痰飲或發嘔吐仍系痰飲見證醫者不識乃用苦寒堅陰無怪乎無可存之物矣議食入則吐是無火例淡吳萸五錢生苡仁六錢乾薑五錢薑汁每次沖三匙半夏八錢廣皮三錢五水杯煮取二杯分二次服渣再煮一杯服一帖二十三日前方業已見效但脈遲緊與通養胃陽淡吳萸三錢生薑五片苡仁三錢人參錢半茯苓二錢半夏三錢不拘帖恆氏二十七歲初因大驚肝氣厥逆嘔吐頻仍復因誤補大嘔不止嘔急避人以剪刀自刎漸即米粒不下體瘦如柴奄奄一息仍不時乾嘔四肢如冰脈弦如絲而徑與烏梅丸法川椒炭四錢黃芩炭一錢薑汁三匙沖半夏四錢雅連二錢薑汁炒烏梅肉五錢遼參三錢吳萸三錢雲苓塊五錢服二帖而進米飲四帖而食粥七帖全愈後以兩和肝胃到底而大安反胃周六十五歲甲子十月二十五日老年陽微濁聚以致胸痹反胃三焦之陽齊閉難望有成議先通胸上清陽栝蔞二錢薤白三錢半夏五錢白蜜半酒杯桂枝尖五錢小枳實八分川朴一錢茯苓二錢薑汁三小匙水八杯煮取三杯分三次服三十日老年陽微濁聚反胃胸痹用開清陽法業已見效但嘔痰仍多議食入則吐為無火例用茱萸湯合大半夏湯淡吳萸八錢自泡洋參三錢薑汁炒生白蜜一酒杯半夏一兩二錢生薑二兩水八杯煮取三杯分三次服渣再煮半碗服初三日即於前方內加茯苓塊五錢初十日即於前方去吳萸加薤白三錢噦王三十歲癸亥六月十五日六脈俱濡右寸獨大濕淫於中肺氣賁郁因而作噦與傷寒陽明足太陰之寒噦有間以宣肺氣之痹為主廣皮二錢生苡仁三錢杏泥二錢通草二錢柿蒂三錢竹茹三錢飛滑石三錢薑汁二小匙衝入十七日泄瀉胸悶於前方加茯苓三錢藿梗二錢十九日脈之濡者已解寸之大者已平惟胃中有飲隔拒上焦之氣不得下通故於其旺時而噦甚今從陽明主治半夏六錢飛滑石三錢茯苓五錢生苡仁廣皮柿蒂二十二日噦雖止而六脈俱數右手更大泄瀉色黑舌黃氣分濕熱可知茯苓皮五錢白通草二錢黃芩炭一錢澤瀉二錢滑石三錢生苡仁三錢白扁豆皮三錢川朴一錢連翹二錢失音朱乙丑二月初二日右脈洪數有力金實無聲麻杏石甘湯證也奈已為前醫發汗麻黃未便再用議清音湯加石杏苦桔梗六錢生甘草二錢半夏六錢葦根五錢石膏六錢杏仁粉五錢水五杯煮成兩杯渣再煮一杯分三次服初三日肺臟本熱為外感所搏實而無聲究系麻杏石甘法為速生石膏一兩麻黃五錢去節炙甘草三錢杏泥六錢半夏五錢初四日右脈洪數已減其半音亦漸開仍用麻杏石甘加半夏一帖麻黃三錢去節炙甘草三錢杏仁霜七錢生石膏一兩研末半夏七錢甘瀾水八碗煮三碗分三次服以後病減者減其治沈二十歲正月二十九日六脈弦細若絲陽微極矣咳嗽便溏納食不旺由上焦損及中焦所以致損之由初因遺精繼因秋傷於濕冬必咳嗽外邪未清驟然用補使邪無出路致咳嗽不已古謂病有三虛一實者先治其實後治其虛現在喉啞治實先與提肺氣治虛與諸虛不足之小建中湯苦桔梗四錢杏泥二錢雲苓五錢生甘草二錢生苡仁五錢姜半夏四錢煎兩杯分二次服二月初六日六脈弦細之極陰陽俱損急需用補以外感未淨喉音未清暫與理肺二帖後再診苦桔梗二錢甜杏仁四錢姜半夏三錢生草二錢茯苓四錢冰糖四錢鮮蘆根四錢煮三小杯分三次服朱四十五歲酒客失音與麻杏石甘湯麻黃五錢生石膏四兩炙甘草三錢杏仁四錢服一帖無汗音不出二帖微汗音出不甚響仍用前法麻黃三錢蜜炙生石膏三兩炙甘草三錢杏仁四錢服五帖音大出但脈滑耳與清音湯草桔梗六錢炙甘草二錢姜半夏六錢服五帖音清脈滑痰飲不盡與外臺茯苓飲法減辛藥茯苓八錢半夏五錢麥冬五錢連心沙參三錢小枳實錢半廣皮二錢甘草錢半七帖而安軟兒十五歲歌唱勞傷肺火喉啞洋參一兩切薄片鮑魚四兩切薄片早晚各取鮑魚片二錢洋參五分煎湯頓服歌時取洋參鮑魚各一片貼牙後腮間咽其津液以後不復啞矣又十六歲因飲酒過度貪食水果寒熱相搏濕熱內壅苦桔梗甘草茯苓蘇梗半夏神麯蘆根數帖而安水氣蘭女十四歲脈數水氣由面腫至足心經謂病始於上而盛於下者先治其上後治其下議腰以上腫當發汗例越婢加朮湯法麻黃五錢去節杏泥五錢炙甘草一錢白朮三錢石膏六錢桂枝三錢水五杯煮取兩杯先服一杯得汗即止不汗再服二十三日麻黃三錢去節生石膏八錢
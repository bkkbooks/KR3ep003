自愈病減者減其治桂枝三錢半夏五錢枳實五錢炙甘草二錢乾薑三錢廣皮三錢五味子錢半蠲飲丸痰飲久驟未能一時猝去業已見效與丸藥緩化可也戒生冷惱怒桂枝半斤廣皮十二兩益智仁四兩乾薑六兩小枳實四兩蒼朮炭六兩半夏一斤炙甘草六兩雲苓二十四兩神麯法丸梧子大每日三服每服三錢飲甚時服小青龍湯陳五十一歲五月初十日人尚未老陽痿多年眩冒昏迷胸中如傷油膩狀飲水多則胃不快此伏飲眩冒狀也先與白朮澤瀉湯逐其飲再以緩治濕熱之陽痿豈有六脈俱弦細而恣用熟地久服六味之理哉於朮二兩澤瀉二兩煮三杯分三次服十三日已效而未盡除再服原方十數帖而愈李四十八歲五月初一日其人向有痰飲至冬季水旺之時必發後因伏暑成痢痢後便溏竟夜不寐者多日寒熱飢飽皆不自知大便不通按暑必夾濕況素有痰飲飲即濕水之所化醫者毫不識病以致如此久臥床褥而不得起議不食不飢不便不寐九竅不和皆屬胃病例與靈樞半夏湯令得寐再商姜半夏二兩秫米二合急流水八杯煮三杯三次服得寐為度十一日諸竅不和六脈純陰皆痰陰為膩補藥所閉昨用半夏湯已得寐而未熟再服前方三帖續用小青龍去表藥加廣皮枳實以和其飲蓋現在面色光亮水主明也六脈有陰無陽飲為陰邪故也左脈弦甚經謂單絃飲澼也有一症必有一症之色脈何醫者盲無所知不知伊一生所學何事寧不愧死桂枝五錢姜半夏六錢白芍三錢炒五味子二錢炙甘草三錢小枳實五錢乾薑二錢廣皮三錢甘瀾水八碗煮成三杯三次服十八日胃之所以不和者土惡濕而陽困也昨日純剛大燥以復胃陽今診脈象較前生動胃陽已有生動之機但小便白濁濕氣尚未暢行胃終不得和也與開太陽闔陽明法半夏二兩豬苓六錢滑石三錢秫米一合澤瀉六錢白通草一錢廣皮三錢桂枝四錢雲苓皮六錢急流水十一碗分二次煮成四碗分四次服五月初三日去滑石通草加川椒三錢炒去汗高五十二歲乙酉五月十六日脈弦痰飲喘咳與小青龍去麻辛加廣皮枳實桂枝五錢姜半夏六錢白芍三錢廣皮三錢炙甘草三錢小枳實五錢乾薑二錢五味子二錢煮三杯分三次服二帖十八日已見小效汗多加淨麻黃根三錢又三帖病減者減其制去桂枝枳實各二錢二十四日服前藥汗少惟喜嚏周身痠痛於原方減乾薑一錢加杏仁防己各三錢董五十四歲五月二十七日脈沉細弦弱咳嗽夜甚久而不愈飲也最忌補陰補陰必死以飲為陰邪脈為陰脈也經曰無實桂枝六錢廣皮三錢炒白芍四錢半夏五錢炙甘草一錢五味子一錢乾薑三錢小枳實二錢四帖六月初一日加雲苓三錢小枳實二錢十七日其人本有痰飲喘咳服小青龍胃口已開連日午後頗有寒熱正當暑濕流行之際恐成瘧疾且與宣通三焦杏仁三錢半夏四錢雲苓皮五錢白蔻仁錢半枳實三錢苡仁五錢廣皮三錢藿梗三錢青蒿二錢二帖十九日寒熱已止脈微弱去蔻仁青蒿加桂枝乾薑以治其咳二十二日咳減寒熱止胃開嗽未盡除脈尚細小效不更方服至不咳為度周二十二歲正月初七日六脈弦緊右脈沉取洪大先從腰以上腫例舌白滑喘而咳無汗從溢飲例之大青龍湯去甘藥為其重而滯也麻黃六錢去節細辛二錢生薑三錢杏仁五錢去皮留尖生石膏末一錢炙甘草二錢桂枝五錢大棗二枚去核煮成三杯先服一杯覆被令微汗佳得汗即止後服不汗再服第二杯如上法十一日溢飲脈緊無汗喘咳浮腫昨用大青龍汗出腫消喘咳減與開太陽闔陽明法半夏五錢蒼朮炭二錢桂枝錢半廣皮三錢豬苓三錢茯苓塊五錢苡仁五錢澤瀉三錢飛滑石五錢煮三杯分三次服已服十數帖後加益智仁二錢蓮子五錢陳七十六歲正月初十日懸飲脈弦左脅不快為水在肝法當用十棗湯近八旬之老人難任藥力與兩和肝胃可也半夏五錢青皮三錢旋覆花三錢包廣皮三錢香附五錢小枳實三錢淡吳萸三錢煮三杯分三次服已服十數帖二十三日脈結加杏泥六錢三帖覺羅六十二歲壬戌正月十三酒客痰飲哮喘脈弦緊數急與小青龍去麻辛加枳實橘皮湯不應右脅痛甚此懸飲也故與治支飲之小青龍不應應與十棗湯以十棗大峻降用控涎丹甘遂五錢大戟五錢白芥子五錢神麯糊丸梧子大先服十三丸不知漸加至二十一丸以得快便下黑緑水為度三服而水下喘止繼以和胃收功汪室女伏暑夾痰飲與三仁湯重加半夏廣皮屢效而熱不退痰不除右脈微結中有塊痰堵塞隧道因延郟芷谷兄針中泉穴紫血出後繼咳老痰二口以後用藥無不見效半月後伏暑痰飲皆愈矣錢三十二歲甲子八月初十日咳嗽胃中停水與小青龍去麻辛重加枳實廣皮五帖已愈八九因回母家為父祝壽大開酒肉其父亦時醫也性喜用人參愛其女遂用六君子湯服關東參數十帖將近一年胃中積水脹而且痛又延其父治之所用之藥大抵不出守補中焦之外治愈脹而愈痛以致胸高不可以俯夜坐不可以臥已數日不食其翁見勢已急力辭其父延余治之余視其目欲努出面色青黃胸大脹痛不可忍六脈弦急七八至之多余曰勢急矣斷非緩藥所能救因服巴霜三分下黑水將近一桶勢稍平以和脾胃藥調之三四日後漸平胃大開於是吃羊肉餃三十二枚胃中大痛一晝夜又用巴霜一分五釐下後痛止嚴禁魚肉一月而安趙四十六歲正月三十日太陽痹則腰脊痛或左或右風勝則引也或喘或不喘者中焦流飲上泛則喘不泛則不喘也切戒豬肉生冷與一切補藥周年可愈六脈洪大已極石膏用少萬不見效命且難保生石膏六兩雲苓皮五錢白通草一錢桂枝五錢半夏五錢黃柏炭二錢杏仁五錢小枳實五錢生苡仁五錢防己四錢煮三杯三次服四帖二月初二日於前方加豬苓三錢滑石一兩小枳實三錢四帖初七日於前方去黃柏炭加半夏五錢桑皮三錢石膏四兩二十七日減石膏止留一兩二十八日石膏仍用四兩因拜掃停藥六天二十九日右脈洪大已減右膏只用一兩三月一日石膏每日用二兩十一日石膏每日用一兩因感燥氣停藥五天十二月十三日石膏每日用二兩共服九帖十四日石膏每日用三兩停藥十天二十二至三十日四月初一至初五日自淮安復至紹興又診得洪大之脈較前已減七八然較之平脈仍大而有力現在小便赤濁陰痿牙縫臭味復出痹痛雖止陽明太陽二經濕熱未淨太陰化氣未復十五日生石膏四兩杏仁四錢雲苓皮五錢苡仁五錢晚蠶砂三錢海金砂五錢滑石六錢木通三錢四帖十九日脈漸退減石膏至二兩加姜夏五錢廣皮三錢二十至二十二日每日用石膏一兩二十三至二十六日每日用石膏二兩二十七日小便不利杏仁四錢雲苓皮五錢生苡仁五錢海金砂五錢木通三錢飛滑石六錢姜半夏五錢陳皮三錢生石膏四兩四帖五月初一日感風寒服桂枝湯初四日仍服前二十七日方三帖內飲招外風為病桂枝四錢廣皮三錢杏仁三錢白芍二錢枳實五錢半夏五錢炙甘草錢半乾薑一錢防己三錢煮三杯先服一杯即啜稀熱粥一碗覆被令微汗即解得汗後余藥不必啜粥四帖十一日前因風寒夾飲之故用小青龍法現在風寒解而飲未除脈復洪大仍與大青龍與木防己湯合法兼治飲與痹也桂枝六錢杏仁四錢防己四錢半夏六錢廣皮三錢飛滑石六錢雲苓皮六錢木通三錢小枳實三錢生石膏六錢八帖十四日其人本有痹症痰飲現在盛暑發泄暑濕傷氣故四肢痠軟少氣口中膠膩欲嘔與局方消暑丸意雲苓塊一兩連皮炙甘草三錢姜夏六錢鮮荷葉一張去蒂薑汁每杯三匙煮三杯三次服三帖十九至二十三日停藥二十四日仍服十一日方至六月初七日止共服十一帖六月初八日停藥十八日氣急欲喘新感暑濕之故於原方加廣皮二錢小枳實二錢五帖二十二日桂枝四錢杏仁四錢防己四錢半夏六錢廣皮三錢枳實三錢滑石六錢雲苓皮六錢木通三錢生石膏六兩四帖二十七日於原方減石膏三兩加滑石六錢共成一兩二錢木通二錢共成五錢蠶砂三錢四帖六月二十九日渴欲飲水水入則吐者名曰水逆五苓散主之蒼朮三錢炒枯桂枝三錢藿香三錢雲苓皮六錢半夏五錢豬苓四錢澤瀉四錢薑汁每杯三匙三帖七月初二日飲食有難化之象於原方去蒼朮加廣皮炭四錢炒神麯三錢益智仁二錢小枳實三錢通胃腑醒脾陽二帖初七日右脈洪數六腑不和食後噁心二便不爽暑濕所幹之故議通宣三焦生石膏三兩廣皮三錢滑石六錢黃芩炭三錢生薑三錢益智仁三錢姜半夏五錢白蔻仁錢半枳實三錢茯苓皮六錢生苡仁五錢二帖初九日加益智仁枳實服一帖中焦停飲晚食倒飽是脾陽不伸之故一以理脾陽立法姜半夏五錢廣皮三錢川椒炭八分煨草果五分雲苓皮五錢益智仁錢半生苡仁五錢白蔻仁錢半小枳實二錢煮三杯三次服二帖十七日停飲兼痹脈洪向用石膏無不見效數日前因食後倒飽脈不大石膏已近三十斤之多轉用溫醒脾陽方法絲毫不應水之蓄聚如故跗腫不消胃反不開右脈復洪大有力小便短思天下無肺者無溺肺寒者溺短熱者溺亦短仍用石膏涼肺胃生石膏四兩廣皮五錢杏仁六錢半夏五錢枳實五錢雲苓皮五錢桂枝三錢防己四錢苡仁五錢四帖二十一日加雲苓皮五錢共成一兩杉木皮五錢減石膏二兩二十二日至二十四日石膏用四兩二十五日至二十八日石膏用二兩共服八帖二十九日飲聚不行小便已清少時即便臭濁六腑之不退可知大藥已用不少而猶然如是病機之頑鈍又可知矣議暫用重劑余有原案生石膏四兩枳實五錢杏仁八錢飛滑石一兩先煎防己三錢半夏八錢雲苓皮八錢廣皮四錢海金砂八錢八月初一日初二日加石膏二兩初七日又加石膏二兩初十日減廣皮四錢枳實二錢以上共服七帖九月初四日脈之洪大不減加石膏二兩至二十七日共服二十帖服石膏至五十斤之多而脈猶浮洪千古未有如是之頑病皆誤下傷正於前誤補留邪於後之纍今日去補陽明藥蓋陽明之脈大也生石膏八兩杏仁一兩雲苓皮一兩飛滑石二兩防己五錢小枳實五錢木通三錢煮四杯四次服專以苦淡行水服一二帖再商初九日生石膏四兩共成十二兩九帖十三日脈洪滑痰飲未除晨起微喘足跗腫未消盡余有原案生石膏八兩雲苓皮六錢杏仁四錢滑石一兩葶藶子三錢木通四錢生苡仁六錢半夏六錢十五日氣已不急去葶藶右脈仍浮洪加石膏一倍成一斤三帖十六日氣急者得葶藶而止右脈之洪大者得石膏一斤大減病減者減其制但仍滑數加行痰飲生石膏六兩枳實三錢杏仁四錢雲苓皮五錢半夏一兩香附五錢廣皮四錢旋覆花四錢包二帖十八日脈漸小減石膏二兩二帖二十日脈洪數加石膏八兩成十二兩二帖二十二日脈減減石膏六兩加葶藶一錢五分二帖二十三日至二十五日共服二帖脈之洪大者得石膏一斤大減病減者減其制脈復洪大有力再酌加其制生石膏十二兩枳實五錢杏仁四錢雲苓皮五錢半夏一兩香附五錢廣皮四錢旋覆花四錢包二十九日小便短加滑石一兩十月初一日停藥三日初四日氣喘於原方加石膏四兩共成一斤杏仁四錢共成八錢廣皮二錢共成六錢加桂枝六錢生薑四錢五帖初二日服妙應丸二分六釐大棗三枚煎湯下清晨服後約二刻先從左脅作響墜痛至少腹便下緑水膠痰碗許初三日服妙應丸二分六釐大棗二枚煎湯下便痰水如前湯藥未服妙應丸方金匱謂凡病至其年月日時復發者當下之此症痰飲兼痹自正月服藥至十月石膏將近百斤之多雖無不見效究未拔除病根左脅間漉漉有聲不時嘔咳此水在肝也金匱謂水在肝十棗湯主之又謂偏弦飲澥又謂咳家之脈弦為有水十棗湯主之又謂咳家一百日至一歲不死者十棗湯主之合而觀之此症當用十棗無疑但十棗太峻南人膽怯未敢驟用降用妙應丸續續下之庶無差忒也制甘遂五錢白芥子五錢制大戟五錢神麯為丸小梧子大從三十丸明起得下痰水即止停數日水不盡再服以盡為度初四至初七共服五帖初八日石膏一斤飛滑石一兩蘇子霜二錢旋覆花四錢雲苓皮六錢廣皮三錢小枳實五錢半夏一兩杏仁八錢三帖十一日服妙應丸三分十二日脈仍洪大有力生石膏八兩杏仁四錢半夏六錢雲苓皮六錢廣皮三錢香附三錢旋覆花四錢苡仁六錢一帖十三日杏仁八錢半夏一兩廣皮四錢雲苓皮五錢小枳實五錢香附三錢旋覆花四錢滑石一兩蘇子霜二錢桂枝六錢生石膏一斤二十二至二十九日去香附加蘇子霜五帖服妙應丸三分四釐服之即下痰水十一月初四日服妙應丸三分八釐下痰水如前右脈洪數本有飲聚小便不長生石膏一斤苡仁六錢雲苓皮六錢小枳實四錢半夏六錢杏泥六錢飛滑石一兩白通草二錢蠶砂三錢煮三杯三次服初六日服妙應丸三分八釐下痰水如前十二日於前方加廣皮三錢石膏八兩十三日加枳實二錢旋覆花四錢絹包補十一日於前方加鬱金三錢十四日加蘇子霜四錢共服五帖十五日服妙應丸六分自服丸藥每次皆下痰水惟此次未下以服藥後即食粥故也二十三日服妙應丸六分大便仍行痰水十一月十七日痰飲喘咳右脈洪左關獨浮與建金制木法生石膏八兩青皮三錢杏仁六錢旋覆花四錢蘇子霜三錢香附四錢半夏六錢十八至二十六共服五帖二十七日洪大之脈已退惟兩關獨浮右大於左而兼實木陷入土與兩和肝胃兼開膀胱小便短而水易停故也半夏六錢蘇子霜三錢香附三錢白芍四錢酒炒旋覆花三錢滑石一兩青皮二錢雲苓皮六錢廣皮三錢十二月初一日數日不服石膏右脈復洪數左關之獨浮者亦未十分清淨與金木同治法生石膏六兩半夏六錢杏仁六錢滑石一兩香附四錢旋覆花四錢雲苓皮六錢枳實六錢以後凡右脈大者服此小即停止初三日服妙應丸六分下痰水如前仍服初一日原方二帖初五日於初一日方內加桂枝五錢廣皮四錢至初九日止以畏寒故也初十日服妙應丸八分下痰水如前十一日於前方去桂枝廣皮脈不肯小故也服至十五日止十六日服妙應丸一錢丙戌正月十四日金匱謂心下堅大如盤水飲所作枳朮丸主之茲雖不堅大而水停不去病情相合再脈洪大洪大甚則喘發最宜服石膏杏仁但石膏不可入丸方議用橘半枳朮丸脈小時用開水下脈大時暫用石膏湯送下喘發加杏仁脈復小不用石膏鵝眼小枳實一斤茅山蒼一斤炒半枯廣皮炭六兩姜半夏十兩神麯湯法丸梧子大每服三錢日三服夏日間服消暑丸亦可陳四十六歲病由瘧邪傷胃土虛則水泛以致喘而肢軟正虛邪實六脈俱結且有塊痰塞滯經脈隧道病有三虛一實者先治其實後治其虛杏泥廣皮三錢枳實四錢雲苓姜半夏六錢蘇子霜二錢甘瀾水八碗煮成三碗分早中晚服二帖初六日脊病痹也右腿偏軟痿也咳嗽而喘支飲射肺也日久不愈皆誤用熟地等補塞隧道之故脈洪生石膏末一兩杏泥五錢桂枝五錢防己四錢片薑黃三錢姜半夏五錢廣皮炭三錢茯苓皮五錢苡仁五錢煮四碗四次服二帖退石膏一兩加赤苓一兩再二帖後加石膏一兩青橘葉五錢二月初二日痹夾痰飲與開痹蠲飲法現在痹解而飲未除脈之洪大者減病減者減其制姜半夏五錢桂枝五錢防己三錢廣皮三錢茯苓塊六錢苡仁五錢小枳實三錢青橘葉三錢煮三杯三次服初八日加小枳實二錢廣皮二錢滑石六錢初九日加生石膏一兩十一日肝鬱夾痰飲咳嗽痰多吐瘀旋覆花三錢姜半夏六錢青皮二錢廣皮炭二錢栝蔞仁二錢蘇子霜三錢降香末三錢歸橫須二錢桃仁泥二錢青橘葉三錢煮三杯三次服丸方痰飲夾肝鬱吐出瘀血後以兩和肝胃為主帶皮苓八兩姜半夏十兩香附六兩廣鬱金二兩廣皮五兩益智四兩生苡仁八兩澤瀉八兩共為極細末神麯水為丸梧子大日三服每服三錢開水下二月初五日暑濕行令脈弦細胃不開渴而小便短用渴者與豬苓湯法豬苓五錢雲苓塊四錢澤瀉五錢半夏四錢滑石六錢廣皮三錢益智仁錢半煮三杯三次服胃開即止初六日痰飲之質冒暑欲嘔六脈俱弦雖渴甚難用寒涼與局方消暑丸法姜半夏八錢雲苓塊八錢藿梗二錢廣皮三錢生甘草二錢生薑汁每杯沖三小匙煮三杯三次服初八日病減者減其制減半夏四錢雲苓四錢十二日腰以下腫當利小便渴而小便短議渴者與豬苓湯例豬苓八錢澤瀉八錢飛滑石一兩二錢雲苓皮六錢姜半夏四錢煮三杯三次服以渴減腫消為度十四日脈沉細胃不開減豬苓三錢澤瀉三錢滑石六錢加藿梗三錢廣皮三錢益智仁三錢十六日暑濕病退小便已長陽氣不振與通補陽氣桂枝三錢姜半夏三錢茅朮二錢白蔻仁一錢研雲苓塊五錢生苡仁五錢廣皮二錢炙甘草二錢煮三杯三次服十七日頭脹胸悶脈緩氣歉暑必夾濕也半葉藿梗三錢白蔻仁錢半姜半夏三錢雲苓皮五錢廣皮三錢苡仁五錢杏仁三錢煮三杯三次服十九日小便濁加豬苓四錢澤瀉四錢二十四日暑月頭脹微痛與清上焦藿香三錢薄荷一錢鮮荷葉一張去蒂煮三杯三次服二十五日六脈陽微暑濕之餘小便白濁與分利法川萆薢五錢澤瀉三錢雲苓皮五錢桂枝三錢蒼朮三錢炒益智仁三錢豬苓三錢生苡仁五錢煮三杯三次服以小便清為度七月十九日濕熱為病與苦辛淡法雲苓皮五錢姜半夏五錢飛滑石六錢豬苓三錢木通三錢澤瀉三錢苡仁五錢桂枝三錢杏泥三錢煮三杯三次服二十二日濕熱為病與苦辛淡法小便已長胃不甚開與闔陽明姜半夏六錢益智仁三錢廣皮三錢雲苓皮五錢苡仁五錢生薑三錢二十五日加白蔻仁三錢枳實三錢九月二十一日痰飲喘咳脈弦與小青龍法桂枝三錢杏仁四錢小枳實三錢白芍二錢炒姜半夏五錢五味子二錢炙甘草一錢廣皮三錢乾薑二錢煮三杯三次服三帖二十四日痰飲脅痛而喘咳是謂懸飲懸飲者水在肝也脈弦數身熱者外風未淨也姜半夏六錢杏仁三錢旋覆花三錢桂枝三錢香附三錢廣皮二錢小枳實一錢薑汁二匙黃芩炭錢半青蒿三錢苦葶藶二錢服法如前一帖二十五日身熱退去青蒿黃芩炭葶藶加杏仁三錢二帖二十七日痰飲脅痛而喘咳是謂懸飲懸飲者水在肝也脈弦數姜半夏六錢香附三錢杏泥三錢桂枝尖三錢廣皮二錢薑汁三匙旋覆花三錢蘇子霜三錢降香末三錢小枳實三錢服法如明十九日病減者減其制去半夏三錢枳實一錢蘇子霜一錢降香一錢桂枝一錢五帖而愈十一月初六日痰飲脈沉弦有微喘之意與小青龍去麻辛桂枝四錢乾薑二錢雲苓塊三錢白芍三錢五味子錢半炙甘草二錢廣皮三錢姜半夏五錢小枳實三錢服法如前三帖而愈十二月初七日內飲招外風為病喘咳脈弦緩雖頭痛惡寒能大食只有風而無寒用小青龍去麻黃減細辛兼用桂枝湯啜稀粥令微汗法桂枝一兩白芍四錢炒五味子二錢細辛五分炙甘草三錢乾薑三錢姜半夏五錢加廣皮四錢枳實四錢生薑三錢大棗二枚去核煮三杯先服一杯即啜稀粥一碗覆被令微汗佳不可使汗淋漓得汗服第二杯不必啜粥覆被如不汗再啜粥覆被如前汗後避風要緊初十日脈不浮外感已解但弦細而畏冷中陽虛也去細辛加桂枝四錢乾薑二錢小枳實二錢十三日於前方加廣皮二錢十三日脈雙弦咳而嘔胃咳也姜半夏八錢雲苓塊一兩生薑五錢廣皮三錢小枳實三錢煮三杯三次服正月十六日脈沉弦而緩飲居右脅嘔痰由肋痛外至脊背惡寒由厥陰內犯陽明外犯太陽也與逐脅下之飲法蘇子霜三錢香附三錢桂枝尖三錢旋覆花三錢廣皮三錢小枳實二錢降香末三錢青皮二錢生薑五錢姜半夏五錢乾薑二錢

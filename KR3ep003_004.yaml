三錢甘草梢錢半雲苓皮五錢澤瀉三錢飛滑石六錢苡仁三錢木通二錢晚蠶砂三錢服至小便暢為度二十四日脈洪數小便反黃加黃柏滑石莖痛止去甘草七月初四日小便已長腫未全消脈弦滑咳嗽多痰半夏六錢生苡仁五錢廣皮四錢雲苓皮五錢豬苓三錢萆薢五錢澤瀉三錢張二十歲七月十九日身熱頭痛腰痛肢痛無汗六脈弦細兩目不明食少寒濕痹也熟附子三錢川烏頭二錢羌活二錢桂枝五錢澤瀉三錢苡仁五錢廣皮三錢防己三錢雲苓皮五錢杏仁五錢二帖五月初三日服前方二帖頭痛止旋即誤服他人補陰之品便溏腹脹今日復診因頭痛愈用原方去羌活治藥逆加厚朴三錢已服三帖初八日痹症已愈頗能健步便溏泄瀉皆止目已復明胃口較前加餐因服一帖脈稍數寒濕有化熱之象當與平藥逐其化熱之餘邪而已雲苓皮五錢防己二錢滑石六錢桑枝五錢澤瀉三錢晚蠶砂三錢苡仁五錢杏仁二錢六月十八日又感受暑濕泄瀉脈弦腹脹與五苓法桂枝五錢澤瀉三錢雲苓皮五錢蒼朮三錢炒大腹皮三錢廣木香二錢豬苓四錢廣皮三錢苡仁五錢煮三杯三次服趙氏四十七歲六月二十日太陽寒痹脈弦背心板著而痛桂枝五錢雲苓皮五錢防己三錢川椒炭三錢川烏頭三錢白通草一錢生苡仁五錢二十五日服前藥已效而背痛難除加附子二錢七月初二日脈已回陽痛未止每日服半帖六日三帖加木通三錢晚蠶砂四錢初九日脈仍小陽未回背仍痛再服三帖分六帖趙三十六歲五月初六日痹症夾伏濕脹痛且有肥氣濕已化熱故六脈洪滑本寒標熱先治其標本當緩治生石膏四兩防己四錢半夏五錢杏仁六錢桂枝六錢川朴五錢廣皮四錢初十日尺脈洪數更甚加黃柏三錢木通三錢雲苓皮六錢十二日尺脈仍洪腹痛欲便便後肛門熱痛原方再服二帖十六日水停心下漉漉有聲暫與逐水無暇治痹廣皮五錢半夏六錢枳實六錢生薑五錢甘瀾水八茶杯煮成三水杯三次服十九日水響退腹脹甚仍服前方去黃柏加大腹皮二十三日痹少減胃不開其人本有肥氣肥氣成於肝鬱暫與兩和肝胃半夏六錢降香末三錢廣皮三錢益智仁二錢青皮二錢川朴三錢香附三錢雲苓塊五錢六月初三日右脈大而數加黃芩二錢去川朴初五日諸症向安脈亦調適胃口亦開以調理脾胃立法雲苓塊五錢白蔻仁錢半苡仁五錢黃芩炭二錢廣皮二錢半夏五錢二十日誤服西瓜寒冷未有不發停飲者公丁香八分半夏五錢益智仁錢半乾薑三錢白蔻仁一錢廣皮三錢雲苓五錢小枳實三錢錢三十四歲五月二十九日寒痹脈弦短澀而緊由腿上連少腹痛不可忍甚至欲厥兼有痰飲胃痛桂枝六錢廣皮三錢防己四錢川烏頭三錢川椒炭三錢小茴香三錢炒雲苓皮五錢片薑黃三錢生苡仁五錢海桐皮三錢六月初一日左脈稍長仍然緊甚再服二帖丸方寒濕為病萆薢四兩小茴香四兩炒川椒炭三兩苡仁八兩蒼朮六兩炒雲苓皮八兩川楝子三兩熟附子二兩木通四兩共為細末神麯糊丸小梧子大每服三錢薑湯下楊氏二十六歲乙酉正月初七日前曾崩帶後得痿痹病者自疑虛損詢病情寒時輕熱時重正所謂經熱則痹絡熱則痰者也再行經有紫有黑經來時不惟腰腿大痛少腹亦痛經亦不調或多或寡日數亦然此不但濕熱且有瘀血治濕熱用湯藥治瘀血用丸藥左脈浮取弦沉取寬泛右脈浮取弦沉取洪湯藥用諸痹湯取太陰法丸藥用化癥回生丹生石膏二兩桂枝四錢通草一錢杏泥五錢雲苓皮五錢片薑黃三錢防己四錢晚蠶砂三錢海桐皮三錢苡仁五錢煮三杯三次服嶽四十六歲暑濕痹症誤以熟地等柔藥滑脾致令泄瀉臥床不起兩足蜷曲不伸飲食少進兼之疝痛先以五苓散加川椒廣皮木香止其泄繼以半夏廣皮良薑益智白蔻開其胃復以丁香川椒吳萸雲苓苡仁薑黃平其疝又以防己杏仁桂枝烏頭苓皮川椒等伸其痹末惟引痛風在筋也重用地龍桂枝引痛亦止後補脾胃而愈王四十六歲寒濕為痹背痛不能轉側晝夜不寐二十餘日兩腿拘攣手不能握口眼歪斜煩躁不寧畏風自汗脈弦舌苔白滑面色昏暗且黃睛黃大便閉先以桂枝杏仁苡仁羌活廣皮半夏茯苓防己川椒滑石令得寐繼以前方去川椒羌活加白通草蠶砂萆薢得大便一連七八日均如黑蛋子服至二十餘劑身半以上稍輕背足痛甚於前方去半夏加附子片薑黃地龍海桐皮又服十數帖痛漸止又去附子地龍又服十數帖足漸伸後用二妙丸加雲苓苡仁萆薢白朮等藥收功何二十六歲手足拘攣誤服桂附人參熟地等補陽以致面赤脈洪數小便閉身重不能轉側手不能上至鬢足蜷曲絲毫不能移動細詢病情因大飲酒食肉而然所謂濕熱不攘大筋軟短小筋弛長軟短為拘弛長為痿者也與極苦通小腸淡滲利膀胱法龍膽草四錢蘆薈三錢胡黃連三錢生石膏八兩地龍三錢白通草二錢茯苓皮六錢飛滑石一兩穿山甲三錢桑枝五錢杏仁三錢晚蠶砂四錢防己五錢前方服至七日後小便紅黑而濁臭不可當半月後手漸動足漸伸一月後下床扶桌椅能行四十日後走至檐前不能下階又半月始下階三月後能行四十里後因痰飲用理脾收功此症始於三月二十三日至八月二十二日停藥周四十二歲兩腿紫絳而腫上起細瘡如痱已三年矣兩腿足痠痛不能立六脈弦細而緊竇氏扁鵲新書謂之蘇木腿蓋寒濕著痹也附子八錢烏頭六錢苡仁一兩桂枝一兩雲苓皮一兩煮四杯分四次服服三十餘帖則始策杖能行後去烏附用通經活絡滲濕而愈成五十四歲腰間痠軟兩腿無力不能跪拜間有腰痛六脈洪大而滑前醫無非補陰故日重一日此濕熱痿也與諸痿獨取陽明法生石膏四錢海桐皮二錢晚蠶砂三錢白通草二錢生苡仁八錢雲苓皮
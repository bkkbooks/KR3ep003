body:
  text: 卷一風溫初六日風溫脈浮數邪在上焦胸痞微痛穢濁上干清陽醫者誤認為痰飲陰邪之干清陽而用薤白湯又有誤認傷寒少陽經之脅痛而以小柴胡治之者逆理已甚無怪乎譫語煩躁而胸痞仍不解也議辛涼治溫以退熱芳香逐穢獨以止痛連翹三錢知母錢半藿香梗二錢銀花三錢苦桔梗二錢牛蒡子二錢人中黃一錢薄荷八分石膏五錢廣鬱金錢半牛黃清心丸一丸日三服初七日風溫誤汗昨用芳香逐穢雖見小效究未能解今日脈沉數乃上行極而下也渴甚議氣血兩燔之玉女煎法合銀翹散加黃連夜間如有譫語仍服牛黃丸生石膏八錢連翹四錢知母四錢生甘草二錢丹皮五錢真川連錢半銀花六錢細生地六錢連心麥冬六錢煮取三碗分三次服初八日大勢已解余焰尚存今日脈浮邪氣還表連翹二錢麥冬五錢銀花六錢白芍錢半丹皮二錢炒知母一錢黃芩炭八分細生地三錢生甘草一錢今晚一帖明早一帖初九日脈沉數有力邪氣入里舌老黃微黑可下之然非正陽明實證大滿大痞可比用增液足矣元參兩半麥冬一兩細生地一兩煮成三碗分三次服完如大便不快再作服快利停服初十日昨服增液黑糞已下舌中黑邊黃口渴面赤脈浮下行極而上也自覺飢甚陽明熱也仍用玉女煎加知母善攻病者隨其所在而逐之生石膏八錢細生地五錢生甘草三錢生知母六錢麥冬六錢白粳米一撮斷不可食粥食粥則患不可言十一日邪少虛多用復脈法二甲復脈湯姚三十二歲三月初二日風溫誤認傷寒發表致令神呆譫語陽有汗陰無汗大便稀水不爽現在脈浮下行極而上也先渴今不渴者邪歸血分也連翹二錢銀花三錢元參三錢竹葉心一錢丹皮二錢犀角二錢桑葉一錢甘草一錢麥冬三錢牛黃清心丸三次服六丸初三日昨用清膻中法今日神識稍清但小便短脈無陰大便稀水議甘苦合化陰氣法其牛黃丸仍服大生地五錢真川連一錢生牡蠣一兩黃芩二錢丹皮五錢犀角三錢麥冬五錢人中黃一錢水八碗煮取三碗分三次服明早再一帖初四日即於前方內去犀角加生鱉甲一兩白芍一兩初五日大熱已減余焰尚存小便仍不快用甘苦合化陰氣法細生地八錢炒黃柏二錢丹皮四錢炒知母二錢連心麥冬六錢生甘草二錢生白芍四錢生牡蠣五錢生鱉甲八錢黃芩二錢今晚一帖明日二帖初七日溫病已解邪少虛多用復脈法真大生地六錢炒白芍六錢連心麥冬六錢炙甘草二錢麻仁三錢生牡蠣六錢知母二錢黃柏二錢生阿膠三錢三帖三日十一日熱淫所遏其陰必傷議於前方內去黃柏知母加鱉甲沙參以杜病後起燥之路即於前方內去知母黃柏加生鱉甲六錢沙參三錢湯甲子年四月十三日風溫自汗連翹三錢銀花二錢甘草一錢苦桔梗二錢杏仁二錢牛蒡子三錢薄荷八分豆豉二錢蘆根三把今晚二帖明早一帖午前服完十四日即於前方內加連心麥冬三錢細生地三錢王十歲風溫發疹初起肢厥脈不甚數勢非淺鮮連翹五錢薄荷三錢甘草二錢牛蒡子五錢桑葉三錢荊芥穗三錢藿梗四錢鬱金三錢桔梗五錢元參五錢蘆根湯煎共為細末六錢一包一時許服一包明日再服李六十歲三焦濁氣不宣自覺格拒用通利三焦法仍以上焦為主藿梗三錢廣皮炭二錢鬱金二錢桔梗三錢黃芩炭錢半杏仁三錢連翹錢半服三帖病痊陳氏七十歲風溫咳嗽黏痰脈弦數曾吐血絲血沫此風溫而誤以治風寒之辛溫法治之也當用辛涼甘潤桑葉二錢生甘草一錢白扁豆皮三錢沙參三錢杏仁二錢桔梗二錢茶菊二錢麥冬二錢梨皮五錢以上三人溫病日久不解六脈全無目閉不言四肢不動宛如死去有一日一夜者有二日者有三日者有手足不溫亦不甚涼者有涼如冰者有微溫者誠如吳又可所云體厥脈厥之證僉用紫雪丹續續灌醒繼以復脈湯收功趙二十六歲乙酉年四月初四日六脈浮弦而數弦則為風浮為在表數則為熱證現喉痛卯酉終氣本有溫病之明文雖頭痛身痛惡寒甚不得誤用辛溫宜辛涼芳香清上蓋上焦主表表即上焦也桔梗五錢豆豉三錢銀花三錢人中黃二錢牛蒡子四錢連翹三錢荊芥穗五錢鬱金二錢蘆根五錢薄荷五錢煮三飯碗先服一碗即飲百沸湯一碗覆被令微汗佳得汗後第二三碗不必飲湯服一帖而表解又服一帖而身熱盡退初六日身熱雖退喉痛未止與代賑普濟散日三四服三日後痊愈趙四十二歲丙戌年正月初九日脈浮風溫咽痛項強頸微腫舌伸不長宜開提肺氣為主桔梗三錢連翹三錢殭蠶三錢人中黃二錢銀花三錢牛蒡子二錢荊芥三錢薄荷二錢張六十七歲甲申年正月十六日本有肝鬱又受不正之時令濁氣故舌黑苔口苦胸痛頭痛脈不甚數不渴者年老體虛不能及時傳化邪氣也法宜辛涼芳香連翹三錢桔梗三錢豆豉三錢荊芥二錢薄荷錢半生甘草一錢鬱金二錢元參三錢銀花三錢藿梗三錢共為粗末蘆根湯煎十七日老年肝鬱挾溫昨用辛涼芳香今日舌苔少化身有微汗右脈始大邪氣甫出但六脈沉取極弱下虛陰不足也議辛涼藥中加護陰法桔梗三錢麥冬三錢元參五錢甘草錢半豆豉二錢細生地三錢連翹二錢銀花三錢蘆根三錢今日一帖明日一帖每帖煮二杯十八日老年陰虧邪退十分之七即與填陰耳聾脈芤可知其陰之所存無幾與復脈法炙草三錢白芍六錢阿膠三錢麥冬八錢麻仁三錢大生地八錢十九日較昨日熱退大半但脈仍大即於前方內加鱉甲六錢以搜餘邪二十日脈靜便溏再於前方內加牡蠣八錢收陰甘草三錢守中風溫者震方司令而化溫也溫邪化熱先傷乎肺繼而變證甚繁總之手三陰見症為多治法宜辛涼不宜辛溫宜甘潤不宜苦降蓋辛溫爍肺苦降傷胃今觀先生之治則有辛涼解肌甘寒退熱芳香利竅甘苦化陰時時輕揚存陰退熱諸法種種有條方全法備則先生不亦神聖工巧之手乎舒配瑭溫疫章七十歲溫熱發斑咽痛生石膏一兩人中黃二錢苦桔梗六錢知母四錢射干三錢芥穗二錢元參五錢銀花六錢牛蒡子五錢黃芩二錢連翹六錢馬勃二錢犀角三錢葦根白茅根煎湯煮成四碗日三服夜一服溫斑三日猶然骨痛胸痛咽痛肢厥未張之穢熱尚多清竅皆見火瘡目不欲開脈弦數而不洪口乾燥而不渴邪毒深居血分雖有藥可治恐高年有限之陰精不足當此燎原之勢又恐不能擔延十數日之久刻下趁其尚在上焦頻頻進藥速速清陽再以芳香透絡逐穢俾邪不入中下焦可以望愈約二時間服紫雪丹二分宣泄血絡之穢毒連翹一錢銀花一錢犀角五分薄荷三分牛蒡子一錢炒研丹皮五分人中黃三分桔梗一錢白茅根五分元參一錢鬱金四分藿香梗五分炒黃芩三分芥穗三分馬勃三分葦根五分射干五分周十二時八帖照前方加金汁五匙仍周十二時服八帖照前方加犀角三分黃連三分炒枯仍周十二時八帖邪有漸化之機但心火熾盛陰精枯而被爍當兩濟之犀角一兩先煎銀花六錢生白芍六錢細生地八錢連翹六錢麥冬一兩連心黃連四錢先煎丹皮一兩生甘草四錢白茅根五錢鮮荷葉四錢煮成四碗分四次服仍用前藥一帖先煮半帖約八分二杯除先服昨日余藥一碗外晚間服此二碗余藥明早煮成緩緩服之如前日法邪去八九收陰中兼清肺胃血分之熱而護津液生白芍六錢大生地一兩沙參三錢炙草三錢柏子霜三錢火麻仁三錢麥冬八錢白茅根五錢八分三杯三次服裡熱甚胸悶骨痛必須補陰而不宜呆膩生白芍四錢沙苑子二錢細生地五錢沙參三錢麥冬五錢柏子霜三錢冰糖二錢廣皮炭錢半王三十八歲五月初十日溫熱系手太陰病何得妄用足六經表藥九帖之多即以傷寒論自開闢以來亦未有如是之發表者且柴胡為少陽提線經謂少陽為樞最能開轉三陽者今數數用之升提太過不至於上厥下竭不止汗為心液屢發不已既傷心用之陽又傷心體之陰其勢必神明內亂不至於譫語顛狂不止也今且救藥逆治病亦在其中溫病大例四損重逆難治何謂四損一曰老年真陽已衰下虛陰竭一曰嬰兒稚陰稚陽未充一曰産婦大行血後血舍空虛邪易乘虛而入一曰病久陰陽兩傷何謂重逆玉函經謂一逆尚引日再逆促命期今犯逆藥至九帖之多豈止重逆哉連翹三錢銀花三錢薄荷八分麥冬八錢丹皮五錢桑葉三錢元參五錢細生地五錢羚羊角三錢辛涼芳香甘寒法辛涼解肌分發越太過之陽甘寒定騷擾復喪失之陰芳香護膻中定神明之內亂十一日過服辛溫汗出不止神明內亂譫語多笑心氣受傷邪氣乘之法當治以芳香紫雪丹五錢每服一錢其湯藥仍服前方日二帖十二日靈樞溫熱論曰狂言失志者死況加以肢厥冷過肘膝脈厥六部全無皆大用表藥誤傷心陽致厥陰包絡受傷之深如是現在危急之秋只有香開內竅使錮蔽之邪一齊湧出方妙且喜舌苔之板者已化微有渴意若得大渴邪氣還表脈出身熱方是轉機即於前方內加犀角三錢如譫語甚約二時辰再服紫雪丹一錢十三日肢厥脈厥俱有漸回之象仍服前方二帖晚間再服紫雪丹一錢牛黃丸一粒明早有譫語仍服紫雪丹一錢不然不必服十四日厥雖回而噦目白睛面色猶赤連翹二錢元參五錢丹皮三錢銀花二錢麥冬五錢犀角一錢細生地五錢煅石膏三錢羚羊角三錢今晚一帖明早一帖十五日即於前方內加柿蒂六錢黃芩二錢鬱金三錢日二帖十六日諸症悉減但舌起新苔當防其復連翹二錢元參三錢丹皮二錢銀花二錢麥冬三錢犀角五分黃芩二錢鬱金二錢牛蒡子二錢柿蒂二錢細生地三錢今晚一帖明早一帖謝五月初三日酒客脈象模糊苔如積粉胸中鬱悶病勢十分深重再舌苔刮白大便晝夜十數下不惟溫熱且兼濁濕豈傷寒六經藥可治連翹錢半滑石三錢鬱金二錢銀花二錢藿香二錢生苡仁三錢杏仁三錢黃連錢半豆豉二錢薄荷一錢今晚一帖明早一帖初四日溫病始終以護津液為主不比傷寒以通陽氣為主連翹三錢黃芩二錢桑葉三錢甘草八分麥冬五錢銀花三錢薄荷一錢豆豉二錢黃連二錢滑石三錢今晚一帖明早一帖初五日舊苔已退新苔又出邪之所藏者尚多脈象之模糊者較前稍覺光明連翹三錢麥冬四錢通草八分銀花三錢薄荷八分天花粉三錢桑葉二錢滑石三錢黃芩二錢杏仁三錢藿香葉八分黃連二錢鮮蘆根三錢初六日脈洪舌滑而中心灰黑余皆刮白濕中穢濁須重用芳香連翹三錢荷葉邊二錢豆豉三錢銀花二錢通草錢半鬱金三錢薄荷一錢滑石五錢藿香三錢黃芩二錢蘆根五錢黃連三錢今晚一帖明早一帖初七日溫病已有涼汗但脈尚數而協熱下利不止議白頭翁湯法白頭翁五錢生白芍二錢秦皮三錢黃芩三錢黃連三錢初八日熱邪雖退而脈仍未靜尚有餘熱未清大泄十餘日大汗一晝夜津液喪亡已多不可強責小便再胃之上脘痛有責之陽衰者有責之痰飲者有責之液傷者茲當熱邪大傷津液之後脈尚未靜猶然自覺痰黏斷不得作陽衰論且陽衰胸痹之痛不必咽津而後痛也與甘苦合化陰氣法既可以保胃汁又可以蓄水之上源得天水循環水天一氣自然暢流麥冬六錢炙草三錢大生地五錢火麻仁三錢生牡蠣五錢黃連一錢炒黃芩一錢沙參三錢象貝母二錢煮三碗三次服渣煮一碗明早服初九日即於前方內加丹皮三錢赤芍三錢初十日肺脈獨大仍渴思涼連翹三錢知母二錢銀花三錢桑葉三錢黃芩二錢杏仁三錢生甘草一錢煅石膏三錢今晚一帖明早一帖十一日左關獨大仍喜涼物餘熱未清小便赤用苦甘法黃連一錢知母二錢黃
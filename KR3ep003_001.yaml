喉仍微痛小便不暢明曉再服一帖如喉痛已止小便亦暢可少啜粥湯靜俟十六日換方服藥十六日脈靜身涼用一甲復脈湯炙甘草六錢大生地六錢阿膠三錢麥冬五錢白芍六錢麻仁三錢牡蠣八錢趙初六日熱病脈七至煩躁無寧晷譫語神昏汗出輒復熱脈不為汗衰內經所謂見三死不見一生雖愈必死也余向來見此症每用一面大劑護陰清熱一面搜逐心包之邪獲效亦不少但黃帝岐伯所云之死症誰敢謂必生勉與玉女煎法生石膏四兩次生地八錢知母一兩麥冬八錢甘草五錢京米一合煮五杯分五次服外服紫雪丹初七日溫熱未清又加溫毒喉腫舌腫唇腫項強面色反青伏毒不發與痘科之悶痘相似可與代賑普濟散一時許服一包鮮荷葉邊湯煎其紫雪丹照舊服不可斷有好牛黃清心丸亦可初八日熱病瘛瘲痙厥神昏脈洪大而芤與育陰潛陽咸以止厥法但喉舌之腫未能一時消盡可與代賑普濟散間服其紫雪丹仍用細生地一兩麥冬四錢連心生白芍五錢勾藤勾三錢丹皮四錢生鱉甲八錢生牡蠣八錢犀角三錢黃芩二錢煮三杯分三次服初十日左脈洪而有力右脈甚軟是溫邪日久陷入下焦血分無疑古謂三時熱病深入下焦血分者每借芳香以為搜逐之用仍用紫雪丹五分一次約三次熱退神清能言即止次生地一兩丹皮三錢生鱉甲六錢生白芍五錢麥冬五錢連心生龜板六錢生牡蠣六錢生甘草五錢生阿膠五錢藥化入十一日汗已得而脈未靜宿糞已解而腫未消神未清其代賑普濟散仍服一二次紫雪丹仍服三五分其湯藥與重收陰氣生白芍五錢細生地一兩生甘草五錢麥冬五錢黃芩三錢生牡蠣二錢研粉煎湯代水煮三杯分三次服渣再煎一杯明日服十二日汗出脈靜身涼之後甫過七八日忽又身熱脈洪數有力便澀口渴思涼乃餘邪續出以當日受邪之時非一次也並非食後勞復之比但久病不宜反復恐氣血不支也與玉女煎法紫雪丹三分一次身熱神昏瘛瘲則服否則止生石膏八錢生甘草三錢知母五錢細生地五錢麥冬五錢黃芩三錢京米一撮十三日減石膏十四日今日脈浮大下行極而上也生石膏二兩另煎有熱則加知母五錢次生地八錢生鱉甲五錢生甘草四錢龜板五錢麥冬六錢生牡蠣五錢京米一撮頭煎三杯今夜服二煎兩杯明早服若能睡熟但令穩睡不可呼之服藥十五日今日右脈已小左脈仍壯邪氣又歸下焦血分先用紫雪丹以搜之繼之培陰清熱熱淫於內治以鹹寒佐以苦甘法知母五錢生甘草四錢生牡蠣六錢次生地一兩丹皮四錢生鱉甲六錢黃柏三錢麥冬六錢生龜板六錢生白芍三錢煮五杯今晚服三杯明早兩杯十六日今日右脈復浮而大猶思涼飲暫與玉女煎法其芳香搜逐邪濁之法仍不能止生石膏一兩知母五錢生甘草四錢次生地六錢麥冬六錢生鱉甲六錢京米一合煮四杯分四次服十七日今日右脈稍沉而小左脈仍洪大而浮餘邪續出神識反昏微瘛瘲肢微厥非吉兆也舌上津液已回大便甚通自始至終總無下法只有護陰一面搜逐深入之伏邪大生地一兩生鱉甲五錢生甘草四錢丹皮三錢勾藤勾三錢生白芍六錢生牡蠣五錢麥冬六錢阿膠三錢生龜板五錢煮五杯分五次服十八日神清改方十九日溫毒日久諸症漸減惟脈未靜應照邪少虛多例其不盡之邪付之紫雪可也生白芍四錢鉤藤三錢生鱉甲五錢大生地八錢麥冬六錢生龜板五錢炙甘草三錢羚羊角三錢生牡蠣五錢丹皮四錢阿膠三錢煮四杯分四次服二十日病雖漸次就退伏熱猶未清楚暫與少加清熱之品生白芍四錢鉤藤二錢次生地一兩生甘草三錢羚羊角三錢丹皮三錢麥冬六錢生牡蠣六錢黃芩二錢生鱉甲四錢煮三杯分三次服二十一日猶有瘛瘲仍從少陽中求之再用紫雪丹一錢分二次服劉六十歲癸丑年七月初九日溫病誤表津液消亡本系酒客熱由小腸下注溺血每至半盆已三四日矣又亡津液面大赤舌苔老黃而中黑唇黑裂大便七日不下勢如燎原與急下以存津液法大承氣減枳朴分量加丹皮犀角初十日昨日下後舌上津液已回溺血頓止與清血分之熱焦白芍四錢犀角四錢麥冬四錢丹皮五錢銀花五錢細生地五錢生甘草二錢天冬二錢十一日照前方十二日前方加麻仁三錢十三日前方四帖十七日邪去七八已能進粥陰虛甚於餘邪復脈湯去參桂薑棗二帖十九日照前方加生牡蠣生鱉甲二帖二十一日照前方又加生龜板服二十一帖八月初十日照前方又加海參二條鮑魚片五錢服二十帖史氏二十七歲癸丑年七月初一日溫熱誤汗於前又誤用龍膽蘆薈等極苦化燥於後致七月胎動不安舌苔正黃爛去半邊目睛突出眼眶之外如蠶豆大與玉女煎加犀角以氣血兩燔脈浮洪數極故也生石膏四兩知母一兩炙甘草四錢犀角六錢京米一撮細生地六錢麥冬五錢初二日煩躁稍靜胎不動余如故照前方再服三帖初五日大便不通小便數滴而已溺管痛舌苔黑唇黑裂非下不可雖有胎經云有故無殞故無殞也生大黃六錢元明粉四錢川朴一錢枳實一錢煮兩杯分二次服得快便即止初六日下後脈靜身涼目睛漸收與甘寒柔潤初十日復脈湯去剛藥十四日復脈加三甲二十日服專翕大生膏十二斤至産後彌月方止趙五十五歲癸丑年六月二十六日體瘦無子過服桂附津液枯燥於二十二日得溫熱自服補中益氣湯三帖致邪無出路服辛涼輕劑二帖竹葉石膏湯三帖至七月初二日煩躁不寐並不臥床赤身滿地混抓譫語乾熱無汗舌黃與調胃承氣湯加元參一小劑得大便少許隨出赤紅疹數十枚少安半日其症如前與沃陰之甘涼法二三日大躁大狂又與調胃承氣湯一小帖又出疹數十枚又少安熱總不退脈總不靜如是者前後共下十三次出疹十三次而後脈靜身涼服復脈湯七帖後作專翕大生膏半料計十二斤半年後始復原此證原案已失舉其大略以備一格王三十八歲溫病狂熱大渴引飲周十二時飲涼水擔余癲狂譫語大汗不止每日用白虎湯合犀角地黃湯石膏用半斤日服二帖外用紫雪一兩有餘間服牛黃清心丸五六丸如是者七八日熱始漸退藥漸減後以復脈湯收功溫疫者厲氣流行而兼穢濁戶戶皆然如役所使也是證也悉從口鼻而入先病手太陰而後延布三焦治法一以護陰清熱逐穢為主然法者規矩也規矩不能使人巧巧用在人也今於其證中之有證者先生則法中之有法病見極重之證方施至重之方然未嘗有一毫護此失彼之弊如案中王趙史劉數姓之疴非先生胸有定見法施奇絶安望其生耶真乃運用之妙存乎一心豈庸手所能乎至於精微妙旨善讀者細玩案中自知其妙豫不敢再加妄論也舒配瑭
